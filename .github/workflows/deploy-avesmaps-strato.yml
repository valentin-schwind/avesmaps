name: Deploy Avesmaps to STRATO

on:
  push:
    branches:
      - master
    paths-ignore:
      - "tiles/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show which files would be uploaded"
        required: true
        default: true
        type: boolean
      delete_remote_files:
        description: "Delete remote files that are no longer in the deploy package"
        required: true
        default: false
        type: boolean
      upload_tiles:
        description: "Upload the tile pyramid"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: avesmaps-strato-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SFTP
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AVESMAPS_HOST: ${{ secrets.AVESMAPS_HOST }}
      AVESMAPS_PASSWORD: ${{ secrets.AVESMAPS_PASSWORD }}
      AVESMAPS_PORT: ${{ secrets.AVESMAPS_PORT }}
      AVESMAPS_REMOTE_PATH: ${{ secrets.AVESMAPS_REMOTE_PATH }}
      AVESMAPS_USER: ${{ secrets.AVESMAPS_USER }}
      DEPLOY_DIR: /tmp/avesmaps-deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 💣 Until 2026-08-05 not one of these tests ran on a deploy, and one of them had been red
      # for weeks without anyone noticing. That is not a footnote: the red one is the guard against
      # a claim about the slope model that two players had already caught in public, and while
      # everyone was used to it being red, the same claim quietly survived in api/README.md for a
      # month. A gate nobody watches is not a gate. This step is the gate.
      #
      # ⚠️ WHAT IT DOES NOT COVER, so nobody reads "the gate" as "everything":
      #   * .github/scripts/__tests__/*.test.py -- the asset-stamping chain (AGENTS.md §7), which
      #     this very workflow depends on. Needs a python step.
      #   * tools/svg-export/__tests__/*.js that do not end in .test.js -- the endpoint runs start a
      #     real server and stay out ON PURPOSE, so a port problem cannot hold up a deploy (AGENTS.md §9).
      # 🪤 Hier stand bis zum 15.09.2026 auch „21 *.mjs tests under tools/ -- SIX of them are red and
      #    would block every deploy". Das Tor faehrt sie seit dem 24.08.2026, und sie sind gruen.
      #
      # ⚠️ It runs BEFORE the secret check on purpose: a fork push or a workflow_dispatch should
      # fail on broken tests rather than on a missing secret. (There is no pull_request trigger,
      # so it does not fire on PRs at all -- an earlier version of this comment claimed it did.)
      - name: Install PHP and SFTP client
        shell: bash
        run: |
          set -uo pipefail

          # The tests carry their own guard against a missing extension and abort loudly, which is
          # why a missing package shows up as FATAL rather than a pass.
          # ⭐ lftp kommt seit dem 15.09.2026 HIER mit, nicht mehr in einem eigenen Schritt vor dem
          #    Upload: das war ein zweites `apt-get update` je Lauf. Und der Aufraeumschritt braucht lftp
          #    auch in einem Lauf, der nichts hochlaedt (siehe „Retire orphaned remote files").
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            php-cli php-mbstring php-curl php-sqlite3 php-gd lftp > /dev/null

          # 💣 Diese Zeile steht bewusst EINZELN und mit `|| true`. Am 25.08.2026 stand `php-sodium`
          # in der Pflichtliste darueber -- das Paket gibt es auf ubuntu-24.04 nicht ("E: Unable to
          # locate package"), apt endete mit 100, und weil GitHub diesen Schritt als `bash -e`
          # startet, war der Deploy tot, BEVOR ein einziger Test lief. Das `set -uo pipefail` im
          # Skript hebt das `-e` NICHT auf. Ein fehlendes Zusatzpaket darf den Deploy nicht stoppen:
          # ohne sodium ueberspringt sich der Discord-Signaturtest selbst (sauber, mit Exit 0).
          sudo apt-get install -y --no-install-recommends php-sodium > /dev/null 2>&1 || true
          php -r 'echo "sodium: ", extension_loaded("sodium") ? "da" : "fehlt", PHP_EOL;'

          php -v | head -1
          echo "node $(node -v)"

      - name: Run the unit tests
        shell: bash
        run: |
          set -uo pipefail

          # ⭐ PARALLEL seit dem 15.09.2026. Vorher lief die Liste Datei fuer Datei -- rund vier der fuenf
          #    Minuten eines Deploys, auf einem Runner mit vier Kernen. .github/scripts/run-tests-parallel.sh
          #    faehrt sie auf allen Kernen, gibt jedem Test ein EIGENES Temp-Verzeichnis und faehrt einen
          #    roten Test einmal allein nach (allein gruen = ::warning mit Namen, kein Abbruch). Es setzt
          #    auch zend.assertions=1 -- ohne das ist assert() ein No-op und jeder Test gruen.
          #    Die Muster stehen bewusst weiter HIER: das ist die Stelle, an der man nachsieht (AGENTS.md §9).
          #
          # Two conventions, both real: __tests__/*.php under api/ and tools/, and test-*.php
          # directly under tools/{paths,routing,wikidump}. The second set was invisible to the
          # first version of this gate -- 30 files, among them the wiki_key folding guard that
          # AGENTS.md §5 names by hand.
          # Dieselbe Zweigleisigkeit bei JS -- und aus demselben Grund uebersehen: neben den
          # __tests__/*.test.js liegen 21 test-*.mjs unter tools/{paths,routing}, die in KEINEM Tor
          # liefen. Am 24.08.2026 waren sieben davon rot, und in KEINEM Fall war der Code kaputt: sie
          # hielten Literale fest, die das Projekt bewusst geaendert hatte (Flussfaktor 1.5 -> 2.0,
          # Stunden mit einer statt zwei Nachkommastellen, aus einer IIFE herausgeloeste Funktionen, ein
          # umbenannter Knopf). Ein Test ausserhalb des Tors misst nicht die Software, er verrottet --
          # und meldet dann Fehler, die es nicht gibt.
          #
          # ⚠️ The parentheses are load-bearing: -o binds looser than the implicit -a, so without
          # them the second branch swallows the first one's -name and the whole thing silently
          # returns only the __tests__ set. Shipped wrong once (2026-08-05) -- 88 instead of 118,
          # and the gate looked like it had grown when it had not. If you touch these lines, count.
          # 💣 UND MIT -print0 BRAUCHT ES EINE KLAMMER MEHR, UM BEIDE GRUPPEN: ohne sie bindet -print0
          #    nur an die zweite, und das Tor faehrt 21 von 312 Dateien mit „null rot" (AGENTS.md §9).
          #    Das Skript nennt die Dateizahl im Protokoll, und tools/__tests__/tor-parallel.test.js haelt
          #    die Ausgabe dieser zwei Zeilen gegen eine Zaehlung, die find nicht benutzt.
          {
            find api tools \( \( -path '*__tests__*' -name '*.php' \) -o \( -name 'test-*.php' -not -path '*__tests__*' \) \) -print0
            find js tools \( \( -path '*__tests__*' -name '*.test.js' \) -o \( -name 'test-*.mjs' -not -path '*__tests__*' \) \) -print0
          } | bash .github/scripts/run-tests-parallel.sh

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for secret_name in AVESMAPS_HOST AVESMAPS_PASSWORD AVESMAPS_PORT AVESMAPS_REMOTE_PATH AVESMAPS_USER; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Missing secret::${secret_name} is not configured."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Prepare deploy package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          deploy_items=(
            ".htaccess"
            "index.html"
            "favicon.ico"
            "og-image.jpg"
            "llms.txt"
            "site-summary.md"
            "robots.txt"
            "sitemap.xml"
            "admin"
            "api"
            "assets"
            "css"
            "edit"
            "fonts"
            "icons"
            "img"
            "html"
            "js"
            "map"
            "politics"
            "scripts"
            "tools/wikidump"
            # 🔴 NUR diese eine Datei, nie "uploads" als Ganzes. /uploads sind LAUFZEITDATEN --
            # hochgeladene Wappen, Bilder, DB-Backups -- und dort ist der SERVER die Quelle,
            # nicht das Repo. Ein Verzeichnis-Eintrag liesse den Deploy etwas anfassen, dessen
            # Inhalt er nicht kennt. Die .htaccess ist die Ausnahme: Konfiguration, kein Datum.
            # Sie setzt CSP + nosniff fuer SVG-Wappen -- ein SVG kann <script> tragen und liefe
            # direkt aufgerufen im Ursprung von avesmaps.de.
            "uploads/wappen/.htaccess"
            # Dieselbe Ausnahme fuer die beiden anderen Schutzdateien unter /uploads:
            # db-backups sperrt Dumps MIT PASSWORT-HASHES, dumps die Wiki-Rohdaten. Beide
            # wirken heute (403 gemessen), sind aber von Hand dorthin gekommen -- ohne
            # diese Zeilen bliebe ihr Schutz davon abhaengig, dass das jemand wiederholt.
            "uploads/db-backups/.htaccess"
            "uploads/dumps/.htaccess"
          )

          copy_item() {
            local item="$1"

            if [[ -e "$item" ]]; then
              mkdir -p "$DEPLOY_DIR/$(dirname "$item")"
              cp -a "$item" "$DEPLOY_DIR/$item"
            fi
          }

          copy_full_deploy_package() {
            local item

            for item in "${deploy_items[@]}"; do
              copy_item "$item"
            done
          }

          should_deploy_file() {
            local file="$1"
            local item

            for item in "${deploy_items[@]}"; do
              if [[ "$file" == "$item" || "$file" == "$item/"* ]]; then
                return 0
              fi
            done

            return 1
          }

          # ⭐ Der Aufraeumschritt („Retire orphaned remote files") laeuft nur, wenn seine Liste NEU sein
          #    kann: bei jedem vollen Paket und wenn dieser Workflow im Push steckt. Begruendung dort.
          # 🔴 Bewusst NICHT an SKIP_DEPLOY gekoppelt -- ein Push, der nur die Liste aendert, laedt nichts
          #    hoch und soll trotzdem raeumen.
          retire_vormerken() {
            echo "RETIRE_ORPHANS=true" >> "$GITHUB_ENV"
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Preparing full deploy package."

            copy_full_deploy_package
            retire_vormerken

            if [[ "${{ inputs.upload_tiles }}" == "true" && -e "tiles" ]]; then
              copy_item "tiles"
            fi
          else
            echo "Preparing changed-files deploy package."

            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"

            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              echo "No usable base SHA found; preparing full deploy package instead."

              copy_full_deploy_package
              retire_vormerken
            else
              if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
                echo "Base commit $base_sha is not available locally; preparing full deploy package instead."
                copy_full_deploy_package
                retire_vormerken
              else
                changed_files=$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$head_sha")

                if grep -qxF ".github/workflows/deploy-avesmaps-strato.yml" <<< "$changed_files"; then
                  echo "Dieser Workflow steckt im Push -- verwaiste Server-Dateien werden geraeumt."
                  retire_vormerken
                fi

                if [[ -z "$changed_files" ]]; then
                  echo "No changed deployable files found."
                  echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
                else
                  while IFS= read -r file; do
                    if should_deploy_file "$file"; then
                      copy_item "$file"
                    fi
                  done <<< "$changed_files"
                fi
              fi
            fi
          fi

          rm -f "$DEPLOY_DIR/.env"
          rm -f "$DEPLOY_DIR/api/.env"
          rm -f "$DEPLOY_DIR/api/config.local.php"
          rm -f "$DEPLOY_DIR/map/google-sheets-credentials.json"
          rm -f "$DEPLOY_DIR/map/google-sheets-token.json"
          rm -f "$DEPLOY_DIR/map/Aventurien_routes.svg"
          rm -f "$DEPLOY_DIR/map/"*.py
          rm -f "$DEPLOY_DIR/map/requirements-"*.txt

          find "$DEPLOY_DIR" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "$DEPLOY_DIR" -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "Aventurien_routes.backup-*.svg" \) -delete

          if ! find "$DEPLOY_DIR" -mindepth 1 -print -quit | grep -q .; then
            echo "Deploy package is empty."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # 🔴 DIE PUNKT-DATEIEN IMMER MITNEHMEN, auch wenn sie sich nicht geaendert haben.
          #
          # 🪤 Der Deploy ist INKREMENTELL: er kopiert nur, was der Push angefasst hat. Eine
          # .htaccess, die seit Monaten unveraendert im Repo liegt, kommt damit NIE auf den Server
          # -- uploads/wappen/.htaccess lag zwei Laeufe lang im Repo UND in der Allowlist und war
          # trotzdem wirkungslos. Erst eine Zeile Kommentar darin hat sie angestossen.
          #
          # 🔴 Warum das mehr als ein Schoenheitsfehler ist: wer eine SCHUTZ-.htaccess ins Repo
          # legt, sieht sie im Diff, sieht den Deploy gruen -- und haelt den Bereich fuer
          # geschuetzt. Betrifft api/_internal, api/_schema, api/diagnostics, scripts,
          # tools/wikidump und uploads/db-backups (dort liegen Dumps mit Passwort-Hashes).
          # ⚠️ Alle diese Pfade antworten heute mit 403/404 -- kein Loch, aber bisher kein
          # Verdienst des Deploys.
          #
          # ⭐ Bewusst HIER und nicht als eigener lftp-Schritt hinterher: ins Paket gelegt, nimmt
          # der mirror sie auf dem normalen Weg mit -- kein zweiter Verbindungsaufbau, keine
          # zweite Fehlerquelle. Ein solcher Extraschritt war der erste Entwurf; er arbeitete auf
          # dem PAKET statt auf dem Repo und reichte damit nur nach, was ohnehin schon drin war.
          # 🔴 HINTER dem "Paket leer?"-Check, und das ist tragend: davor waere das Paket NIE
          # leer, SKIP_DEPLOY nie gesetzt -- jeder Push, auch einer, der nur .github/ anfasst,
          # loeste dann einen vollen Deploy samt Asset-Stempelung aus. Die Punkt-Dateien
          # fahren mit, wenn ohnehin deployt wird; sie erzwingen keinen Deploy.
          # ⚠️ Gefiltert durch should_deploy_file: eine .htaccess ausserhalb der Allowlist (etwa
          # unter uploads/) geht weiterhin NICHT mit, ausser ihr Pfad steht ausdruecklich drin.
          while IFS= read -r htaccess_file; do
            if should_deploy_file "$htaccess_file"; then
              copy_item "$htaccess_file"
              echo "Punkt-Datei mitgenommen: $htaccess_file"
            fi
          done < <(git ls-files | grep -E '(^|/)\.htaccess$' || true)


          echo "Deploy package:"
          find "$DEPLOY_DIR" -maxdepth 2 -mindepth 1 | sort

      - name: Stamp asset versions
        if: env.SKIP_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Die Einstiegsseiten werden IMMER neu gestempelt und ins Paket gelegt -- auch wenn nur ein
          # referenziertes Asset (nicht die Seite selbst) geaendert wurde, denn sonst zeigten sie noch
          # auf den alten Hash. Sie sind winzig und werden ohnehin nie hart gecacht.
          entries=(index.html)
          for page in html/*.html; do
            [[ -f "$page" ]] && entries+=("$page")
          done

          # Das Skript folgt der ganzen Referenzkette (index.html -> css/styles.css -> base/tokens.css
          # -> ...) und legt jede Datei mit ins Paket, die es dabei umschreiben musste. Hashes werden
          # aus dem vollstaendigen Checkout ($PWD) berechnet -> unveraenderte Assets behalten ihren
          # Hash und bleiben clientseitig gecacht.
          python3 .github/scripts/stamp-asset-versions.py \
            --asset-root "$PWD" --deploy-dir "$DEPLOY_DIR" "${entries[@]}"

          # Beweis, dass die Kette stimmt, BEVOR hochgeladen wird: ein falscher Hash faellt sonst
          # nirgends auf (Deploy gruen, Datei auf dem Server korrekt) und wuerde die Nutzer bis zu
          # einem Jahr auf dem alten CSS festhalten. Siehe docs/asset-caching-and-versioning.md.
          python3 .github/scripts/verify-stamped-chain.py \
            --asset-root "$PWD" --deploy-dir "$DEPLOY_DIR" "${entries[@]}"

          echo "Stamped reference sample:"
          grep -oE '(src|href)="(js|css)/[^"]+"' "$DEPLOY_DIR/index.html" | head -n 5 || true
          grep -oE '@import url\("[^"]+"\)' "$DEPLOY_DIR/css/styles.css" | head -n 3 || true

      - name: Deploy package
        if: env.SKIP_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mirror_options=(
            "--reverse"
            "--verbose"
            "--parallel=4"
            "--exclude-glob=api/config.local.php"
            "--exclude-glob=api/.env"
            "--exclude-glob=.env"
          )

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            mirror_options+=("--dry-run")
          fi

          if [[ "${{ inputs.delete_remote_files }}" == "true" ]]; then
            mirror_options+=("--delete")
          fi

          lftp -u "$AVESMAPS_USER","$AVESMAPS_PASSWORD" -p "$AVESMAPS_PORT" "sftp://$AVESMAPS_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          cd "$AVESMAPS_REMOTE_PATH"
          mirror ${mirror_options[*]} "$DEPLOY_DIR" .
          bye
          EOF

      # ⭐ SEIT DEM 15.09.2026 NUR, WENN DIE LISTE NEU SEIN KANN: bei jedem vollen Paket und wenn dieser
      #    Workflow im Push steckt (RETIRE_ORPHANS, gesetzt in „Prepare deploy package"). Vorher lief der
      #    Schritt bei JEDEM Upload -- eine eigene SFTP-Verbindung und rund 10 s, um Dateien zu loeschen,
      #    die seit dem ersten Lauf nicht mehr da sind. Und umgekehrt lief er NICHT, wenn ein Push nur
      #    diese Liste aenderte (SKIP_DEPLOY); auch das ist damit behoben.
      # ⚠️ Die Luecke, die bleibt: wird der Lauf, der die Liste aendert, abgebrochen oder von einem
      #    wartenden ersetzt (AGENTS.md §9), rechnet der naechste ab dem abgebrochenen Commit und raeumt
      #    nicht. Dann den Workflow mit dem naechsten Commit noch einmal anfassen -- eine Kommentarzeile
      #    genuegt.
      - name: Retire orphaned remote files
        if: env.RETIRE_ORPHANS == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry run: skipping deletion of retired files."
            exit 0
          fi

          # Allowliste verwaister Server-Dateien (alte Pfade aus der Zeit vor der css-Umstrukturierung
          # in Unterordner). Im Repo existieren sie nicht und keine Seite referenziert sie mehr.
          # Chirurgisches, idempotentes rm -f statt eines gefaehrlichen globalen --delete.
          echo "Retiring orphaned remote files:"
          printf '  %s\n' "css/leaflet.css" "css/political-territory-wiki-tree.css" "icons/small_webp/ (retired: flattened into icons/)" "js/map-features/map-features-questroute.js (retired: adventures questroute dropped)" "css/features/questroute.css (retired: adventures questroute dropped)" "api/discord/sapi-probe.php (retired: temporaere Messung zur aufgeschobenen Antwort, 24.08.2026)" "css/components/editor-spalten-reiter.css (retired: Telefon-Reiter des Territorien-Editors, zurueckgebaut 13.09.2026)" "js/ui/editor-spalten-reiter.js (retired: dito)" "api/edit/admin/wiki-merker-bereinigung.php (retired: einmalige Bestandsreparatur, gefahren 14.09.2026)" "api/_internal/map/wiki-merker-bereinigung.php (retired: dito)"

          # 🔴 14.09.2026: die Nur-Server-PHP-Dateien aus dem ersten Server-Inventar
          #    (.github/workflows/server-php-inventar.yml). Alt-Tests unter _internal/**/__tests__, die
          #    Diagnose-Sonden, die Abenteuer-Endpunkte samt Bibliotheken und zurueckgebaute Laeufe --
          #    keine ruft eine Funktion, die das Repo noch braucht (per Tokenizer gegengeprueft).
          # 💣 NIE hierher: api/config.local.php (Zugangsdaten). api/wiki-sync.php stand bis zum 14.09.2026
          #    als geschuetzter „frontend fallback" in AGENTS.md §10 -- kein Frontend rief ihn mehr, Owner-GO.
          #    Und keine Datei, die im Repo liegt -- sie fehlte nach dem Deploy auf dem Server.
          #    Gewacht von tools/__tests__/retire-liste-geschuetzt.test.js.
          # 🪤 Hier stand bis zum 15.09.2026: „Dieser Schritt faellt mit SKIP_DEPLOY aus: ein Commit, der nur
          #    diese Liste aendert, raeumt nichts" (gemessen an api/wiki-sync.php, 14.09.2026). Seither haengt
          #    der Schritt an RETIRE_ORPHANS statt an SKIP_DEPLOY -- siehe den Kommentar ueber dem Schritt.
          retire_nur_server_php=(
            "api/_internal/app/__tests__/adventure-cover-autoget-test.php"
            "api/_internal/app/__tests__/adventure-links-test.php"
            "api/_internal/app/__tests__/adventure-resolve-candidates-test.php"
            "api/_internal/app/__tests__/adventure-resolve-test.php"
            "api/_internal/app/__tests__/adventure-search-test.php"
            "api/_internal/app/__tests__/adventure-source-place-test.php"
            "api/_internal/app/__tests__/curve-label-rollout-test.php"
            "api/_internal/app/__tests__/ecosystem-conditional-before-ddl-test.php"
            "api/_internal/app/__tests__/ecosystem-wiki-no-article-test.php"
            "api/_internal/app/__tests__/place-target-revive-test.php"
            "api/_internal/app/__tests__/suche-anzeigename-test.php"
            "api/_internal/app/adventure-resolve.php"
            "api/_internal/app/adventure-search.php"
            "api/_internal/app/adventures.php"
            "api/_internal/import/__tests__/garetien-quellen-abbau-test.php"
            "api/_internal/import/garetien-quellen-abbau.php"
            "api/_internal/map/__tests__/bach-domaene-test.php"
            "api/_internal/map/__tests__/kraftlinie-wiki-no-article-test.php"
            "api/_internal/map/__tests__/label-wiki-no-article-test.php"
            "api/_internal/map/__tests__/weg-wiki-no-article-test.php"
            "api/_internal/map/__tests__/wiki-merker-bereinigung-test.php"
            "api/_internal/map/wiki-claim.php"
            "api/_internal/political/__tests__/anzeigename-migration-test.php"
            "api/_internal/routing/__tests__/bach-furt-stroemung-test.php"
            "api/_internal/routing/__tests__/terrain-tobler-test.php"
            "api/_internal/wiki/__tests__/adventure-plan-test.php"
            "api/_internal/wiki/__tests__/adventure-sync-test.php"
            "api/_internal/wiki/__tests__/bilder-lokalisieren-test.php"
            "api/_internal/wiki/__tests__/listensymbol-orte-test.php"
            "api/_internal/wiki/__tests__/lore-source-migration-test.php"
            "api/_internal/wiki/__tests__/powerline-assign-test.php"
            "api/_internal/wiki/adventure-plan-apply.php"
            "api/_internal/wiki/adventure-sync.php"
            "api/_internal/wiki/bilder-lokalisieren.php"
            "api/_internal/wiki/lore-source-migration.php"
            "api/_internal/wiki/powerline-assign.php"
            "api/app/adventures.php"
            "api/app/geo-probe.php"
            "api/app/imap-probe.php"
            "api/config.example.php"
            "api/edit/map/adventure-cover-autoget.php"
            "api/edit/map/adventure-cover.php"
            "api/edit/map/adventures.php"
            "api/edit/wiki/bilder-lokalisieren.php"
            "api/wiki-sync.php"
            # Garetien-Importer, zurueckgebaut 26.09.2026
