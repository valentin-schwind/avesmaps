name: Deploy Avesmaps to STRATO

on:
  push:
    branches:
      - master
    paths-ignore:
      - "tiles/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show which files would be uploaded"
        required: true
        default: true
        type: boolean
      delete_remote_files:
        description: "Delete remote files that are no longer in the deploy package"
        required: true
        default: false
        type: boolean
      upload_tiles:
        description: "Upload the tile pyramid"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: avesmaps-strato-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SFTP
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AVESMAPS_HOST: ${{ secrets.AVESMAPS_HOST }}
      AVESMAPS_PASSWORD: ${{ secrets.AVESMAPS_PASSWORD }}
      AVESMAPS_PORT: ${{ secrets.AVESMAPS_PORT }}
      AVESMAPS_REMOTE_PATH: ${{ secrets.AVESMAPS_REMOTE_PATH }}
      AVESMAPS_USER: ${{ secrets.AVESMAPS_USER }}
      DEPLOY_DIR: /tmp/avesmaps-deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 💣 Until 2026-08-05 not one of these tests ran on a deploy, and one of them had been red
      # for weeks without anyone noticing. That is not a footnote: the red one is the guard against
      # a claim about the slope model that two players had already caught in public, and while
      # everyone was used to it being red, the same claim quietly survived in api/README.md for a
      # month. A gate nobody watches is not a gate. This step is the gate.
      #
      # ⚠️ WHAT IT DOES NOT COVER, so nobody reads "the gate" as "everything":
      #   * 21 *.mjs tests under tools/ -- SIX of them are red as of 2026-08-05 and would block
      #     every deploy. They need fixing before they can be added; see the system test report.
      #   * .github/scripts/__tests__/*.test.py -- the asset-stamping chain (AGENTS.md §7), which
      #     this very workflow depends on. Needs a python step.
      # Adding either is a separate change with its own verification.
      #
      # ⚠️ It runs BEFORE the secret check on purpose: a fork push or a workflow_dispatch should
      # fail on broken tests rather than on a missing secret. (There is no pull_request trigger,
      # so it does not fire on PRs at all -- an earlier version of this comment claimed it did.)
      - name: Run the unit tests
        shell: bash
        run: |
          set -uo pipefail

          # zend.assertions=1 is not optional: without it assert() is a no-op and every test
          # reports green while proving nothing. The tests carry their own guard against that and
          # abort loudly, which is why a missing extension shows up as FATAL rather than a pass.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            php-cli php-mbstring php-curl php-sqlite3 php-gd > /dev/null

          # 💣 Diese Zeile steht bewusst EINZELN und mit `|| true`. Am 25.08.2026 stand `php-sodium`
          # in der Pflichtliste darueber -- das Paket gibt es auf ubuntu-24.04 nicht ("E: Unable to
          # locate package"), apt endete mit 100, und weil GitHub diesen Schritt als `bash -e`
          # startet, war der Deploy tot, BEVOR ein einziger Test lief. Das `set -uo pipefail` im
          # Skript hebt das `-e` NICHT auf. Ein fehlendes Zusatzpaket darf den Deploy nicht stoppen:
          # ohne sodium ueberspringt sich der Discord-Signaturtest selbst (sauber, mit Exit 0).
          sudo apt-get install -y --no-install-recommends php-sodium > /dev/null 2>&1 || true
          php -r 'echo "sodium: ", extension_loaded("sodium") ? "da" : "fehlt", PHP_EOL;'

          php -v | head -1
          echo "node $(node -v)"

          failed=0
          php_ok=0
          js_ok=0

          # Two conventions, both real: __tests__/*.php under api/ and tools/, and test-*.php
          # directly under tools/{paths,routing,wikidump}. The second set was invisible to the
          # first version of this gate -- 30 files, among them the wiki_key folding guard that
          # AGENTS.md §5 names by hand.
          echo "--- PHP ---"
          # ⚠️ The parentheses are load-bearing: -o binds looser than the implicit -a, so without
          # them the second branch swallows the first one's -name and the whole thing silently
          # returns only the __tests__ set. Shipped wrong once (2026-08-05) -- 88 instead of 118,
          # and the gate looked like it had grown when it had not. If you touch this line, count.
          for test in $(find api tools \( -path '*__tests__*' -name '*.php' \) -o \( -name 'test-*.php' -not -path '*__tests__*' \) | sort); do
            if output="$(php -d zend.assertions=1 -d assert.exception=1 "$test" 2>&1)"; then
              php_ok=$((php_ok + 1))
            else
              failed=1
              echo "::error file=${test}::PHP test failed"
              echo "$output" | tail -20
            fi
          done

          echo "--- JS ---"
          for test in $(find js tools -path '*__tests__*' -name '*.test.js' | sort); do
            if output="$(node "$test" 2>&1)"; then
              js_ok=$((js_ok + 1))
            else
              failed=1
              echo "::error file=${test}::JS test failed"
              echo "$output" | tail -20
            fi
          done

          echo "PHP ${php_ok} green, JS ${js_ok} green."

          if [[ "$failed" -ne 0 ]]; then
            echo "::error title=Tests failed::Nothing was uploaded. Fix the tests, then push again."
            exit 1
          fi

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for secret_name in AVESMAPS_HOST AVESMAPS_PASSWORD AVESMAPS_PORT AVESMAPS_REMOTE_PATH AVESMAPS_USER; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Missing secret::${secret_name} is not configured."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Prepare deploy package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          deploy_items=(
            ".htaccess"
            "index.html"
            "favicon.ico"
            "og-image.jpg"
            "llms.txt"
            "site-summary.md"
            "robots.txt"
            "sitemap.xml"
            "admin"
            "api"
            "assets"
            "css"
            "edit"
            "fonts"
            "icons"
            "img"
            "html"
            "js"
            "map"
            "politics"
            "scripts"
            "tools/wikidump"
            # 🔴 NUR diese eine Datei, nie "uploads" als Ganzes. /uploads sind LAUFZEITDATEN --
            # hochgeladene Wappen, Bilder, DB-Backups -- und dort ist der SERVER die Quelle,
            # nicht das Repo. Ein Verzeichnis-Eintrag liesse den Deploy etwas anfassen, dessen
            # Inhalt er nicht kennt. Die .htaccess ist die Ausnahme: Konfiguration, kein Datum.
            # Sie setzt CSP + nosniff fuer SVG-Wappen -- ein SVG kann <script> tragen und liefe
            # direkt aufgerufen im Ursprung von avesmaps.de.
            "uploads/wappen/.htaccess"
            # Dieselbe Ausnahme fuer die beiden anderen Schutzdateien unter /uploads:
            # db-backups sperrt Dumps MIT PASSWORT-HASHES, dumps die Wiki-Rohdaten. Beide
            # wirken heute (403 gemessen), sind aber von Hand dorthin gekommen -- ohne
            # diese Zeilen bliebe ihr Schutz davon abhaengig, dass das jemand wiederholt.
            "uploads/db-backups/.htaccess"
            "uploads/dumps/.htaccess"
          )

          copy_item() {
            local item="$1"

            if [[ -e "$item" ]]; then
              mkdir -p "$DEPLOY_DIR/$(dirname "$item")"
              cp -a "$item" "$DEPLOY_DIR/$item"
            fi
          }

          copy_full_deploy_package() {
            local item

            for item in "${deploy_items[@]}"; do
              copy_item "$item"
            done
          }

          should_deploy_file() {
            local file="$1"
            local item

            for item in "${deploy_items[@]}"; do
              if [[ "$file" == "$item" || "$file" == "$item/"* ]]; then
                return 0
              fi
            done

            return 1
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Preparing full deploy package."

            copy_full_deploy_package

            if [[ "${{ inputs.upload_tiles }}" == "true" && -e "tiles" ]]; then
              copy_item "tiles"
            fi
          else
            echo "Preparing changed-files deploy package."

            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"

            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              echo "No usable base SHA found; preparing full deploy package instead."

              copy_full_deploy_package
            else
              if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
                echo "Base commit $base_sha is not available locally; preparing full deploy package instead."
                copy_full_deploy_package
              else
                changed_files=$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$head_sha")

                if [[ -z "$changed_files" ]]; then
                  echo "No changed deployable files found."
                  echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
                else
                  while IFS= read -r file; do
                    if should_deploy_file "$file"; then
                      copy_item "$file"
                    fi
                  done <<< "$changed_files"
                fi
              fi
            fi
          fi

          rm -f "$DEPLOY_DIR/.env"
          rm -f "$DEPLOY_DIR/api/.env"
          rm -f "$DEPLOY_DIR/api/config.local.php"
          rm -f "$DEPLOY_DIR/map/google-sheets-credentials.json"
          rm -f "$DEPLOY_DIR/map/google-sheets-token.json"
          rm -f "$DEPLOY_DIR/map/Aventurien_routes.svg"
          rm -f "$DEPLOY_DIR/map/"*.py
          rm -f "$DEPLOY_DIR/map/requirements-"*.txt

          find "$DEPLOY_DIR" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "$DEPLOY_DIR" -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "Aventurien_routes.backup-*.svg" \) -delete

          if ! find "$DEPLOY_DIR" -mindepth 1 -print -quit | grep -q .; then
            echo "Deploy package is empty."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # 🔴 DIE PUNKT-DATEIEN IMMER MITNEHMEN, auch wenn sie sich nicht geaendert haben.
          #
          # 🪤 Der Deploy ist INKREMENTELL: er kopiert nur, was der Push angefasst hat. Eine
          # .htaccess, die seit Monaten unveraendert im Repo liegt, kommt damit NIE auf den Server
          # -- uploads/wappen/.htaccess lag zwei Laeufe lang im Repo UND in der Allowlist und war
          # trotzdem wirkungslos. Erst eine Zeile Kommentar darin hat sie angestossen.
          #
          # 🔴 Warum das mehr als ein Schoenheitsfehler ist: wer eine SCHUTZ-.htaccess ins Repo
          # legt, sieht sie im Diff, sieht den Deploy gruen -- und haelt den Bereich fuer
          # geschuetzt. Betrifft api/_internal, api/_schema, api/diagnostics, scripts,
          # tools/wikidump und uploads/db-backups (dort liegen Dumps mit Passwort-Hashes).
          # ⚠️ Alle diese Pfade antworten heute mit 403/404 -- kein Loch, aber bisher kein
          # Verdienst des Deploys.
          #
          # ⭐ Bewusst HIER und nicht als eigener lftp-Schritt hinterher: ins Paket gelegt, nimmt
          # der mirror sie auf dem normalen Weg mit -- kein zweiter Verbindungsaufbau, keine
          # zweite Fehlerquelle. Ein solcher Extraschritt war der erste Entwurf; er arbeitete auf
          # dem PAKET statt auf dem Repo und reichte damit nur nach, was ohnehin schon drin war.
          # 🔴 HINTER dem "Paket leer?"-Check, und das ist tragend: davor waere das Paket NIE
          # leer, SKIP_DEPLOY nie gesetzt -- jeder Push, auch einer, der nur .github/ anfasst,
          # loeste dann einen vollen Deploy samt Asset-Stempelung aus. Die Punkt-Dateien
          # fahren mit, wenn ohnehin deployt wird; sie erzwingen keinen Deploy.
          # ⚠️ Gefiltert durch should_deploy_file: eine .htaccess ausserhalb der Allowlist (etwa
          # unter uploads/) geht weiterhin NICHT mit, ausser ihr Pfad steht ausdruecklich drin.
          while IFS= read -r htaccess_file; do
            if should_deploy_file "$htaccess_file"; then
              copy_item "$htaccess_file"
              echo "Punkt-Datei mitgenommen: $htaccess_file"
            fi
          done < <(git ls-files | grep -E '(^|/)\.htaccess$' || true)


          echo "Deploy package:"
          find "$DEPLOY_DIR" -maxdepth 2 -mindepth 1 | sort

      - name: Stamp asset versions
        if: env.SKIP_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Die Einstiegsseiten werden IMMER neu gestempelt und ins Paket gelegt -- auch wenn nur ein
          # referenziertes Asset (nicht die Seite selbst) geaendert wurde, denn sonst zeigten sie noch
          # auf den alten Hash. Sie sind winzig und werden ohnehin nie hart gecacht.
          entries=(index.html)
          for page in html/*.html; do
            [[ -f "$page" ]] && entries+=("$page")
          done

          # Das Skript folgt der ganzen Referenzkette (index.html -> css/styles.css -> base/tokens.css
          # -> ...) und legt jede Datei mit ins Paket, die es dabei umschreiben musste. Hashes werden
          # aus dem vollstaendigen Checkout ($PWD) berechnet -> unveraenderte Assets behalten ihren
          # Hash und bleiben clientseitig gecacht.
          python3 .github/scripts/stamp-asset-versions.py \
            --asset-root "$PWD" --deploy-dir "$DEPLOY_DIR" "${entries[@]}"

          # Beweis, dass die Kette stimmt, BEVOR hochgeladen wird: ein falscher Hash faellt sonst
          # nirgends auf (Deploy gruen, Datei auf dem Server korrekt) und wuerde die Nutzer bis zu
          # einem Jahr auf dem alten CSS festhalten. Siehe docs/asset-caching-and-versioning.md.
          python3 .github/scripts/verify-stamped-chain.py \
            --asset-root "$PWD" --deploy-dir "$DEPLOY_DIR" "${entries[@]}"

          echo "Stamped reference sample:"
          grep -oE '(src|href)="(js|css)/[^"]+"' "$DEPLOY_DIR/index.html" | head -n 5 || true
          grep -oE '@import url\("[^"]+"\)' "$DEPLOY_DIR/css/styles.css" | head -n 3 || true

      - name: Install SFTP client
        if: env.SKIP_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy package
        if: env.SKIP_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mirror_options=(
            "--reverse"
            "--verbose"
            "--parallel=4"
            "--exclude-glob=api/config.local.php"
            "--exclude-glob=api/.env"
            "--exclude-glob=.env"
          )

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            mirror_options+=("--dry-run")
          fi

          if [[ "${{ inputs.delete_remote_files }}" == "true" ]]; then
            mirror_options+=("--delete")
          fi

          lftp -u "$AVESMAPS_USER","$AVESMAPS_PASSWORD" -p "$AVESMAPS_PORT" "sftp://$AVESMAPS_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          cd "$AVESMAPS_REMOTE_PATH"
          mirror ${mirror_options[*]} "$DEPLOY_DIR" .
          bye
          EOF

      - name: Retire orphaned remote files
        if: env.SKIP_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry run: skipping deletion of retired files."
            exit 0
          fi

          # Allowliste verwaister Server-Dateien (alte Pfade aus der Zeit vor der css-Umstrukturierung
          # in Unterordner). Im Repo existieren sie nicht und keine Seite referenziert sie mehr.
          # Chirurgisches, idempotentes rm -f statt eines gefaehrlichen globalen --delete.
          echo "Retiring orphaned remote files:"
          printf '  %s\n' "css/leaflet.css" "css/political-territory-wiki-tree.css" "icons/small_webp/ (retired: flattened into icons/)" "js/map-features/map-features-questroute.js (retired: adventures questroute dropped)" "css/features/questroute.css (retired: adventures questroute dropped)" "api/discord/sapi-probe.php (retired: temporaere Messung zur aufgeschobenen Antwort, 24.08.2026)"

          lftp -u "$AVESMAPS_USER","$AVESMAPS_PASSWORD" -p "$AVESMAPS_PORT" "sftp://$AVESMAPS_HOST" <<EOF || echo "Retire: some files already gone (non-fatal)."
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          cd "$AVESMAPS_REMOTE_PATH"
          rm -f "css/leaflet.css"
          rm -f "css/political-territory-wiki-tree.css"
          rm -r -f "icons/small_webp"
          rm -f "js/map-features/map-features-questroute.js"
          rm -f "css/features/questroute.css"
          rm -f "api/discord/sapi-probe.php"
          bye
          EOF

      # 🔴 DER KANARIENVOGEL: laeuft die Karte nach dem Hochladen ueberhaupt noch?
      #
      # 💣 WARUM ES DAS GIBT. Am 23.08.2026 lag die Live-Karte 35 Minuten tot --
      # GET /api/app/map-features.php antwortete allen Besuchern mit HTTP 500 --, waehrend der
      # Deploy gruen war und das ganze Testfeld gruen war. Beides stimmte auch: hochgeladen
      # wurde alles, und die Tests pruefen Entscheidungen, nicht den Abruf. Aufgefallen ist es
      # erst, als der Owner es meldete.
      #
      # ⚠️ DAS IST KEIN TOR, SONDERN EIN ALARM. Der Upload ist an dieser Stelle schon passiert;
      # ein roter Lauf haelt nichts auf, er sagt nur laut Bescheid. Ein echtes Tor muesste vor
      # dem Upload stehen und koennte die Live-Seite gar nicht befragen.
      #
      # ⚠️ EINE Anfrage, kein Dauerlauf. map-features.php ist ein bekannter Perf-Brennpunkt
      # (CLAUDE.md: „never run heavy API endpoints in a loop"); drei Versuche mit Pause sind
      # die Obergrenze, und sie greifen nur, wenn die erste fehlschlaegt.
      # ⚠️ OHNE Cache-Brecher: so laeuft die Anfrage denselben Weg wie die eines Besuchers und
      # kostet den Server im Normalfall fast nichts.
      # 💣 KEIN `HEAD` -- map-features.php lehnt alles ausser GET mit 405 ab, bevor es
      # ueberhaupt Daten anfasst; eine HEAD-Probe waere immer gruen und wertlos.
      - name: Karte nach dem Deploy einmal abrufen
        if: env.SKIP_DEPLOY != 'true' && inputs.dry_run != true
        shell: bash
        run: |
          set -uo pipefail

          ziel="https://avesmaps.de/api/app/map-features.php"
          # Kurz warten: der Upload ist eben erst durch, und PHP mag einen Moment brauchen.
          sleep 20

          # Wie oft der Server ueberhaupt GEANTWORTET hat. Null heisst: wir haben ihn nie erreicht --
          # das sagt nichts ueber den Deploy und darf deshalb nicht wie ein toter Deploy klingen.
          antworten=0
          for versuch in 1 2 3; do
            # 💣 `|| rc=$?` ist TRAGEND, und zwar doppelt.
            # (a) Es haelt curls Grund fest: 7 heisst „kein Verbindungsaufbau", 28 „zu langsam", 6 „Name
            #     nicht aufgeloest". Ohne ihn steht im Protokoll nur eine leere HTTP-Zeile, und der
            #     naechste Leser haelt einen Netzausfall fuer eine kaputte Karte.
            # (b) Es haelt den Schritt am Leben. GitHub startet jeden `shell: bash`-Schritt mit
            #     `bash --noprofile --norc -e -o pipefail`; das `set -uo pipefail` oben kann dieses `-e`
            #     NICHT abschalten, denn `set` schaltet nur ein (dafuer gaebe es `set +e`). Ohne den
            #     `||`-Verbund toetet der erste curl-Fehlschlag den Schritt genau hier: die drei Versuche
            #     laufen nie, die Meldung unten erscheint nie, und der Schritt endet mit 7 statt mit 1.
            #     Genau so geschah es am 24.08.2026 ZWEIMAL bei kerngesunder Karte (HTTP 200, 19,9 MB) --
            #     beide Laeufe exakt 20,2 s lang, also das `sleep 20` und sonst nichts.
            # ⚠️ Wer hier eine weitere Zeile einfuegt, die fehlschlagen darf, braucht denselben Schutz:
            #    ein `|| …`, ein `if …; then`, oder ein `|| true`. Der Nachbarschritt „Run the unit tests"
            #    macht es mit `if output="$(…)"; then` -- das ist die Hausform.
            # Gewacht von tools/__tests__/deploy-kartenprobe.test.js.
            rc=0
            kopf="$(curl -s -o /tmp/karte.probe -D - -w '%{http_code}' --max-time 180 "$ziel" | tail -1)" || rc=$?
            anfang="$(head -c 200 /tmp/karte.probe 2>/dev/null || true)"

            if [[ "$kopf" == "200" && "$anfang" == *'"ok":true'* ]]; then
              groesse=$(stat -c%s /tmp/karte.probe 2>/dev/null || echo 0)
              fassung="$(sed -n 's/.*"revision":\([0-9]*\).*/\1/p' <<< "$anfang")"
              echo "Karte lebt: HTTP 200, Kartenfassung ${fassung:-?}, $(( groesse / 1048576 )) MB."
              # ⚠️ Fail-open ist nicht still: seit dem 23.08.2026 zaehlt map-features.php
              # gescheiterte Wappen-Aufloesungen mit. Ueber null heisst „Karte laeuft, aber
              # irgendwo fehlen Wappen" -- eine Warnung, kein Abbruch.
              if [[ "$anfang" == *'"coat_errors"'* ]]; then
                echo "::warning title=Wappen::map-features meldet coat_errors -- die Karte laeuft, aber Wappen-Aufloesungen sind gescheitert."
              fi
              exit 0
            fi

            if [[ "$rc" -eq 0 ]]; then
              antworten=$(( antworten + 1 ))
              echo "Versuch $versuch: HTTP $kopf -- $(head -c 160 /tmp/karte.probe 2>/dev/null)"
            else
              echo "Versuch $versuch: keine Antwort, curl-Exit $rc -- der Host war nicht zu erreichen."
            fi
            [[ "$versuch" -lt 3 ]] && sleep 25
          done

          # 🔴 ZWEI Diagnosen, und der Unterschied ist der ganze Sinn dieser Trennung: hat der Server
          # NIE geantwortet, ist ueber die Karte NICHTS gemessen -- der Upload ist trotzdem durch, und
          # ein Revert waere der falsche Reflex. Am 24.08.2026 lief genau dieser Fall zweimal, und die
          # alte, einzige Meldung empfahl beide Male einen Revert fuer eine kerngesunde Karte.
          if [[ "$antworten" -eq 0 ]]; then
            echo "::error title=Karte nicht erreichbar::$ziel war in drei Versuchen nicht zu erreichen (zuletzt curl-Exit $rc). Der Upload ist bereits durch; ob die Karte lebt, ist damit NICHT gemessen -- einmal von Hand abrufen. Ein Revert ist hier der falsche Reflex."
          else
            echo "::error title=Die Karte ist tot::$ziel antwortet nicht mit ok:true. Die Seite laedt, die Karte bleibt LEER. Der Upload ist bereits erfolgt -- pruefe den letzten Commit und erwaege einen Revert."
          fi
          exit 1
