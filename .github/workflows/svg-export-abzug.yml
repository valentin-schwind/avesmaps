name: SVG-Abzug bauen und hinterlegen

# Baut den semantischen SVG-Abzug der Karte und HINTERLEGT ihn ueber die API, wo
# GET /api/svg-export.php ihn gegen einen Bearer-Token ausliefert.
#
# 🔴 GEBAUT WIRD MIT DEM BAUER DER EXPORTSEITE, nicht mit einer zweiten Fassung.
# tools/svg-export/abzug-bauen.js laedt js/pages/svg-export-build.js -- dieselbe Datei, die
# /edit/svg-export.php im Browser laedt. Deshalb koennen Hand- und Routineabzug nicht
# auseinanderlaufen: es gibt nur einen Bauer.
#
# 🔴 UND HINTERLEGT WIRD UEBER DENSELBEN ENDPUNKT WIE VON HAND
# (POST /api/svg-export-deposit.php). Die erste Fassung schob die Datei per SFTP hoch und
# raeumte per lftp auf -- das war ein ZWEITER Schreibweg mit einer zweiten Fassung derselben
# Regeln (aufraeumen, Zeiger schreiben, Sperre setzen). „Zwei von drei Löschwegen gebunden
# ist keine Regel" (AGENTS.md). Jetzt kennt nur PHP die Ablage.
#
# ⚠️ EINMAL AM TAG, und der Lauf holt drei bekannte Perf-Brennpunkte an (map-features,
# political-territories?action=layer, ecosystem-areas je Art). Wer die Haeufigkeit erhoeht,
# erhoeht die Last auf dem Shared Hosting -- CLAUDE.md beschreibt, wie das einmal wie ein
# Datenbankausfall aussah.

on:
  schedule:
    # 03:17 UTC -- abseits des Deploys und der Handbuch-Routine (00:00 Ortszeit).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Woher die Kartendaten kommen und wohin hinterlegt wird"
        required: true
        default: "https://avesmaps.de"
        type: string
      dry_run:
        description: "Nur bauen und pruefen, nichts hinterlegen"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: avesmaps-svg-export
  cancel-in-progress: false

jobs:
  abzug:
    name: Abzug bauen und hinterlegen
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ABZUG_DIR: /tmp/avesmaps-svg-export
      BASIS: ${{ inputs.base_url || 'https://avesmaps.de' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abzug bauen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ABZUG_DIR"
          mkdir -p "$ABZUG_DIR"
          node tools/svg-export/abzug-bauen.js --out "$ABZUG_DIR" --base "$BASIS"
          ls -la "$ABZUG_DIR"

      # 🔴 VOR dem Hinterlegen, nicht danach. Ein Abzug, den der Bauer aus leeren
      # Endpunktantworten gebaut hat, ist ein gueltiges SVG -- nur eben leer. Er darf die
      # gute Datei auf dem Server nicht ersetzen.
      - name: Abzug pruefen
        shell: bash
        run: |
          set -euo pipefail
          node tools/svg-export/__tests__/abzug-pruefen.js "$ABZUG_DIR"

      - name: Ablage-Token pruefen
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          DEPOSIT_TOKEN: ${{ secrets.AVESMAPS_SVG_DEPOSIT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPOSIT_TOKEN:-}" ]]; then
            echo "::error title=Secret fehlt::AVESMAPS_SVG_DEPOSIT_TOKEN ist nicht gesetzt."
            exit 1
          fi

      # 💣 GESTUECKELT, weil ein Abzug ~8,6 MB hat und ein einzelner POST auf STRATO in
      # `post_max_size` laeuft -- deren Fehlerbild ein LEERER Rumpf ohne Ausnahme ist, also
      # nicht von „nichts geschickt" zu unterscheiden.
      # ⚠️ `--fail-with-body`, nicht `--fail`: der Endpunkt begruendet seine Absagen im Rumpf
      # („zu klein", „kein SVG"), und ohne den Rumpf stuende hier nur eine Zahl.
      - name: Hinterlegen
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          DEPOSIT_TOKEN: ${{ secrets.AVESMAPS_SVG_DEPOSIT_TOKEN }}
        run: |
          set -euo pipefail
          endpunkt="$BASIS/api/svg-export-deposit.php"

          ruf() { curl -sS --fail-with-body --max-time 180 -H "Authorization: Bearer $DEPOSIT_TOKEN" "$@"; }

          # 🔴 BEIDE FASSUNGEN, NACHEINANDER ueber denselben Endpunkt: die rohe
          # (Stuetzpunkt-Polygone) und die geglaettete (`?smooth=1`, Bezierkurven).
          # 💣 In WELCHE Schublade sie kommen, sagt der SERVER -- er liest `avm:geglaettet` aus
          # dem Wurzelelement der hochgeladenen Datei. Hier wird es NICHT mitgeschickt, aus
          # demselben Grund wie bei `quelle`: was der Aufrufer behauptet, entscheidet nicht.
          # ⚠️ Die rohe zuerst. Bricht der Lauf dazwischen ab, ist die Fassung erneuert, an der
          # die bestehenden Abrufer haengen -- und die glatte bleibt einen Tag alt, statt
          # umgekehrt.
          for variante in roh glatt; do
            case "$variante" in
              roh)   zeiger="$ABZUG_DIR/aktuell.json" ;;
              glatt) zeiger="$ABZUG_DIR/aktuell-glatt.json" ;;
            esac
            svg="$ABZUG_DIR/$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).datei)' "$zeiger")"
            echo "== $variante: $(basename "$svg") ($(stat -c%s "$svg") Bytes)"

            id="$(ruf -X POST "$endpunkt?action=start" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.upload_id)throw new Error("keine upload_id");process.stdout.write(j.upload_id)})')"
            echo "Upload-Kennung: ${id:0:8}…"

            teile="$ABZUG_DIR/teile-$variante"
            rm -rf "$teile"
            mkdir -p "$teile"
            split -b 2097152 "$svg" "$teile/stueck-"
            anzahl=$(ls "$teile" | wc -l)
            n=0
            for stueck in "$teile"/stueck-*; do
              n=$((n + 1))
              echo "  Stueck $n/$anzahl"
              ruf -X POST --data-binary "@$stueck" \
                -H "Content-Type: application/octet-stream" \
                "$endpunkt?action=chunk&upload_id=$id" > /dev/null
            done

            # 🔴 `quelle` wird NICHT mitgeschickt -- die bestimmt der Server aus dem Riegel
            # (Routine-Token => routine). Mitgeschickt koennte ein Handabzug sich als Routine
            # ausgeben, und genau diese Angabe soll die beiden auseinanderhalten.
            rumpf="$(node -e '
              const fs=require("fs");
              const z=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write(JSON.stringify({
                dateiname: z.dateiname, dialekt: z.dialekt,
                kartenfassung: z.kartenfassung, landschaftsfassung: z.landschaftsfassung,
                exportiert: z.exportiert,
              }));' "$zeiger")"

            ruf -X POST -H "Content-Type: application/json" --data "$rumpf" \
              "$endpunkt?action=finish&upload_id=$id" | tee "$ABZUG_DIR/antwort-$variante.json"
            echo
          done

      - name: Zusammenfassung
        if: always()
        shell: bash
        run: |
          {
            echo "### SVG-Abzug"
            for f in "$ABZUG_DIR/aktuell.json" "$ABZUG_DIR/aktuell-glatt.json" \
                     "$ABZUG_DIR/antwort-roh.json" "$ABZUG_DIR/antwort-glatt.json"; do
              if [[ -f "$f" ]]; then
                echo "**$(basename "$f")**"
                echo '```json'
                cat "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
