   and -- for the same reason as there -- its own hover rule AFTER the general one. */
.avm-tile--on {
	background: var(--color-button);
	border-color: var(--color-button-border);
	color: var(--color-button-text);
}

.avm-tile--on .t2 { color: var(--color-on-button-muted); }
.avm-tile--on:hover { background: var(--color-button-hover); }

/* ---- Status line (Spec §3.4) ----------------------------------------------------------------
 * Its own row UNDER the ribbon, full width. One line, ellipsised: a long message must never push
 * the columns down.
 */
.avm-status {
	display: flex;
	align-items: center;
	gap: var(--space-12);
	padding: var(--avm-status-pad);
	min-height: var(--avm-status-min-h);
	color: var(--mut);
	background: var(--soft);
	border-bottom: 1px solid var(--line);
	white-space: nowrap;
}

.avm-status__text {
	flex: 1 1 auto;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.avm-status__text.ok { color: var(--ok); }
.avm-status__text.bad { color: var(--bad); }

/* ---- Three equal columns (Spec §3.2) --------------------------------------------------------
 * 💣 grid, NOT flex. `flex: 1 1 0` with box-sizing: border-box was measured twice and was wrong
 *    twice -- Abenteuer 483/458/458, Karten 459/673/244 -- because a border box cannot shrink
 *    below its own padding, so the padded column keeps a bigger basis. Grid tracks do not know
 *    that. The children need min-width/min-height: 0 or a grid item's `auto` minimum pushes the
 *    track open again.
 */
.avm-cols {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	flex: 1 1 auto;
	min-height: 0;
}

.avm-col {
	display: flex;
	flex-direction: column;
	min-width: 0;
	min-height: 0;
	overflow: hidden;
	padding: var(--avm-col-pad);
}

.avm-col + .avm-col { border-left: 1px solid var(--line); }

/* Spec §3.1a rule 1: the column title stands OUTSIDE the scroll area, not `position: sticky`
   inside it. Sticky works too but needs an opaque ground, bleeding edges and knows the trap from
   §8.9 (a negative margin-top moves the sticking point). This construction knows none of them. */
.avm-col__title {
	margin: 0 0 var(--space-6);
	font-size: var(--font-size-subhead);
	line-height: var(--leading-snug);
	font-weight: var(--font-weight-bold);
	color: var(--color-accent-strong);
}

.avm-col__bar {
	display: flex;
	align-items: center;
	gap: var(--space-4);
	margin-bottom: var(--space-4);
}

/* The bright framed box the scrolling content sits in -- Spec §3.1d, word-for-word from the
   settlement editor's #seTree/#seList/#seDetailBody.
   💣 `border-radius: 6px` is the deliberate hard value, NOT --radius-sm (5) or --radius-md (8).
      Settlements has carried it forever, Territorien copied it to the pixel in 673413ce, and the
      owner names both as the model. Word-for-word means: on the same pixel. */
.avm-scroll {
	flex: 1 1 auto;
	min-height: 0;
	overflow: auto;
	padding: var(--space-2);
	background: var(--panel);
	border: 1px solid var(--line);
	border-radius: 6px;
}

.avm-scroll--pad { padding: var(--space-6) var(--space-10); }

/* Same `:where()` reasoning as the button block above: element selectors must stay at element
   specificity, or a page's own `.klasse input` rules stop winning. */
:where(.avm-editor-body) input[type=search],
:where(.avm-editor-body) input[type=text],
:where(.avm-editor-body) input[type=url],
:where(.avm-editor-body) input[type=number],
:where(.avm-editor-body) textarea,
:where(.avm-editor-body) select {
	font: inherit;
	color: var(--fg);
	background: var(--soft);
	border: 1px solid var(--line);
	border-radius: var(--radius-md);
}

:where(.avm-editor-body) input[type=search] {
	flex: 1 1 auto;
	min-width: 0;
	height: var(--avm-control-h);
	padding: 0 var(--space-6);
}

/* ---- Listenzeile ----------------------------------------------------------------------------
 * 💣 `.avm-row` steht seit 2026-08-15 in css/components/editor-row.css und wird im Kopf DIESER
 *    Datei importiert. Grund: der Vorkommeneditor ist kein iframe, laedt editor-page.css also
 *    nicht, braucht dieselbe Zeile aber. Nicht hierher zurueckkopieren -- dann gaebe es sie
 *    zweimal, und genau daraus ist die Divergenz vom 14.08.2026 gewachsen.
 */

.avm-empty { padding: var(--space-6); color: var(--mut); }
.avm-error { padding: var(--space-6); color: var(--bad); }

/* ---- Tab strip (Spec §3.1, „[Reiterzeile] optional") ----------------------------------------
 * Same underline language as every other editor sub-tab row (css/features/review-panel.css:1374
 * -- Meldungen, WikiSync, Konfliktlösung, Status). Copied onto the token ladder rather than
 * imported: that file reaches the app hull, not these iframes.
 */
.avm-tabs {
	display: flex;
	flex-wrap: wrap;
	gap: var(--space-12);
	margin-bottom: var(--space-4);
	border-bottom: 1px solid var(--line);
}

/* Plain class selectors, exactly as on the seventh editor's page: 0,1,0 beats the element-level
   button rule above (which `:where()` keeps at 0,0,1). */
.avm-tab {
	flex: 0 0 auto;
	min-height: 0;
	padding: var(--space-4) 1px;
	border: 0;
	border-bottom: 2px solid transparent;
	border-radius: 0;
	background: none;
	appearance: none;
	-webkit-appearance: none;
	color: var(--mut);
	font: inherit;
	font-size: var(--font-size-body);
	line-height: var(--leading-tight);
	white-space: nowrap;
}

.avm-tab:hover,
.avm-tab:focus-visible { background: none; color: var(--color-text-strong); }

.avm-tab.is-active {
	background: none;
	color: var(--color-text-strong);
	font-weight: var(--font-weight-bold);
	border-bottom-color: var(--color-text-strong);
}

/* ---- Row badges -----------------------------------------------------------------------------
 * Spec §3.1b: emphasise the EXCEPTION, not the classification. A classification stays quiet grey;
 * a real open point gets the warning tone (never --color-danger; red stays with actual errors).
 */
.avm-pill {
	flex: 0 0 auto;
	padding: 0 var(--space-4);
	border: 1px solid var(--line2);
	border-radius: var(--radius-md);
	font-size: var(--font-size-caption);
	font-weight: var(--font-weight-normal, 400);
	color: var(--mut);
	white-space: nowrap;
}

.avm-pill--unresolved {
	color: var(--warn);
	border-color: var(--color-warning-soft-border);
}

.avm-summary {
	padding: 0 var(--space-2) var(--space-2);
	font-size: var(--font-size-caption);
	color: var(--mut);
}

/* ---- Detail fields (Spec §3.1c) --------------------------------------------------------------
 * Label LEFT of the field in a fixed --avm-field-label-w column, so the field edges line up across
 * every group and every editor. The adventure editor was the one that stacked them and that is
 * exactly why its detail column looked like a different program.
 * Class names kept as .dt-* on purpose: the settlement editor's, so the two read the same.
 */
.dt-grp {
	display: flex;
	align-items: center;
	gap: var(--space-4);
	margin-top: var(--space-8);
	padding-top: var(--space-4);
	border-top: 1px solid var(--line);
	font-size: var(--font-size-caption);
	font-weight: var(--font-weight-bold);
	color: var(--mut);
}

.dt-grp:first-child { margin-top: 0; padding-top: 0; border-top: none; }

.dt-grid {
	display: grid;
	grid-template-columns: var(--avm-field-label-w) minmax(0, 1fr);
	margin-top: var(--space-2);
	font-size: var(--font-size-body);
}

.dt-grid .k {
	padding: var(--space-2) var(--space-4) var(--space-2) 0;
	white-space: nowrap;
	font-weight: var(--font-weight-bold);
	color: var(--mut);
}

.dt-grid > div:not(.k) {
	padding: var(--space-2) 0;
	min-width: 0;
	overflow-wrap: anywhere;
	color: var(--color-text);
}

/* External links always carry a trailing ↗ (AGENTS.md §12); the arrow is written in the markup. */
.dt-link { color: var(--accent); text-decoration: none; }
.dt-link:hover { text-decoration: underline; }

.dt-grid input[type=text],
.dt-grid input[type=url],
.dt-grid input[type=number],
.dt-grid select {
	width: 100%;
	height: var(--avm-control-h);
	padding: 0 var(--space-4);
	font-size: var(--font-size-body);
}

.dt-grid input[readonly] {
	color: var(--mut);
	background: var(--color-panel);
	cursor: default;
}

/* ---- Der Wiki-Override an der Feldzeile (Entwurf 2026-08-17-wiki-override-fuer-alle-design.md) --
 * Der Territoriumseditor (html/wiki-sync-monitor.html) zeigt seit jeher dauerhaft, wo unser Wert vom
 * Wiki abweicht: Wiki-Wert DURCHGESTRICHEN, unser Wert daneben, Beschriftung braun, dazu ein ↺ je
 * Feld. Hier bekommt dieselbe Form ihren Platz in einem Formular -- die uebrigen Editoren sind
 * immer im Bearbeiten-Modus, das Eingabefeld IST also der neue Wert.
 *
 * 🔴 EINE DRITTE RASTERSPALTE, damit ALLE Eingabefelder untereinander stehen (die Regel oben,
 * „so the field edges line up across every group and every editor"). Der Wiki-Stand in eine Zelle
 * VOR dem Feld zu setzen, ohne ihm eine eigene Spalte zu geben, verschiebt jedes Feld um die Laenge
 * seines eigenen Wiki-Werts -- genau das war die erste, verworfene Fassung.
 */
/* 🔴 HALBE / HALBE (Owner 17.08.2026, woertlich: „50% | 50% · Text --durchgestrichener text-- |
 * Eingabe"). Links Beschriftung SAMT durchgestrichenem Wiki-Stand, rechts das Bedienelement.
 * 🪤 Davor standen hier DREI Spalten mit einem clamp() fuer den Mindestplatz des Feldes. Das war
 * gerechnet, wo eine Aufteilung genuegt -- und es zwang die zweite Oberflaeche zu einer eigenen
 * Fassung. Zwei gleiche Haelften brauchen keinen Mindestwert: die Haelfte IST er. */
.dt-grid--wiki {
	grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
	column-gap: var(--space-4);
	align-items: center;
}

/* Die linke Haelfte traegt beides. "white-space: normal" hebt das "nowrap" der Grundregel auf --
   der Wiki-Stand daneben darf umbrechen statt die Zeile aufzuziehen. */
.dt-grid--wiki .k {
	display: flex;
	align-items: baseline;
	gap: var(--space-2);
	min-width: 0;
	white-space: normal;
}

/* Der durchgestrichene Wiki-Stand und das ↺ -- Klassennamen und Wirkung wortgleich zum
 * Territoriumseditor, damit die zwei Oberflaechen sich gleich lesen. */
.dt-old {
	color: var(--color-danger);
	text-decoration: line-through;
}

.dt-reset {
	cursor: pointer;
	color: var(--mut);
	font-size: var(--font-size-caption);
	margin-left: var(--space-4);
	text-decoration: underline;
	background: none;
	border: 0;
	padding: 0;
	line-height: 1;
}

.dt-reset:hover { color: var(--color-text-strong); }

/* 🔴 „Wir haben dieses Feld gesetzt" -- die einzige zusaetzliche Marke, und sie sitzt an der
 * BESCHRIFTUNG, nicht als Abzeichen daneben. Wortgleich zum Territoriumseditor (.dt-grid .k.ovr).
 * Ein erster Entwurf trug drei Abzeichen; zwei davon waren redundant zur Durchstreichung. */
.dt-grid .k.ovr { color: var(--color-accent-brown); }

/* ---- Der durchgestrichene Wiki-Stand als Teil der BESCHRIFTUNG -------------------------------
 * 🔴 EINE Regel fuer alle Oberflaechen (Owner 17.08.2026: „50% | 50% · Text
 * --durchgestrichener text-- ↺ | Eingabe"). Der Wiki-Stand gehoert zur Beschriftung, nicht in eine
 * eigene Spalte; ob die Beschriftung links steht (Ortseditor, Literatur) oder oben (Kartendialog),
 * aendert daran nichts.
 * 🪤 DAS WAR NICHT VON ANFANG AN SO, und der Umweg ist lehrreich: erst eine dritte Rasterspalte,
 * dann -- weil der Literatur-Editor im MARKUP aussieht wie der Kartendialog, im CSS aber ein
 * Flex-ROW mit fester 130px-Beschriftung ist -- eine zweite Fassung, die „ISBN (für DNB)" auf drei
 * Zeilen brach. Beides vom Owner gesehen, nicht vom Test; eine Umbruch-Kaskade misst keine
 * Zusicherung. **Das Markup sagt nicht, welche Form gilt -- das CSS sagt es.** Die Aufteilung in
 * zwei gleiche Haelften macht die Frage gegenstandslos.
 * ⚠️ Die Regeln stehen trotzdem zweimal, weil index.html editor-page.css nicht bindet und die
 * Editorseiten location-report-dialog.css nicht -- die KLASSENNAMEN sind dieselben, damit es beim
 * naechsten Leser eine Sache bleibt. */
.wiki-alt {
	display: inline-flex;
	align-items: baseline;
	gap: var(--space-2);
	margin-left: var(--space-4);
	max-width: 60%;
	vertical-align: baseline;
	font-weight: normal;
	font-size: var(--font-size-caption);
}

.wiki-alt .dt-old {
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.wiki-alt .dt-reset { flex: 0 0 auto; }

/* „Von uns gesetzt" -- an der Beschriftung, per Klasse statt per `:has()`. Die Elternauswahl faellt
   bei fehlender Browserfaehigkeit LAUTLOS aus, und die Zeile saehe dann aus wie eine mit
   unbekannter Herkunft, also genau wie der andere Zustand. */
.ae-field > label.has-wiki-ovr { color: var(--color-accent-brown); }

/* Der Literatur-Editor: dieselben zwei Haelften in Flex-Form. Die Beschriftung traegt den
 * Wiki-Stand, das Bedienelement bekommt die andere Haelfte.
 * ⚠️ Die Grundregel dieses Editors setzt `flex: 0 0 var(--avm-field-label-w)` auf die Beschriftung
 * -- 130px, in die ein Wiki-Stand nicht passt. Sie steht INLINE in html/game-literature-editor.html
 * und gewinnt gegen diese Datei; ueberschrieben wird sie deshalb dort, nicht hier. */
.ae-field > .wiki-alt {
	flex: 0 1 auto;
	min-width: 0;
	margin-left: 0;
}

.dt-check {
	display: flex;
	align-items: center;
	gap: var(--space-4);
	padding: var(--space-2) 0;
	font-size: var(--font-size-body);
	color: var(--mut);
}

.dt-check input { cursor: pointer; }
.dt-check input:disabled { cursor: default; }

.dt-actions {
	display: flex;
	align-items: center;
	gap: var(--space-4);
	flex-wrap: wrap;
	margin-top: var(--space-6);
}

.dt-msg { font-size: var(--font-size-caption); }
.dt-msg.ok { color: var(--ok); }
.dt-msg.bad { color: var(--bad); }

/* ---- Die Speicherleiste -- EINE Form fuer alle Editorfenster ---------------------------------
 * Links die Meldung („Keine ungespeicherten Aenderungen." / „Ungespeicherte Aenderungen."), rechts
 * die Knoepfe, der gefuellte zuletzt. Owner 16.08.2026: „mach das konsistent und tu den speichern
 * knopf nach rechts" -- Anlass war der Regionen-Editor, wo „Speichern" linksbuendig mitten im
 * Formular stand.
 *
 * 🔴 ABGESCHRIEBEN, NICHT ERFUNDEN: das ist Wort fuer Wort die Regel, die bis zum 16.08.2026 als
 * `.wp-savebar` in css/pages/wege-editor.css stand -- dem Vorbild, das der Owner benannt hat. Sie
 * ist hierher gewandert, weil jene Datei NUR html/wege-editor.html laedt; diese hier laden alle
 * sieben Editorseiten. Die alte Kennung gibt es nicht mehr (kein Alias, keine zweite Fassung) --
 * genau das war die Divergenz, die der Umbau abschafft.
 *
 * 💣 DER RANDUEBERHANG IST EINSTELLBAR, WEIL DIE WIRTE VERSCHIEDEN POLSTERN. Gemessen 16.08.2026:
 * `.avm-scroll--pad` (Wege, Landschaften) hat var(--space-6) var(--space-10) -- das sind die
 * Vorgaben unten; `#plDetail` (Kraftlinien) hat 10px 12px, `#seDetailBody` (Orte) hat 4px. Fest
 * verdrahtet wie im Original haette die Leiste dort entweder einen weissen Streifen daneben oder
 * ragte hinaus. Ein Wirt, der anders polstert, setzt die zwei Werte an seinem Behaelter -- er
 * SCHREIBT die Regel nicht ab.
 *
 * ⚠️ SPEZIFITAET, gegen jeden Fremderzeuger nachgerechnet (der Grund, warum diese Regeln hier und
 * nicht in einer dritten Datei stehen):
 *   `.avm-savebar button.is-primary`       (0,2,1) schlaegt `:where(.avm-editor-body) button` (0,1,0)
 *   `.avm-savebar button.is-primary:hover` (0,3,1) schlaegt `:where(.avm-editor-body) button:hover` (0,2,0)
 * Die Huelle der Wiki-Zuweisung ist unberuehrt: `.avm-wiki-assign button` (0,1,1) trifft nur
 * Knoepfe INNERHALB des Kastens, und die Speicherleiste steht ausserhalb. Die Fussleisten der
 * Literatur (.ae-savebar) und der Kartensammlung (.ce-savebar) bleiben ebenfalls unberuehrt: sie
 * sind Fussleisten der ganzen Spalte, keine Bloecke im Fluss, und tragen ihre eigenen Klassen.
 */
.avm-savebar {
	--avm-savebar-bleed-x: var(--space-10);
	--avm-savebar-bleed-y: var(--space-6);
	display: flex;
	align-items: center;
	gap: var(--space-6);
	padding: var(--space-6) var(--avm-savebar-bleed-x);
	margin: var(--space-6) calc(-1 * var(--avm-savebar-bleed-x)) var(--space-6);
	background: var(--color-panel-soft);
	border-top: 1px solid var(--color-border);
}

/* 💣 DER UEBERHANG NACH UNTEN IST OPT-IN, und das ist keine Feinheit: seit der Owner-Reihenfolge
   stehen „Lage & Zugehoerigkeit" und „Gemeinsame Regionen mit" UNTER der Leiste. Das Original
   (.wp-savebar) hing ihn bedingungslos an -- damals war die Leiste immer das letzte Element des
   gepolsterten Kastens. Bedingungslos uebernommen zoege er jetzt den Abschnitt darunter unter den
   eigenen Rahmen.
   🪤 `:last-child` waere die falsche Probe gewesen und haette genau EINEN Fall verfehlt: im
   Landschaften-Editor ist die Leiste das letzte Kind ihres `.eco-edit`-Blocks, aber NICHT das
   letzte des Scrollkastens -- der Ueberhang haette dort in den naechsten Regionsblock gezogen.
   Die Frage ist „schliesst diese Leiste den gepolsterten Kasten ab", und die beantwortet der Wirt,
   nicht die Baumstellung. */
.avm-savebar--flush { margin-bottom: calc(-1 * var(--avm-savebar-bleed-y)); }

/* Die Meldung schiebt die Knoepfe nach rechts -- kein Platzhalter, kein `margin-left:auto` am
   ersten Knopf: eine leere Meldung traegt den Schub genauso wie eine gefuellte. */
.avm-savebar__msg { flex: 1 1 auto; min-width: 0; font-size: var(--font-size-caption); color: var(--color-text-muted); }
.avm-savebar__msg.ok { color: var(--color-success); }
.avm-savebar__msg.bad { color: var(--color-danger); }
/* Der Verweis IN der Meldung (z. B. „Ort anzeigen" an einer Dublettenablehnung): ein Link, kein
   Knopf -- eine Zeilenhandlung ist nie die Haupthandlung (§12), und die steht rechts daneben und
   heisst „Speichern". Er traegt --color-link statt des Fehlerrots der Zeile, weil er nicht Teil der
   Aussage ist, sondern der Ausweg aus ihr.
   💣 ER MUSS SICH GEGEN `:where(.avm-editor-body) button` (Zeile 256) BEHAUPTEN -- aber NICHT ueber
   die Spezifitaet, die gewinnt er ohnehin: `:where()` zaehlt null, jene Regel steht also bei
   (0,0,1) (blosser Typselektor), diese hier bei (0,1,0). Eine Klasse schlaegt einen Typ, und die
   Reihenfolge in der Datei spielt dabei keine Rolle.
   🪤 Hier stand bis 17.08.2026 „(0,1,0) -- GENAU SO HOCH ... gewinnt nur, weil sie SPAETER steht".
   Das war falsch gerechnet, und die falsche Regel daraus ist gefaehrlich: wer sie auf einen ECHTEN
   Gleichstand uebertraegt, verlaesst sich auf die Dateireihenfolge. Gefunden vom
   usability-konsistenz-Agenten, nachdem der CSS-Zustand schon live war.
   💣 Der wahre Grund fuer die zwei Ruecksetzer unten ist ein anderer, und er ist der lehrreichere:
   DIE KASKADE ENTSCHEIDET JE EIGENSCHAFT, nicht je Regel. Was diese Regel gar nicht DEKLARIERT,
   faellt auf die naechste Regel durch, die es deklariert -- egal wie viel niedriger deren
   Spezifitaet ist. Kein Patt, sondern eine Luecke. Zwei Folgen, beide gemessen und beide nicht
   offensichtlich:
     · `min-height: var(--avm-control-h)` (32px) wird NICHT von selbst ueberschrieben -- ohne das
       ausdrueckliche `min-height: 0` zoege ein 32px hoher „Link" die Speicherleiste auseinander.
     · Der Hover-Zwilling dort ist `:where(.avm-editor-body) button:hover` = (0,1,1) und SCHLAEGT
       diese Regel. Ohne `background: none` im Hover unten bekaeme der Link beim Ueberfahren die
       Flaeche eines weichen Knopfes -- also genau das Aussehen, das er nicht haben soll.
   Wer die Regel verschiebt oder den Hover „aufraeumt", holt sich beides zurueck. */
.avm-savebar__msg-link {
	margin-left: var(--space-4);
	padding: 0;
	min-height: 0;
	border: 0;
	background: none;
	font: inherit;
	color: var(--color-link);
	text-decoration: underline;
	cursor: pointer;
}
.avm-savebar__msg-link:hover { background: none; text-decoration: none; }
.avm-savebar button.is-primary { background: var(--color-button); border-color: var(--color-button-border); color: var(--color-button-text); }
.avm-savebar button.is-primary:hover { background: var(--color-button-hover); }

/* ---- Wiki-Zuweisung (js/ui/wiki-assign.js, Huelle "dt") -------------------------------------
 * Ein Bauteil, ZWEI Huellen (Entwurf §4a, docs/superpowers/specs/2026-08-15-wiki-zuweisung-
 * vereinheitlichung-design.md): .dt-* hier fuer die Editor-iframes, .label-wiki-* in
 * css/components/region-sync.css fuer die Kartendialoge.
 *
 * 💣 Die Trefferlisten-Regeln standen bis 16.08.2026 NUR in region-sync.css, und die laedt nur
 *    index.html (gemessen: 7 Treffer .label-wiki-picker-list dort, 0 hier; index.html bindet
 *    region-sync.css, html/wiki-sync-powerline-editor.html bindet diese Datei). Eine Trefferliste
 *    im Editorfenster waere damit voellig ungestylt gewesen. Eine DRITTE Datei loest das nicht --
 *    sie waere die dritte Huelle, und zwei sind die Obergrenze.
 *
 * ⚠️ Neue Regeln greifen zum echten Token (var(--color-panel)), nicht zu den Kurznamen oben.
 */

/* Das Suchfeld des Bauteils fuellt seine Rasterzelle -- sonst stuende es inhaltsbreit in einer
   430 px breiten Spalte.
   💣 DIESE REGEL IST AUF .avm-wiki-assign EINGEENGT, und das ist der ganze Punkt. Bis zum
      16.08.2026 stand `input[type=search]` in der GETEILTEN Selektorliste unten -- und die trifft
      jedes Suchfeld in jedem `.dt-grid` aller Editorseiten. Gemessen schlug sie in zwei fremden
      Fenstern an, die diese Aufgabe nie angefasst hat: html/wiki-sync-monitor.html (Stadtwahl
      „Siedlung suchen…", lokale Regel .dt-cap-pick input ist nur (0,1,1) und verlor gegen (0,2,1)
      -- Hoehe auto→32px, Polster 2px 5px→0 6px, Schrift 12→13px) und
      html/wiki-sync-settlement-editor.html (#seTerritoryPickerSearch -- die lokale Regel
      deklariert kein `height`, die geteilte setzte es von ~22px auf 32px).
      Das ist die Fehlerklasse aus AGENTS.md §9: eine erweiterte Selektorliste in legal-dialog.css
      hat am 12.08.2026 fuenf Deploys hintereinander ausfallen lassen. Wer hier etwas ergaenzt,
      fragt zuerst, WELCHE fremden Elemente der Selektor sonst noch trifft.
   ⭐ (0,3,1) schlaegt jedes lokale `input[type=search]` (0,1,1) der Editorseiten -- absichtlich. */
.avm-wiki-assign .dt-grid input[type=search] {
	width: 100%;
	height: var(--avm-control-h);
	padding: 0 var(--space-4);
	font-size: var(--font-size-body);
}
/* Der Zuweisungsblock ist nie der Anfang eines Panels -- er folgt immer einem anderen Abschnitt
   (Identitaet, Beschreibung, Quellen). Sein Gruppenkopf traegt die Trennlinie deshalb auch dann,
   wenn er erstes Kind SEINES Behaelters ist; ohne diese Zeile verschluckt .dt-grp:first-child sie
   genau dort, wo sie hingehoert. */
.avm-wiki-assign > .dt-grp:first-child {
	margin-top: var(--space-8);
	padding-top: var(--space-4);
	border-top: 1px solid var(--color-border);
}
/* 🔴 UND HIER STEHT AUSDRUECKLICH KEIN `margin-bottom` FUER DIE HUELLE. Die untere Kante ist eine
   Frage des WIRTS: nach dem Kasten folgt bei vier Wirten ein .dt-grp (bringt margin-top: var(
   --space-8) selbst mit) und beim Kraftlinien-Editor unmittelbar `.pl-hint`. Ein Aussenrand hier
   verschoebe genau die neun Oberflaechen, die der Owner am 16.08.2026 als in Ordnung abgenommen
   hat. Die zwei Wirte, deren eigene Gruppenmarke (.ae-grp/.ce-grp) nur einen UNTEREN Rand fuehrt,
   geben ihn deshalb an IHREM Behaelter (#aeWikiAssign / #ceWikiAssign) selbst. */

/* Die Knoepfe rechts im Gruppenkopf. 🔴 Weich/outline, nie gefuellt: eine Handlung in einem
   Abschnitt ist nie die Haupthandlung der Seite (AGENTS.md §12). Sie tragen deshalb gar keine
   Klasse -- die Editorseiten stylen den blanken <button> bereits weich. */
.dt-grp__sp {
	margin-left: auto;
	display: flex;
	gap: var(--space-2);
	flex-wrap: wrap;
}

/* 💣 DER BLANKE <button> DES BAUTEILS BRAUCHT SEINE EIGENE REGEL -- die Annahme „die Editorseiten
   stylen ihn schon" gilt nur fuer VIER der sechs dt-Wirte, und die zwei uebrigen sind genau die
   zwei, die der Owner am 16.08.2026 als kaputt gemeldet hat. Nachgezaehlt, nicht geraten:
     weich vom Wirt: html/wege-editor.html:44 + html/landschaften-editor.html:43 tragen
       <body class="avm-editor-body"> und damit `:where(.avm-editor-body) button` (Zeile 256);
       html/wiki-sync-powerline-editor.html:43 und html/wiki-sync-settlement-editor.html:55
       fuehren dieselbe Regel als eigenen blanken `button { … }`.
     OHNE Regel: html/game-literature-editor.html und html/citymap-editor.html -- KEIN
       `avm-editor-body` am <body> und KEIN blanker `button`-Block; sie stylen nur .btn und
       .ae-btn2/.ce-btn2, und die Knoepfe des Bauteils tragen keine Klasse (skin.knopf === "").
   Gemessen fiel der Knopf dort auf die Browservorgabe zurueck: 21px hoch statt
   var(--avm-control-h) (32px), Arial 13,3px statt `font: inherit`, 2px-Kantenrelief statt
   1px var(--color-button-soft-border). Er sitzt damit nicht mehr im Hoehenraster der Kopfzeile,
   loest sich von seiner eigenen Beschriftung und liest sich als Teil der Zeile darueber.
   ⭐ Die Regel steht HIER und nicht in den zwei Seiten: dieselbe Begruendung wie eine Handbreit
   weiter unten bei `.avm-wiki-assign .dt-actions button.primary` -- ein Wirt ohne eigenen
   Stilblock soll das Bauteil nicht nackt zeichnen. Eine siebte Abschrift des Knopfes waere die
   Divergenz, die dieses Bauteil abschaffen sollte.
   ⚠️ SPEZIFITAET (0,1,1), gegen jeden Fremderzeuger nachgerechnet: sie schlaegt die vier weichen
   Regeln der Wirte (0,0,1) -- mit IDENTISCHEN Werten, dort aendert sich also nichts -- und
   verliert gegen `.avm-wiki-assign .dt-actions button.primary` (0,3,1), der gefuellte Knopf der
   Sync-Vorschau bleibt gefuellt. Sie trifft AUSSCHLIESSLICH Knoepfe innerhalb dieser Huelle:
   .avm-tile, .eco-*, .pl-reorder-bar, #seListTabs und .wp-fn__head liegen alle ausserhalb. Die
   zweite Huelle (.label-wiki-*) ist unberuehrt -- ihre Knoepfe tragen ohnehin eigene Klassen. */
.avm-wiki-assign button {
	font: inherit;
	min-height: var(--avm-control-h);
	padding: 0 var(--space-8);
	cursor: pointer;
	color: var(--color-button-soft-text);
	background: var(--color-button-soft);
	border: 1px solid var(--color-button-soft-border);
	border-radius: var(--radius-md);
}

.avm-wiki-assign button:hover { background: var(--color-button-soft-hover); }
.avm-wiki-assign button:disabled { opacity: .5; cursor: default; }

.dt-hint {
	padding-top: var(--space-2);
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

/* Die SCHREIBZEILE des Zuweisungskastens (js/ui/wiki-assign.js, Rolle `schreibZeile`): sie steht
   DAUERHAFT unten im Kasten und sagt, wann eine Zuweisung wirkt -- sofort oder erst mit
   „Speichern". Gegenstueck: .label-wiki-reference__schreibzeile (css/components/region-sync.css).
   ⚠️ Sie sieht dem .dt-hint darueber absichtlich gleich: sie IST ein Hinweis, nur einer, der nie
      verschwindet. Eine eigene Rolle hat sie trotzdem, weil .dt-hint abwechselnd den Zaehlsatz der
      Suche, den Rat des Leerzustands und die Erklaerung des dritten Zustands traegt.
   💣 KEINE eigene Schriftgroesse unter --font-size-caption (11px ist die Untergrenze, AGENTS.md
      §12) -- genau daran sind die abgeschriebenen Listenzeilen gescheitert. */
.dt-schreibzeile {
	padding-top: var(--space-2);
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

/* „Noch nicht gespeichert" -- der Zustand, der bis zum 17.08.2026 UNSICHTBAR war und den
   Owner-Befund ausgeloest hat. Warnton aus den Token, kein eigener Farbwert.
   ⚠️ Der Rahmen sitzt LINKS, nicht rundum: ein Kasten im Kasten waere die Gruppierung durch Rahmen,
      die AGENTS.md §12 ausschliesst -- gruppiert wird durch Trenner. */
.dt-schreibzeile.is-ungespeichert {
	margin-top: var(--space-2);
	padding: var(--space-2) var(--space-4);
	border-left: 3px solid var(--color-warning-soft-border);
	border-radius: var(--radius-sm);
	background: var(--color-warning-soft);
	color: var(--color-warning-soft-text);
}

/* Der GEFUELLTE Knopf der Sync-Vorschau. 🔴 Die Fuellung folgt der Haupthandlung (AGENTS.md §12),
   und in diesem Kasten WANDERT sie: solange nichts angehakt ist, ist „Alle anhaken" die Handlung,
   die der Editor als naechstes ausfuehren will -- „Uebernehmen" ist dann abgeschaltet. Ab dem ersten
   Haken dreht es sich um. Genau EIN gefuellter Knopf zu jeder Zeit; entschieden wird das im Bauteil
   (avesmapsWikiAssignKnopfMarkup, js/ui/wiki-assign.js), nicht hier.
   💣 ANLASS ist der Owner-Entscheid zur Vorhaekelung (16.08.2026): seit eine Zeile auf einem
      GEFUELLTEN Kartenwert ungehakt startet, oeffnet ein gepflegter Ort die Vorschau mit NULL Haken
      -- die Fuellung laege sonst dauerhaft auf einem toten Knopf.
   ⚠️ WIDERSPRUCH ZUM ABSATZ WEITER OBEN? Nein: dort geht es um die Knoepfe im GRUPPENKOPF
      (.dt-grp__sp), die nie gefuellt sind. Hier steht die Handlung eines geoeffneten Vorgangs, und
      der hat genau eine Hauptsache.
   ⚠️ `primary` ist das Wort, das die Editorfenster selbst benutzen (ihre lokalen Stilbloecke tragen
      `button.primary` mit denselben Token). Die Regel steht trotzdem HIER, weil ein Wirt ohne
      eigenen Stilblock -- der Wege-Editor -- sonst einen ungefuellten „gefuellten" Knopf haette.
   ⭐ Eingeengt auf .avm-wiki-assign: `primary` ist ein sehr allgemeines Wort, und eine ungebundene
      Regel traefe jeden Knopf jeder Editorseite (die Fehlerklasse aus AGENTS.md §9). */
.avm-wiki-assign .dt-actions button.primary {
	background: var(--color-button);
	border-color: var(--color-button-border);
	color: var(--color-button-text);
}
/* 💣 Eigene Hover-Regel, und sie MUSS nach `:where(.avm-editor-body) button:hover` stehen -- sonst
   faerbt das weiche Hover den gefuellten Knopf um. Dieselbe Falle wie bei .avm-tile--primary. */
.avm-wiki-assign .dt-actions button.primary:hover {
	background: var(--color-button-hover);
}

/* Das Kaestchen des dritten Zustands („Kein Wiki-Artikel vorhanden").
   ⚠️ Ohne `accent-color` faerbt der Browser es in seiner Standardfarbe -- unter Windows BLAU, und
      Blau ist in der Bedienoberflaeche verboten (AGENTS.md §12). Gegenstueck:
      `.label-wiki-reference__check input` (css/components/region-sync.css), die es seit Aufgabe 4
      richtig macht -- die zwei Huellen desselben Bauteils sahen sonst verschieden aus.
   🔴 SIE TRIFFT DREI OBERFLAECHEN, nicht eine -- jede, die das Bauteil in dieser Huelle traegt und
      dieses Stylesheet laedt: den Kraftlinien-Editor (html/wiki-sync-powerline-editor.html), den
      ORTE-Editor (html/wiki-sync-settlement-editor.html, dritter Zustand seit Aufgabe 5b) und den
      Wege-Editor (Aufgabe 5c). In den ersten beiden war das Kaestchen browserblau und ist es seit
      dem 16.08.2026 nicht mehr. 🪤 Hier stand zuerst nur der Kraftlinien-Editor -- eine Aufzaehlung
      liest sich als vollstaendig, auch wenn sie es nicht ist (AGENTS.md §11). Nachgemessen:
      `skin: "dt"` plus `editor-page.css` plus keine eigene `.dt-check`-Regel.
   💣 Es ist DIESELBE Luecke, die `.dt-check input` weiter oben hat, und sie wird hier NICHT
      allgemein geschlossen: `.dt-check` traegt auch „Auto-Name" und „Name auf der Karte anzeigen"
      im Wege-Editor und den Auto-Namen des Landschaften-Editors. Die einzeln umzufaerben ist eine
      sichtbare Aenderung an fremden Bedienelementen und gehoert in einen eigenen Gang (AGENTS.md
      §9). Eingeengt auf .avm-wiki-assign trifft die Regel nur das Bauteil selbst -- dieselbe
      Einengung und derselbe Grund wie bei `button.primary` darueber.
   ⭐ Derselbe Token wie die Haken der Sync-Vorschau nebenan (`.dt-sync-row input`); innerhalb EINES
      Kastens zwei verschiedene Haken-Farben waere genau die Divergenz, gegen die das Bauteil
      gebaut wurde. */
.avm-wiki-assign .dt-check input {
	accent-color: var(--color-accent);
}

/* ---- Trefferliste ---------------------------------------------------------------------------
   Massgabe ist .label-wiki-picker-list in region-sync.css: dieselbe Rolle, dieselbe Hoehe,
   dieselben Toene -- nur die Namen folgen der Huelle, in der sie stehen. */
.dt-picker-list {
	margin-top: var(--space-4);
	max-height: var(--avm-picker-list-max-h);
	overflow-y: auto;
	overflow-x: hidden;
	border: 1px solid var(--color-border);
	border-radius: var(--radius-md);
	background: var(--color-panel);
}

.dt-picker-list__item {
	padding: var(--space-4) var(--space-8);
	border-bottom: 1px solid var(--color-border);
	cursor: pointer;
}

.dt-picker-list__item:last-child { border-bottom: 0; }

/* Die Tastatur waehlt (↑ ↓), die Maus faehrt darueber -- beides sagt dasselbe. */
.dt-picker-list__item:hover,
.dt-picker-list__item.is-active { background: var(--color-hover-wash); }

.dt-picker-list__name { color: var(--color-text-strong); }

.dt-picker-list__meta {
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

/* 🔴 Ein Treffer sagt IM Treffer, wenn er schon woanders haengt -- vor dem Klick, nicht danach
   (Entwurf §5). Warnton, weil die Zuweisung dann eine zweite auf denselben Artikel waere. */
.dt-picker-list__warn {
	font-size: var(--font-size-caption);
	color: var(--color-warning);
}

.dt-picker-list__empty {
	padding: var(--space-6);
	font-size: var(--font-size-small);
	color: var(--color-placeholder);
}

/* ---- Sync-Vorschau --------------------------------------------------------------------------
   Dieselbe Formensprache wie die Uebernahme-Vorschau der Massenlaeufe (Entwurf §6): eine Zeile je
   UNTERSCHIED, Haken links, alter Wert durchgestrichen, neuer daneben. Was ohnehin uebereinstimmt,
   steht gar nicht erst da.
   💣 Die Haekchenspalte ist max-content, keine abgeschriebene Pixelzahl -- ein Kontrollkaestchen
   ist so breit, wie es die Schriftgroesse des Themas macht. */
.dt-sync-rows {
	margin-top: var(--space-4);
	border: 1px solid var(--color-border);
	border-radius: var(--radius-md);
	overflow: hidden;
}

.dt-sync-row {
	display: grid;
	grid-template-columns: max-content var(--avm-field-label-w) minmax(0, 1fr);
	gap: var(--space-4);
	align-items: start;
	padding: var(--space-4) var(--space-8);
	font-size: var(--font-size-body);
	cursor: pointer;
}

.dt-sync-row + .dt-sync-row { border-top: 1px solid var(--color-border); }
.dt-sync-row:hover { background: var(--color-hover-wash); }
.dt-sync-row input { margin-top: var(--space-2); accent-color: var(--color-accent); }

.dt-sync-row__k {
	font-weight: var(--font-weight-bold);
	color: var(--color-text-muted);
}

.dt-sync-row__alt {
	color: var(--color-text-muted);
	text-decoration: line-through;
}

.dt-sync-row__pfeil { color: var(--color-text-muted); }
.dt-sync-row__neu { color: var(--color-text-strong); }

/* 🔴 Der Grund steht IN der Zeile, nicht in einer Fussnote: eine ungehakte Zeile ohne Begruendung
   liest sich wie ein Fehler ("das Wiki sagt nichts -- wuerde die Angabe leeren" bzw. "von Hand
   gesetzt -- wuerde zurueckgedreht", Aufgabe 2). */
.dt-sync-row__grund {
	display: block;
	font-size: var(--font-size-caption);
	color: var(--color-warning);
}

.pl-hint {
	margin-top: 2px;
	font-size: var(--font-size-caption);
	color: var(--mut);
}

.pl-hint b { color: var(--color-accent-strong); font-weight: var(--font-weight-bold); }

/* Wer darf hier reisen -- und WANN. Eine Zeile je Fahrtyp: links der Haken (OB), rechts die vier
   Zeitfelder (WANN). Sie stehen in EINER Zeile, weil sie EINE Frage sind -- bis 2026-08-03 stand die
   Zeit in einem eigenen Block darunter und galt dadurch pauschal fuer alle angehakten Mittel.
   Die dritte Editorspalte ist schmal, deshalb umbricht der Zeitteil unter den Namen (`flex-wrap`),
   statt sich zu quetschen.
   💣 Ein Feld ist grau und TOT, wenn es nichts bedeuten kann: ohne Haken alle vier, bei „ganzjährig"
   die hinteren drei. `disabled` allein reicht im dunklen Thema nicht -- der Browser graut ein helles
   Feld sichtbar aus, ein dunkles kaum (derselbe Grund wie beim Reisebeginn im Routenplaner). */
.dt-grp__when {
	margin-left: auto;
	font-weight: var(--font-weight-regular);
	color: var(--mut);
}

.dt-tt {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--space-4);
	flex-wrap: wrap;
	padding: var(--space-2) 0;
	font-size: var(--font-size-body);
	color: var(--mut);
}

/* 💣 FESTER Startwert, nicht `auto`. Mit inhaltsbreiten Namen umbrachen nur die zwei langen Zeilen
   („Reisegruppe zu Fuss/beritten") und die Liste stand krumm -- 32 px neben 57 px. Mit gleicher
   Basis entscheidet die Spaltenbreite fuer ALLE Zeilen gleich, und weil alle gleich wachsen, stehen
   die Zeitfelder sauber untereinander. Umbruchschwelle gemessen: 418 px Zeilenbreite. */
.dt-tt__name {
	display: flex;
	align-items: center;
	gap: var(--space-4);
	flex: 1 1 150px;
	min-width: 0;
	cursor: pointer;
}

.dt-tt__name input { cursor: pointer; }
.dt-tt__name input:disabled { cursor: default; }

.dt-tt__when {
	display: flex;
	align-items: center;
	gap: 4px;
	flex: 0 0 auto;
}

/* 💣 FESTE Breiten, keine Mindestbreiten. Die dritte Spalte ist ~430–630 px breit, und ein
   inhaltsbreiter Waehler („ganzjährig" ist der laengste Eintrag) machte den Zeitteil 322 px breit --
   damit umbrachen genau die zwei Zeilen mit langem Namen („Reisegruppe zu Fuss/beritten") und die
   Liste stand krumm, 32 px neben 57 px. Gemessen bei 430 px Spaltenbreite. */
.dt-tt__when select,
.dt-tt__when input[type="number"] {
	padding: 3px 5px;
	font-size: var(--font-size-caption);
	/* 💣 Ohne das gilt `min-width: auto` und ein Flex-Kind wird so breit wie sein Inhalt -- die
	   festen Breiten darunter waeren wirkungslos (gemessen: 49 statt 38 px je Tagesfeld). */
	min-width: 0;
}

/* Gleiche Falle wie im Karten-Dialog: der Zaehl-Pfeil belegt dauerhaft ~13 px und schnitt die
   zweite Ziffer von „30" ab. Pfeil weg, Feld breiter -- `min`/`max` pruefen weiter. */
.dt-tt__when input[type="number"] {
	flex: 0 0 44px;
	appearance: textfield;
	-webkit-appearance: textfield;
	text-align: center;
}

.dt-tt__when input[type="number"]::-webkit-inner-spin-button,
.dt-tt__when input[type="number"]::-webkit-outer-spin-button {
	-webkit-appearance: none;
	margin: 0;
}
.dt-tt__when .wp-season-from-month { flex: 0 0 82px; }
.dt-tt__when .wp-season-to-month { flex: 0 0 74px; }

.dt-tt__when select:disabled,
.dt-tt__when input:disabled {
	background: var(--color-panel-muted);
	border-color: var(--color-divider);
	color: var(--color-text-muted);
	cursor: not-allowed;
}

/* „bis" ist kein Formularfeld und graut deshalb nicht von selbst mit. */
.dt-tt__bis {
	color: var(--mut);
	font-size: var(--font-size-caption);
}

.dt-tt__when:not(.dt-tt__when--open) .dt-tt__bis { opacity: 0.45; }

/* ---- Lizenz · Urheber · Kommentar (js/ui/media-license-fields.js) ----------------------------
 * Eine Reihe je Angabe, Label links in fester Breite, Feld rechts -- Vorbild ist .ce-row
 * (html/citymap-editor.html), das strukturell am naechsten an "ein Feld je Zeile" liegt.
 * 💣 EIGENER Klassenname (.mlf-*), keine Abschrift von .ce-row: dessen Regeln stehen lokal NUR im
 * <style>-Block von citymap-editor.html. Eine gleichnamige zweite Fassung hier waere genau die
 * Divergenz, die politische-territory-editor-inline.css dreimal zerschossen hat (AGENTS §10) --
 * gleicher Selektor, zwei Herkuenfte, irgendwann zwei Werte. Hier zentral, weil alle Editorseiten,
 * die die Reihe brauchen, editor-page.css ohnehin schon binden.
 * ⚠️ Das enge Bild-Raster in html/wiki-sync-settlement-editor.html (.dt-img-cell, 160px breit) stapelt
 * Label ueber Feld statt nebeneinander (.dt-img-meta .mlf-row, lokal in dieser Datei ueberschrieben,
 * Phase 4 Aufgabe 3) -- dieselben .mlf-*-Klassen, nur ihr Layout angepasst; keine zweite Fassung der
 * Regeln selbst, vormals .dt-img-license/.dt-img-note (eigene, jetzt entfernte Mini-Box-Klassen).
 * ⚠️ Kein Test bewacht die Parität zwischen dieser Zeile und .ce-row (html/citymap-editor.html,
 * Zeile ~283): ändert sich eine der beiden Formen, gegenprüfen, ob die andere mitziehen sollte.
 */
.mlf-row {
	display: flex;
	align-items: center;
	gap: var(--space-8);
	margin-bottom: var(--space-6);
}

.mlf-row__label {
	flex: 0 0 var(--avm-field-label-w);
	color: var(--color-text-muted);
}

.mlf-select,
.mlf-input,
.mlf-textarea {
	flex: 1 1 auto;
	min-width: 0;
	padding: var(--space-4) var(--space-6);
	border: 1px solid var(--color-border);
	border-radius: var(--radius-md);
	background: var(--color-panel);
	color: var(--color-text);
	font: inherit;
}

.mlf-select,
.mlf-input {
	min-height: var(--avm-control-h);
}

.mlf-textarea {
	resize: vertical;
	min-height: 44px;
}

.mlf-select:focus-visible,
.mlf-input:focus-visible,
.mlf-textarea:focus-visible {
	border-color: var(--color-border-strong);
	box-shadow: var(--focus-ring);
	outline: none;
}

/* Stille Werte (public:false im Katalog) bleiben waehlbar -- nur die Schrift ist gedaempft, kein
   disabled (Owner-Entscheid 16.08.2026, siehe js/app/media-licenses.js). */
.mlf-option--muted {
	color: var(--color-text-muted);
	font-style: italic;
}

/* 🔴 Das AUSWAHLFELD selbst traegt die Kennzeichnung, wenn sein GEWAEHLTER Wert nicht oeffentlich
   ist (avesmapsMediaLicenseSelectHiddenClass in js/ui/media-license-fields.js) -- sichtbar auch im
   GESCHLOSSENEN Zustand, anders als .mlf-option--muted, das nur beim Aufklappen wirkt. Bei bis zu
   zehn Bildern je Ort sah ein stummer Wert ohne dies aus wie ein sichtbarer (Fund aus Phase-4-
   Aufgabe 3, 16.08.2026). Vorbild fuer Ton und Form: .dt-img-license--hidden, das dieselbe Aussage
   vorher lokal in html/wiki-sync-settlement-editor.html traf. */
.mlf-select--hidden {
	border-color: var(--color-warning);
	color: var(--color-warning);
}

/* Die graue Protokollzeile unter den drei Feldern ("hochgeladen von X am TT.MM.JJJJ"). */
.mlf-protocol {
	margin-top: var(--space-2);
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

/* ===== css/pages/wege-editor.css ===== */
/* Wege-Editor (html/wege-editor.html) -- the EIGHTH list editor.
 * Auftrag: docs/wege-editor-instruction.md, Mockup: docs/wege-editor-mockup.html.
 *
 * Only what the shared files do NOT already cover. The page links, in this order:
 *   css/base/fonts.css, css/base/tokens.css  -> fonts + every colour/size/spacing token
 *   css/components/editor-page.css           -> the whole editor body: ribbon, status line, three
 *                                               columns, list rows, tabs, pills, detail fields
 *   THIS file                                -> only the `.wp-*` pieces, i.e. what is about WAYS
 *
 * ⚠️ The page's <body> carries `class="avm-editor-body"` -- the shared body/button/input rules are
 *    scoped to it (editor-page.css is loaded by seven pages now; a bare `body {}` would reach all).
 *
 * 🔴 No hardcoded colour, radius or spacing -- always a token (AGENTS.md §12). The chart series
 *    colours are `--color-chart-1..4`, added to tokens.css for this editor; read the note there
 *    before using them, it explains why there are exactly four and why stroke pattern is not
 *    optional decoration.
 */

/* ---- Column 1: way groups and their segments -------------------------------------------------
 * 💣 A way NAME stands for many segments -- „Reichsstraße 1" has 26 (docs/konfliktmanagement-
 *    design.md §6a: 215 groups, 1547 objects). Ungrouped they were 26 identical-looking rows.
 *    The group row carries the name and the count; the segment rows are indented under it.
 */
/* Die Art rechts in der Zeile trägt die Farbe, in der die KARTE diesen Wegtyp zeichnet — damit ist
   die Liste zugleich ihre eigene Legende (Owner 14.08.2026: „die tags hier könnten farbe gebrauchen").
   🔴 Die Farbe ersetzt NIE eine Angabe: das Wort („Flussweg") bleibt stehen. Wer Farben nicht
   unterscheidet, verliert nichts — genau deshalb ist Farbe hier überhaupt vertretbar.
   ⚠️ Reichsstraße, Straße und Weg bekommen keine: ihre Kartenfarben sind Weiß, Grau und Hellwarm,
   als Text wäre das Rauschen statt Bedeutung. Sie bleiben auf der Schriftfarbe von .avm-row__kind. */
.avm-row__kind--pfad        { color: var(--color-path-pfad); }
.avm-row__kind--gebirgspass { color: var(--color-path-gebirgspass); }
.avm-row__kind--wuestenpfad { color: var(--color-path-wuestenpfad); }
.avm-row__kind--flussweg    { color: var(--color-path-flussweg); }
.avm-row__kind--seeweg      { color: var(--color-path-seeweg); }
.avm-row__kind--reichsstrasse { color: var(--color-text-strong); }

/* Die Aufklapp-Spalte. 🔴 Sie ist für JEDE Zeile der obersten Ebene reserviert, auch für die
   ohne Aufklapp-Geste — ein Weg mit einem Abschnitt bekommt einen leeren Platzhalter derselben
   Klasse (js/pages/wege-editor.js, segmentRow). Ohne ihn begänne sein Name 20px weiter links als
   der eines mehrteiligen Weges direkt darüber, und die Liste sähe ausgefranst aus.
   ⚠️ Nicht zu verwechseln mit .wp-segment weiter unten: dessen Einrückung ist Verschachtelung
   (ein Abschnitt IN einer offenen Gruppe) und gehört genau dorthin. */
.wp-group__twist {
	flex: 0 0 auto;
	width: 12px;
	text-align: center;
	color: var(--color-text-muted);
	font-size: var(--font-size-caption);
}

/* The indent is what says „belongs to the row above". A left rule rather than pure padding: with
   several groups open, padding alone stops telling you where one group ends. */
.wp-segment {
	margin-left: var(--space-10);
	padding-left: var(--space-6);
	border-left: 2px solid var(--color-border);
}

.wp-segment.is-selected { border-left-color: var(--color-accent); }

/* ---- Column 2: Zugehörigkeit (read-only) -----------------------------------------------------
 * 🔴 DISPLAY ONLY (owner 2026-08-02). The assignment is computed by „Zugehörigkeit rechnen" in the
 *    LANDSCAPE editor and stays there; this column shows the result and links across. No input, no
 *    save -- a field that looks editable but is overwritten by the next run is a lie.
 */
.wp-share {
	display: flex;
	align-items: baseline;
	gap: var(--space-4);
	padding: var(--avm-row-pad);
	border: 1px solid var(--color-border);
	border-radius: var(--radius-md);
	background: var(--color-panel-soft);
}

.wp-share + .wp-share { margin-top: var(--space-2); }

.wp-share__name {
	flex: 1 1 auto;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.wp-share__kind {
	flex: 0 0 auto;
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

.wp-share__value {
	flex: 0 0 auto;
	font-variant-numeric: tabular-nums;
	color: var(--color-accent-strong);
	font-weight: var(--font-weight-bold);
}

/* ---- Column 3: height profile ---------------------------------------------------------------- */
.wp-scale { display: flex; gap: var(--space-4); margin-bottom: var(--space-6); }
.wp-scale button { flex: 1 1 0; min-height: var(--avm-control-h); font-size: var(--font-size-caption); }

.wp-scale button.is-active {
	background: var(--color-button);
	border-color: var(--color-button-border);
	color: var(--color-button-text);
}

.wp-scale button.is-active:hover { background: var(--color-button-hover); }

/* 🔴 DIE DIAGRAMM-REGELN STEHEN IN css/features/travel-model-curves.css. Sie zogen am 2026-08-03
   dorthin, als das Kurvenbild einen zweiten Leser bekam (der oeffentliche ⓘ-Dialog
   „Transportmittel"); diese Seite laedt beide Dateien. Betroffen: .wp-chart, .wp-grid, .wp-axis,
   .wp-tick, .wp-axis-label, .wp-note, .wp-cap, .wp-edge, .wp-line*, .wp-legend, .wp-controls*,
   .wp-small, .wp-chart--factor. Hier bleibt nur, was ALLEIN dieser Seite gehoert. */

/* Nur die Verteilungs- und Profilbilder dieser Seite, nicht die Modellkurven. */
.wp-fill { fill: var(--color-active-wash); stroke: none; }
.wp-dot { fill: var(--color-accent-strong); }

.wp-facts { display: grid; grid-template-columns: 1fr auto; gap: 1px var(--space-8); font-size: var(--font-size-body); }
.wp-facts dt { color: var(--color-text-muted); }
.wp-facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.wp-facts dd b { color: var(--color-accent-strong); font-weight: var(--font-weight-bold); }

/* ---- Save bar (Spec §3.1a) -------------------------------------------------------------------
 * 🔴 DIE REGELN STEHEN NICHT MEHR HIER. Sie heissen seit dem 16.08.2026 `.avm-savebar` und liegen
 * in css/components/editor-page.css -- unveraendert, nur umbenannt und umgezogen. Grund: der Owner
 * hat DIESE Leiste zum Vorbild fuer alle Editorfenster erklaert, und diese Datei laedt nur
 * html/wege-editor.html. Sie hier stehen zu lassen und anderswo abzuschreiben waere genau die
 * Divergenz, gegen die der Umbau lief. Wer sie sucht: `git log -S wp-savebar`.
 * ⚠️ Die Polsterung dieses Wirts (`.avm-scroll--pad`, var(--space-6) var(--space-10)) IST die
 * Vorgabe der geteilten Regel -- hier ist also nichts zu setzen.
 */

/* ---- „Funktionen anzeigen": its own overlay, two column widths ------------------------------- */
.wp-fn { flex: 1 1 auto; min-height: 0; overflow: auto; padding: var(--avm-col-pad); }

.wp-fn h3 {
	margin: 0 0 var(--space-4);
	font-size: var(--font-size-subhead);
	font-weight: var(--font-weight-bold);
	color: var(--color-accent-strong);
}

/* Überschrift links, ihr Auslöser rechts -- die Aktion steht bei dem, worauf sie wirkt, statt im
   Menüband eine Fensterlänge entfernt. */
.wp-fn__head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--space-8);
	margin-bottom: var(--space-4);
}

.wp-fn__head h3 { margin: 0; }

/* Der Knopf trägt seinen eigenen Zustand (Hausregel: „der Status steht IM Knopf"), also darf er
   nicht springen, wenn aus „Jetzt kalibrieren" ein „Kalibriert … 400/2.493" wird. */
.wp-fn__head button {
	flex: 0 0 auto;
	min-width: 190px;
	min-height: var(--avm-control-h);
	background: var(--color-button);
	border-color: var(--color-button-border);
	color: var(--color-button-text);
}

.wp-fn__head button:hover { background: var(--color-button-hover); }
.wp-fn__head button:disabled { opacity: .6; }

.wp-fn > section + section {
	margin-top: var(--space-12);
	padding-top: var(--space-12);
	border-top: 1px solid var(--color-border);
}

.wp-fn p { margin: var(--space-6) 0 0; font-size: var(--font-size-caption); color: var(--color-text-muted); line-height: var(--leading-normal); }

/* .wp-controls*, .wp-small und .wp-chart--factor stehen jetzt in
   css/features/travel-model-curves.css -- siehe den Hinweis weiter oben. */

/* Distribution: one 100 % row per way type. A SEQUENTIAL ramp (one hue, light to dark) because the
   classes are ordered -- never the categorical palette, never a rainbow. */
.wp-dist { display: grid; grid-template-columns: var(--avm-field-label-w) minmax(0, 1fr); gap: var(--space-2) var(--space-6); align-items: center; }
.wp-dist__label { font-size: var(--font-size-caption); color: var(--color-text-muted); white-space: nowrap; }
.wp-dist__bar { display: flex; gap: 2px; height: 16px; }
.wp-dist__seg { min-width: 0; border-radius: 2px; }
.wp-dist__seg--0 { background: var(--color-panel-muted); }
.wp-dist__seg--1 { background: var(--color-hover-wash); }
.wp-dist__seg--2 { background: var(--color-active-wash); }
.wp-dist__seg--3 { background: var(--color-accent); }
.wp-dist__seg--4 { background: var(--color-accent-strong); }
.wp-dist__seg--5 { background: var(--color-accent-brown); }

.wp-dist-key { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-8); margin-top: var(--space-6); font-size: var(--font-size-caption); color: var(--color-text-muted); }
.wp-dist-key span { display: inline-flex; align-items: center; gap: var(--space-2); }
.wp-dist-key i { width: 12px; height: 12px; border: 1px solid var(--color-border); border-radius: 2px; }

.wp-tab-num { width: 100%; border-collapse: collapse; font-size: var(--font-size-body); }
.wp-tab-num th, .wp-tab-num td { padding: var(--space-2) var(--space-4); text-align: right; border-bottom: 1px solid var(--color-border); }
.wp-tab-num th:first-child, .wp-tab-num td:first-child { text-align: left; }
.wp-tab-num th { color: var(--color-text-muted); font-size: var(--font-size-caption); font-weight: var(--font-weight-bold); white-space: nowrap; }
.wp-tab-num td { font-variant-numeric: tabular-nums; }
.wp-tab-num tr.is-reference td { color: var(--color-accent-strong); font-weight: var(--font-weight-bold); }
.wp-delta--up { color: var(--color-success); }
.wp-delta--down { color: var(--color-danger); }

/* c, large, with its predecessor beside it. Trap 5 of the Auftrag („c is a silent system constant")
   is a DISPLAY obligation, not a footnote: old and new value always stand together. */
.wp-c {
	display: flex;
	align-items: baseline;
	gap: var(--space-8);
	margin-bottom: var(--space-8);
	padding: var(--space-8) var(--space-10);
	background: var(--color-panel-soft);
	border: 1px solid var(--color-border);
	border-radius: 6px;
}

.wp-c__value { font-size: 30px; line-height: 1; color: var(--color-accent-strong); font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums; }
.wp-c__meta { flex: 1 1 auto; min-width: 0; font-size: var(--font-size-caption); color: var(--color-text-muted); line-height: var(--leading-normal); }

/* Die Erklärung zum Kalibrieren-Knopf. Sie steht auf der Fläche, auf der der Knopf sitzt, nicht im
   Handbuch: er startet einen minutenlangen Lauf und ändert trotzdem keine Reisezeit -- beides muss
   man wissen, BEVOR man drückt. */
.wp-explain {
	margin-bottom: var(--space-8);
	padding: var(--space-6) var(--space-10);
	background: var(--color-panel-soft);
	border: 1px solid var(--color-border);
	border-left: 3px solid var(--color-accent);
	border-radius: var(--radius-md);
}

.wp-explain p { margin: 0; font-size: var(--font-size-caption); color: var(--color-text-muted); line-height: var(--leading-normal); }
.wp-explain p + p { margin-top: var(--space-4); }
.wp-explain b { color: var(--color-text-strong); font-weight: var(--font-weight-bold); }

.wp-inert {
	margin-top: var(--space-8);
	padding: var(--space-6) var(--space-8);
	background: var(--color-warning-soft);
	border: 1px solid var(--color-warning-soft-border);
	border-radius: var(--radius-md);
	color: var(--color-warning-soft-text);
	font-size: var(--font-size-caption);
	line-height: var(--leading-normal);
}

.wp-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-12); }
.wp-two > div { min-width: 0; }

/* ---- The „Funktionen" window ------------------------------------------------------------------
 * It lives INSIDE the editor iframe, so it needs no entry in the host's dialog lists -- and it
 * cannot use .avm-editor-* either, which is the HOST's overlay shell (css/components/editor-shell.css
 * reaches index.html, not this document). Hence its own small shell here.
 * `role="dialog"` + a `__head` child on purpose: that is the shape js/ui/dialog-drag.js looks for,
 * so the window is draggable the moment this page ever loads that script.
 */
.wp-modal {
	position: fixed;
	inset: 0;
	z-index: 40;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: var(--space-12);
	background: var(--color-scrim-dialog);
}

.wp-modal[hidden] { display: none; }

.wp-modal__box {
	display: grid;
	grid-template-rows: auto minmax(0, 1fr);
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: var(--color-page-bg);
	border: 1px solid var(--color-border-strong);
	border-radius: var(--radius-sm);
	box-shadow: var(--shadow-dialog);
}

.wp-modal__head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--space-10);
	padding: var(--space-8) var(--space-12);
	background: var(--color-panel);
	border-bottom: 1px solid var(--color-border);
}

.wp-modal__head h2 {
	margin: 0;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	font-size: var(--font-size-subhead);
	font-weight: var(--font-weight-bold);
	color: var(--color-text-strong);
}

.wp-modal__close {
	flex: 0 0 auto;
	min-height: var(--avm-control-h);
	padding: 0 var(--space-8);
}

/* ---- „Tempowerte": die GA-Zahlen, aus denen jede Reisezeit entsteht -------------------------
   Entwurf: docs/superpowers/specs/2026-08-07-tempowerte-design.md §8.
   Gruppiert wird durch TRENNLINIE UND ÜBERSCHRIFT, nicht durch gerahmte Kästen (AGENTS.md §12).
   Kein hartkodierter Farbwert, kein hartkodierter Radius -- jeder Wert kommt aus einem Token. */
.wp-tempo { flex: 1 1 auto; min-height: 0; overflow: auto; padding: var(--avm-col-pad); }

.wp-tempo__sec { padding-top: var(--space-8); }
.wp-tempo__sec + .wp-tempo__sec { margin-top: var(--space-8); border-top: 1px solid var(--color-divider); }
.wp-tempo__sec h3 { margin: 0 0 var(--space-4); font-size: var(--font-size-subhead); color: var(--color-text-strong); }
/* 💣 Der Gruppenkopf stand auf --font-size-caption (11px) -- dem KLEINSTEN Token im Haus, dem Boden
   fuer Etiketten und Meta. Damit war der Name des Reisemittels so gross wie die Zahlen darunter, und
   die Gruppe hatte keinen Kopf, sondern eine weitere Zeile (Owner 14.08.2026).
   ⚠️ --font-size-reading (14px) und nicht --font-size-subhead (16px): die Abschnittsueberschrift h3
   steht auf 16, und h4 daneben zu setzen haette die Leiter eingeebnet. Drei Stufen: 16 / 14 / 11. */
.wp-tempo__sec h4 {
	margin: var(--space-10) 0 var(--space-3);
	font-size: var(--font-size-reading);
	font-weight: var(--font-weight-bold);
	color: var(--color-text-strong);
}
/* Die GA-Angabe bleibt Beiwerk und faellt auf den Meta-Ton zurueck -- sonst waechst sie mit und der
   Name gewinnt nichts. Eigene Zeile, damit lange Zusaetze den Kopf nicht auseinanderziehen. */
.wp-tempo__sec h4 .wp-tempo__day {
	display: block;
	margin-top: var(--space-1);
	font-size: var(--font-size-caption);
	font-weight: normal;
	color: var(--color-text-muted);
}

.wp-tempo__note { margin: 0 0 var(--space-6); font-size: var(--font-size-caption); color: var(--color-text-muted); }
.wp-tempo__note code { font-size: inherit; color: var(--color-text); }
.wp-tempo__day { font-weight: normal; color: var(--color-text-muted); }

/* Eine Gruppe (ein Reisemittel, eine Landschaftsebene) — und zugleich ein Kind des zweispaltigen
   Rasters. 💣 `min-width: 0` ist dort PFLICHT, nicht Feinschliff: ein Rasterkind steht auf
   `min-width: auto`, und eine breite Tabelle darin sprengt ihre Spalte, statt umzubrechen. Dann
   waeren die beiden Spalten ungleich breit — dieselbe Falle wie `flex: 1 1 0` ohne `min-width`. */
.wp-tempo__grp { min-width: 0; }

.wp-tempo__tbl { width: 100%; border-collapse: collapse; }
.wp-tempo__tbl th,
.wp-tempo__tbl td { padding: var(--space-2) var(--space-4); text-align: left; font-size: var(--font-size-caption); }
.wp-tempo__tbl th { font-weight: normal; color: var(--color-text); }
.wp-tempo__tbl tr + tr th,
.wp-tempo__tbl tr + tr td { border-top: 1px solid var(--color-divider); }
/* Eine Zelle, die von der Quelle abweicht -- der Ton kommt aus dem Status-Token, nicht aus einem
   eigenen Rot: er sitzt hier auf der weichen Panel-Fläche und muss dort lesbar bleiben. */
.wp-tempo__tbl tr.is-off .wp-tempo__ga { color: var(--color-warning); }

/* EINE Spalte -- seit dem 14.08.2026 wieder.
   💣 Die Geschichte dieser drei Zeilen ist eine Warnung wert. Erst `repeat(auto-fit, minmax(24rem,
   1fr))`: sah richtig aus, haette aber auf einem 1600er Monitor VIER Spalten ergeben, weil dieses
   Fenster den Bildschirm fuellt. Dann eine feste Zwei -- richtig, solange die Tabellen fuenf Spalten
   hatten. Mit der Eichungsspalte und den Kopfzeilen sind es sechs plus Kopf, und zwei davon
   nebeneinander sind wieder zu eng (Owner 14.08.: „du kannst jetzt von 2 spalten wieder auf eine").
   ⚠️ Die Huelle BLEIBT: sie traegt die Gruppierung der Landschaften (Topographie / Vegetation), die
   jetzt eben untereinander stehen statt nebeneinander. Ohne sie muesste die Aufteilung im JS zurueck. */
.wp-tempo__cols {
	display: grid;
	grid-template-columns: minmax(0, 1fr);
	gap: 0;
	align-items: start;
}

/* Alle VIER Eingabesorten gleich breit. 💣 Bis zum 14.08.2026 stand hier nur `.wp-tempo__in`, also
   bekamen die Landschaften, der Boden und die beiden Einzelwerte die Vorgabebreite des Browsers --
   in derselben Tabellenspalte, direkt untereinander. Aufgefallen ist es nicht am Hinsehen, sondern
   an der Zusicherung „jede Klasse im Fenster hat eine Regel". */

/* ---- Spaltenbeschriftungen -------------------------------------------------------------------
   ⭐ Jede Gruppe ist eine EIGENE Tabelle, also traegt jede ihren eigenen Kopf. Genau deshalb zaehlt
   `scope="col"` hier und ist kein Zierat: ohne ihn liest ein Screenreader elf kopflose Zahlenbloecke.
   Der Kopf bleibt leise -- er benennt die Spalte und streitet nicht mit dem Gruppennamen darueber. */
.wp-tempo__tbl thead th {
	padding-top: 0;
	padding-bottom: var(--space-2);
	font-weight: normal;
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
	border-bottom: 1px solid var(--color-divider);
	text-align: left;
	white-space: nowrap;
}
/* Die erste Datenzeile bringt ihre eigene Linie mit -- zwei uebereinander waeren ein Kasten, und
   gruppiert wird hier durch EINE Linie (AGENTS.md §12). */
.wp-tempo__tbl thead + tbody tr:first-child th,
.wp-tempo__tbl thead + tbody tr:first-child td { border-top: none; }

/* 💣 Die Hausregel fuer visuell versteckten Text steht in css/base/utilities.css -- die Datei wird
   aber von KEINER Seite geladen (geprueft 14.08.2026). Deshalb steht sie hier, statt ein `<link>`
   auf eine tote Datei zu setzen. In 1,75 rem passt kein Spaltenname, aber eine namenlose Spalte
   zwischen zwei benannten ist fuer einen Screenreader eine Luecke. */
.wp-tempo__sronly {
	position: absolute;
	width: 1px; height: 1px;
	overflow: hidden;
	clip: rect(0 0 0 0);
	white-space: nowrap;
}

/* ---- „auf unseren Wegen": die gemessene Seite neben der gerechneten -------------------------- */
.wp-tempo__real { white-space: nowrap; color: var(--color-text); }
.wp-tempo__real b { color: var(--color-accent-strong); font-weight: var(--font-weight-bold); }
.wp-tempo__proof { display: block; font-size: var(--font-size-caption);
	color: var(--color-text-muted); white-space: normal; }
/* 🔴 „nicht vermessen" ist KEINE 1,0 -- 44 % der Passstrecke hat kein Hoehenprofil. */
.wp-tempo__real.is-unknown { color: var(--color-text-muted); font-style: italic; }
.wp-tempo__tbl tr.is-anchor th { color: var(--color-accent-strong); }
/* 💣 MIT dem Element davor: `.wp-tempo__real b` (0,1,1) schlaegt `.wp-tempo__check` (0,1,0), und der
   Erfolgston kaeme sonst nie durch -- beim Mockup war genau das der Fall. */
.wp-tempo__real b.wp-tempo__check { color: var(--color-success); }
.wp-tempo__real b.wp-tempo__check.is-off { color: var(--color-danger); }

/* ---- Die Legende -----------------------------------------------------------------------------
   ⭐ Sie nennt ALLE Zustaende, auch die, die gerade nicht vorkommen. Eine Legende, die nur zeigt, was
   zufaellig auf dem Schirm ist, fehlt genau dann, wenn sie gebraucht wird. */
.wp-tempo__legend {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
	gap: var(--space-4) var(--space-8);
	margin: 0 0 var(--space-10);
	padding: var(--space-6) var(--space-8);
	border: 1px solid var(--color-divider);
	border-radius: var(--radius-md);
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
	line-height: var(--leading-normal);
}
.wp-tempo__legend > div { min-width: 0; }
/* Die Probe zeigt die ECHTE typografische Behandlung, keinen Farbpunkt daneben: so, wie es in der
   Zeile aussieht, erkennt man es in der Zeile wieder. */
.wp-tempo__legend samp {
	font-family: inherit;
	font-weight: var(--font-weight-bold);
	font-size: var(--font-size-body);
}
.wp-tempo__legend samp.is-value { color: var(--color-accent-strong); }
.wp-tempo__legend samp.is-ok { color: var(--color-success); }
.wp-tempo__legend samp.is-bad { color: var(--color-danger); }
.wp-tempo__legend samp.is-warn { color: var(--color-warning); font-weight: normal; }
.wp-tempo__legend samp.is-unknown { color: var(--color-text-muted); font-style: italic; font-weight: normal; }

.wp-tempo__in,
.wp-tempo__ls,
.wp-tempo__gr,
.wp-tempo__ms,
/* Der Querfeldein-Aufschlag: dieselbe Breite wie seine Nachbarn, keine eigene Formensprache. */
.wp-tempo__ramp,
/* Der Reisetag ebenso -- er ist eine Zahl unter Zahlen, kein Sonderfall. */
.wp-tempo__hr { width: 5.5rem; }

/* Die Quellenzeile eines Abschnitts: Buch und Seite, gedaempft wie eine Notiz, aber mit eigenem
   Abstand nach oben -- sie schliesst den Abschnitt ab und gehoert nicht an den naechsten Absatz.
   ⚠️ Kein Rahmen, kein Kasten: gruppiert wird ueber Trennlinie und Ueberschrift (AGENTS §12). */
.wp-tempo__src {
	margin: var(--space-6) 0 0;
	padding-top: var(--space-4);
	border-top: 1px solid var(--color-divider);
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

.wp-tempo__src b { color: var(--color-text); }

/* Die Zeile, die sagt, ob die Wegfindung ueberhaupt Bodenfaktoren findet.
   🔴 Ein stiller Not-Aus ohne Anzeige ist ein Ausfall (Entwurf §7) -- deshalb steht sie GANZ OBEN
   und traegt einen Statuston, nicht die gedaempfte Notizfarbe. */
.wp-tempo__probe {
	margin: 0 0 var(--space-6);
	padding: var(--space-4) var(--space-6);
	border-radius: var(--radius-md);
	font-size: var(--font-size-caption);
	border: 1px solid var(--color-divider);
}
.wp-tempo__probe.ok { color: var(--color-success); border-color: var(--color-success); }
.wp-tempo__probe.bad { color: var(--color-danger); border-color: var(--color-danger); }

/* Der Rücksetzer EINER Zeile. ⚠️ Er steht nur da, wenn der Wert abweicht: fuenfundsiebzig dauerhaft
   sichtbare Knoepfe in schmalen Spalten sind genau die Vervielfachung aus AGENTS.md §12. Die Zelle
   bleibt trotzdem immer da, damit die Spalten beim Tippen nicht springen. */
/* „war 3,45" hinter dem Feld. 🔴 Es beantwortet die Frage, die ein Ruecksetzer sonst offen laesst:
   welche Werte haben sich bewegt? Der Ton ist der Warnton, weil die Zeile eine ABWEICHUNG vom Stand
   von eben meldet -- nicht die gedaempfte Notizfarbe, sonst sieht man sie in einer Tabelle mit
   fuenfundsiebzig Zeilen nicht. Sie verschwindet beim naechsten Laden des Fensters. */
.wp-tempo__war {
	margin-left: var(--space-2);
	font-size: var(--font-size-caption);
	color: var(--color-warning);
	white-space: nowrap;
}

.wp-tempo__undocell { width: 1.75rem; padding-left: 0; padding-right: 0; }
.wp-tempo__undo {
	visibility: hidden;
	background: var(--color-button-soft);
	border: 1px solid var(--color-button-soft-border);
	color: var(--color-button-soft-text);
	border-radius: var(--radius-md);
	padding: 0 var(--space-2);
	font-size: var(--font-size-caption);
	line-height: 1.4;
	cursor: pointer;
}
.wp-tempo__tbl tr.is-dirty .wp-tempo__undo { visibility: visible; }
.wp-tempo__undo:hover { background: var(--color-button-soft-hover); }
.wp-tempo__ga,
.wp-tempo__eff { color: var(--color-text-muted); white-space: nowrap; }

.wp-tempo__dev,
.wp-tempo__locked { margin: 0; padding-left: var(--space-8); font-size: var(--font-size-caption); color: var(--color-text-muted); }
.wp-tempo__dev li,
.wp-tempo__locked li { margin-bottom: var(--space-2); }

/* ⚠️ Weich/outline, NIE gefüllt: der Rücksetzer ist eine Abschnittshandlung, nicht die
   Haupthandlung des Fensters -- die heißt „Speichern" und steht allein in der Leiste unten. */
.wp-tempo__reset {
	margin-top: var(--space-6);
	background: var(--color-button-soft);
	border: 1px solid var(--color-button-soft-border);
	color: var(--color-button-soft-text);
	border-radius: var(--radius-md);
	padding: var(--space-2) var(--space-6);
	font-size: var(--font-size-caption);
	cursor: pointer;
}
.wp-tempo__reset:hover { background: var(--color-button-soft-hover); }

/* ===== css/features/travel-model-curves.css ===== */
/* Die Kurven des Reisemodells — acht Kacheln, gezeichnet von js/routing/travel-model-curves.js.
 *
 * 🔴 GETEILT von zwei Orten: dem Wege-Editor („Funktionen anzeigen") und dem öffentlichen
 * ⓘ-Dialog „Transportmittel". Diese Regeln standen bis 2026-08-03 in css/pages/wege-editor.css
 * und wurden von dort hierher gezogen, als das Bild einen zweiten Leser bekam. Wer sie zurück
 * in eine der beiden Seiten kopiert, hat zwei Bilder, die sich nach dem nächsten Feinschliff
 * unterscheiden.
 *
 * Die `wp-`-Vorsilbe blieb: sie steckt in jedem SVG-Knoten, den der Zeichner ausgibt, und ein
 * Umbenennen wäre eine Änderung an zwei Seiten für null Gewinn. */

.wp-chart {
	margin: 0 0 var(--space-8);
	padding: var(--space-4);
	background: var(--color-panel-soft);
	border: 1px solid var(--color-border);
	border-radius: 6px;
}

.wp-chart svg { display: block; width: 100%; height: auto; }
.wp-chart__title { margin-bottom: var(--space-2); font-size: var(--font-size-caption); color: var(--color-text-muted); }
.wp-chart__title b { color: var(--color-text-strong); font-weight: var(--font-weight-bold); }

/* Recessive grid and axes -- the curve is the loudest thing in the picture. */
.wp-grid { stroke: var(--color-border); stroke-width: 1; }
.wp-axis { stroke: var(--color-text-muted); stroke-width: 1; }
.wp-tick { fill: var(--color-text-muted); font-size: 9px; }
.wp-axis-label { fill: var(--color-text-muted); font-size: 9px; font-style: italic; }
.wp-note { fill: var(--color-text-muted); font-size: 9px; }
.wp-cap { stroke: var(--color-text-muted); stroke-width: 1; stroke-dasharray: 2 4; }

/* The 20 % descent edge is a real jump in the model, not a drawing artefact -- it gets the danger
   tone because it is the one place the curve is discontinuous. */
.wp-edge { stroke: var(--color-danger); stroke-width: 2; stroke-dasharray: 3 3; fill: none; }

/* 🔴 COLOUR **AND** STROKE PATTERN. The second encoding is mandatory, not styling: see the note on
   --color-chart-* in tokens.css. Four series, four patterns, fixed order. */
.wp-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.wp-line--1 { stroke: var(--color-chart-1); }
.wp-line--2 { stroke: var(--color-chart-2); stroke-dasharray: 6 3; }
.wp-line--3 { stroke: var(--color-chart-3); stroke-dasharray: 2 3; }
.wp-line--4 { stroke: var(--color-chart-4); stroke-dasharray: 9 3 2 3; }

/* The legend sits BELOW/ABOVE the picture, never inside it: inside, it grows into the curve as the
   series count rises. It carries colour and pattern, i.e. exactly what distinguishes the lines. */
.wp-legend {
	display: flex;
	flex-wrap: wrap;
	gap: var(--space-4) var(--space-12);
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

.wp-legend span { display: inline-flex; align-items: center; gap: var(--space-4); }
.wp-legend svg { flex: 0 0 auto; width: 22px; height: 8px; }

/* Filters in ONE row above the pictures, never between them. */
.wp-controls {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: var(--space-4) var(--space-10);
	margin-bottom: var(--space-8);
	padding: var(--space-6) var(--space-8);
	background: var(--color-panel-soft);
	border: 1px solid var(--color-border);
	border-radius: var(--radius-md);
}

.wp-controls__label { font-size: var(--font-size-caption); font-weight: var(--font-weight-bold); color: var(--color-text-muted); }
.wp-controls label { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-body); cursor: pointer; }

/* On --color-panel-soft the warning tone wears its -soft-text step, not --color-warning. */
.wp-controls__note {
	margin: calc(-1 * var(--space-4)) 0 var(--space-8);
	padding: var(--space-4) var(--space-8);
	background: var(--color-warning-soft);
	border: 1px solid var(--color-warning-soft-border);
	border-radius: var(--radius-md);
	color: var(--color-warning-soft-text);
	font-size: var(--font-size-caption);
}

.wp-controls__note[hidden] { display: none; }

/* Die Erläuterungen unter dem Raster. Eigene Klasse statt `.wp-fn p`, seit der Zeichner die
   Absätze selbst ausgibt und damit auch außerhalb des Editor-Dialogs steht. */
.wp-fnnote {
	margin: var(--space-6) 0 0;
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
	line-height: var(--leading-normal);
}
.wp-fnnote b { color: var(--color-text-strong); font-weight: var(--font-weight-bold); }

/* Small multiples: FOUR per row (owner 2026-08-02). Grid tracks, not flex -- a border box cannot
   shrink below its own padding, grid tracks do not care.
   ⭐ Four is not arbitrary: there are seven land way types plus the factor curve itself, so the
   grid comes out as exactly 4 × 2 with no gap at the end.
   Fixed rather than `auto-fit`: the pictures are compared ACROSS rows („is the pass curve the same
   shape as the road's?"), and a reflowing column count moves a picture to a different position
   every time the window changes width. */
.wp-small {
	display: grid;
	grid-template-columns: repeat(4, minmax(0, 1fr));
	gap: var(--space-8);
	margin-top: var(--space-8);
}

.wp-small .wp-chart { margin: 0; }

/* Stepping down keeps whole rows: 4 → 2 → 1, never 3, so the pairing „road above, path below"
   survives a narrower window. */
@media (max-width: 1100px) {
	.wp-small { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 560px) {
	.wp-small { grid-template-columns: minmax(0, 1fr); }
}

/* 🔴 The factor curve is the EIGHTH tile, not a picture of its own (owner 2026-08-02). It is drawn
   in the same viewBox geometry as the seven speed pictures, so all eight tiles are the same size
   and the same shape -- a different aspect ratio in one cell would break the row. */
.wp-chart--factor { border-color: var(--color-border-strong); }


/* ===== NUR FÜR DAS MOCKUP ===== */
body.avm-editor-body { padding: 0; margin: 0; }
.mk-bar { display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap;
  padding: var(--space-6) var(--space-10); background: var(--color-panel-muted);
  border-bottom: 1px solid var(--color-divider); font-size: var(--font-size-caption);
  color: var(--color-text-muted); }
.mk-bar b { color: var(--color-text-strong); font-size: var(--font-size-small); }
.mk-bar__group { display: flex; gap: var(--space-4); }
.mk-bar button { min-height: 28px; padding: 0 var(--space-8);
  background: var(--color-button-soft); color: var(--color-button-soft-text);
  border: 1px solid var(--color-button-soft-border); border-radius: var(--radius-md);
  font-size: var(--font-size-caption); cursor: pointer; }
.mk-bar button.is-active { background: var(--color-button); color: var(--color-button-text);
  border-color: var(--color-button-border); }
.mk-frame { height: calc(100vh - 48px); display: flex; flex-direction: column; }

/* Der Geltungsbereich-Kopf: sagt in einem Satz, worauf das Speichern wirkt.
   Gebaut aus vorhandenen Tokens -- Panel-Ton, brauner Akzentrand, --radius-md. */
.wpg-scope { margin: 0 0 var(--space-8); padding: var(--space-8) var(--space-10);
  background: var(--color-panel-soft); border-left: 3px solid var(--color-accent-brown);
  border-radius: var(--radius-md); }
.wpg-scope--one { border-left-color: var(--color-divider); }
.wpg-scope__title { font-size: var(--font-size-reading); color: var(--color-text-strong); }
.wpg-scope__of { color: var(--color-text-muted); font-size: var(--font-size-caption); }
.wpg-scope__sub { margin-top: var(--space-2); font-size: var(--font-size-caption);
  color: var(--color-text-muted); line-height: 1.45; }
/* Der Zaehler hinter dem halben Haken -- IN der Namenszelle (siehe Kommentar im Erzeuger). */
.wpg-mixed { font-size: var(--font-size-caption); color: var(--color-text-muted);
  white-space: nowrap; flex: 0 0 auto; }
.dt-tt__name > span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 🪤 BESTANDSFEHLER, hier gleich mitgezeigt: `.avm-row` traegt `width: 100%`
   (editor-row.css, fuer die <button>-Zeilen zweier anderer Editoren), und `.wp-segment`
   setzt zusaetzlich `margin-left: 12px` -- macht 12 px Ueberbreite und eine waagerechte
   Bildlaufleiste unter der Wegeliste. Im Screenshot des Owners ist sie zu sehen. */
.wp-segment { width: auto; }

/* Die Abschnittsmarken im Gesamtdiagramm. */
.wpg-cut { stroke: var(--color-divider); stroke-width: 1; stroke-dasharray: 2 3; }
.wpg-cut-label { fill: var(--color-text-muted); font-size: 7px; text-anchor: middle; }
</style>
</head>
