/* ===== css/base/tokens.css ===== */
/* Avesmaps design tokens — the single source of truth for the shared warm,
   aventurian visual language. Never hardcode a colour, size, radius, spacing, or
   divider in a component; add or reuse a token here. See docs/design-language.md.

   Palette direction: C ("Heller / Papier") — light neutral parchment, warm
   taupe-brown controls, restrained coat-gold. No blue anywhere.

   Themes: light is the default (:root). Dark is OPT-IN via
   :root[data-theme="dark"] — deliberately NOT prefers-color-scheme, because the
   map tiles are light and auto-dark panels would clash over them. Wiring a
   toggle is a separate feature; the language only defines the values. */

:root {
	--font-ui: "Faculty Glyphic", "Arial", sans-serif;

	/* Typography scale — 7 rungs, 11px floor (see "Typography" in the doc) */
	--font-size-caption: 11px;  /* labels, pills, meta — the floor */
	--font-size-small: 12px;    /* dense body — the workhorse */
	--font-size-body: 13px;     /* default controls / body */
	--font-size-reading: 14px;  /* comfortable reading */
	--font-size-subhead: 16px;  /* subheaders */
	--font-size-title: 20px;    /* dialog / panel titles */
	--font-size-display: 22px;  /* infobox hero name */
	/* Sperrung der VERSALIEN-Abschnittsueberschriften. Angelegt am 16.08.2026, als die
	   Wiki-Zuweisung den Wert als weiteren Ort gebraucht haette -- ein Literal mehr baut die
	   Divergenz ein, die §12 meint.
	   ⚠️ BEWUSST NICHT MITGEZOGEN sind die Stellen, die den Wert weiterhin literal fuehren; sie
	   liegen in fremden Oberflaechen, und eine Sammelaenderung an ihnen gehoert nicht in den
	   Commit einer Objektart:
	       css/features/ecosystem-layer.css:1034
	       css/features/mail-inbox.css:52
	       css/features/review-panel.css:1193
	       css/pages/admin.css:114
	   💣 Hier stand eine ZAHL („die uebrigen fuenf"), und sie war falsch: gezaehlt wurden sechs
	   Fundstellen, von denen dieser Commit ZWEI selbst tokenisiert hat -- die Klammerliste nannte
	   sogar den Label-Editor, dessen Vorkommen es danach gar nicht mehr gab. Eine Zahl liest sich
	   wie eine vollstaendige Liste und niemand zaehlt nach (AGENTS.md §11); wer eine Stelle
	   nachzieht, streicht sie oben. */
	--letter-spacing-caps: 0.08em;
	/* Schriftgroesse der EINGABEFELDER -- getrennt von der Lese-Skala oben, weil sie am Finger
	   auf die iOS-Schwelle springt (siehe den (pointer: coarse)-Block unter diesem :root).
	   ⚠️ Gilt den FELDERN, nicht ihren Beschriftungen: die Felder haben feste Hoehen, die Schrift
	   waechst dort nach innen. Beschriftungszeilen mitzuheben machte das Panel hoeher -- und dessen
	   Hoehenbudget ist eine eigene, groessere Frage. */
	--font-size-control: var(--font-size-small);
	/* Schriftgroesse der DROPDOWNS -- eigener Wert, nicht --font-size-control (Owner 11.08.2026:
	   "alle auf 14px").
	   💣 Getrennt, weil --font-size-control die iOS-SCHWELLE traegt: unter 16px zoomt Safari beim
	   Fokus in ein Eingabefeld und kehrt nicht zurueck. Ein gemeinsamer Token auf 14 haette das
	   Wegpunktfeld und die Zahlenfelder mit unter die Schwelle gezogen -- also genau das
	   zurueckgeholt, was zwei Commits vorher behoben wurde.
	   ⚠️ Fuer die nachgebauten Comboboxen ist 14 unbedenklich (<button>, kein Fokus-Zoom). Fuer
	   die zwei nativen <select> ist es NICHT geprueft -- ob iOS auch dort zoomt, sagt nur ein
	   echtes Geraet. */
	--font-size-dropdown: 14px;

	/* Der Pfeil unserer Auswahlfelder. 💣 Als Token, weil ihn ZWEI Stellen brauchen (Meldedialog
	   und Routenplaner) und ein zweiter Data-URI genau die Divergenz waere, vor der §12 warnt --
	   zwei Bilder, deren Farbe getrennt altert.
	   ⚠️ Die Fuellung steht als Hex im Bild, nicht als currentColor: ein background-image kann
	   currentColor nicht erben. Der Wert ist --color-text-muted. */
	--avesmaps-select-chevron: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='8'%20height='6'%3E%3Cpath%20d='M0%200l4%205%204-5z'%20fill='%23706557'/%3E%3C/svg%3E");
	--leading-tight: 1.15;      /* titles / display */
	--leading-snug: 1.25;       /* controls / labels */
	--leading-normal: 1.45;     /* reading body */
	--font-weight-regular: 400;
	--font-weight-bold: 700;    /* two weights only — no 500 / 600 / 800 */

	/* Surfaces */
	--color-page-bg: #f3f0e8;        /* app canvas behind the panels */
	--color-page-bg-deep: #2b2721;   /* deep surround (editor backdrop) */
	--color-panel: #fffdf9;          /* white card (infobox, route planner) */
	--color-panel-soft: #faf6ee;     /* softly grouped background */
	--color-panel-muted: #f1ece1;    /* muted inset (coat frame, wells) */
	/* The SELECTED row of a list or rail. One step further from the panel than -muted, in the
	   direction that reads as "pressed" in each theme: darker on light, lighter on dark. -muted
	   alone was too close to the panel to find the active row at a glance. */
	--color-panel-active: #e7ddc9;

	/* Text */
	--color-text: #2e271e;
	--color-text-strong: #3c3327;    /* titles, emphasised labels */
	--color-text-muted: #706557;     /* subtitles, captions, meta */
	--color-placeholder: #9a8f7e;    /* input placeholder — lighter than muted */

	/* Lines */
	--color-border: #ddd3c3;         /* hairline around controls */
	--color-border-strong: #cdbfa8;  /* hover / emphasised control edge */
	--color-divider: rgba(125, 115, 96, 0.30); /* section separator — same everywhere */

	/* Button · primary (filled) — the one main action per surface */
	--color-button: #5b5548;
	--color-button-border: #635b4d;
	--color-button-text: #f6efe1;
	--color-button-hover: #6a6353;         /* hover — lighter */
	--color-button-active: #4c473b;        /* pressed — darker */

	/* Button · secondary (soft / outline) — e.g. "Link teilen" */
	--color-button-soft: #efe9db;
	--color-button-soft-text: #564b3b;
	--color-button-soft-border: #cdbda0;
	--color-button-soft-hover: #e7ddc9;
	--color-button-soft-active: #ddd1b9;

	/* Accent = coat-of-arms gold; links in warm gold-brown (NEVER blue) */
	--color-accent: #bfa03a;
	--color-accent-strong: #9c7f22;
	--color-link: #8f7326;
	--color-link-hover: #6f5a1c;

	/* Secondary accent-brown — the WikiSync/label-path-location edit dialogs' own
	   accent (links, active tabs, focus rings), distinct from the app-wide
	   --color-accent-strong gold but from the same warm family. */
	--color-accent-brown: #7a5a3a;
	--color-accent-brown-hover: #5f4429;
	--color-accent-brown-soft: #9a7a5a;
	--color-accent-brown-text: #fff;
	--color-accent-brown-focus: rgba(122, 90, 58, 0.18);

	/* Pills / tags (e.g. publication sources) */
	--color-pill: #f3ecd9;
	--color-pill-border: #d7c7a2;
	--color-pill-text: #675024;

	--color-danger: #9d3a2e;
	--color-success: #2f7d3a;             /* status: success (e.g. contact form) */
	/* Halo around a presence dot (online editor, live visitor count) — the ring that
	   lifts a 9px dot off the panel without giving it a border. */
	--color-success-halo: rgba(79, 159, 74, 0.16);
	--color-muted-halo: rgba(161, 140, 116, 0.16);
	/* Soft status surfaces — the pale tinted fills for accept/reject buttons and status pills in the
	   editor (Meldungen, WikiSync). --color-success/-danger above are the solid text colours; these carry
	   a full bg/border/text set so the buttons follow the theme instead of staying light in dark mode. */
	--color-success-soft: #eef6e2;
	--color-success-soft-border: #a9c07f;
	--color-success-soft-text: #3c5a1c;
	--color-danger-soft: #fbeae6;
	--color-danger-soft-border: #d3a79c;
	--color-danger-soft-text: #8a2d22;
	/* Link status — the reachability marker behind an external link (linkchecker). "online" reuses the
	   success green so the two never drift apart; "offline" is a muted warm grey, NOT a red: a link that
	   has gone is a fact worth noting, not an error the reader can act on. Deliberately not
	   --color-map-presence*, which is pinned identical in both themes because it sits on the always-light
	   map tiles — these markers live in panels and must follow the theme. */
	--color-status-online: var(--color-success);
	--color-status-offline: #8b8478;
	/* Status: warning (amber) — the third status colour next to --color-success/--color-danger,
	   used by the WikiSync + settlement editors (coverage gaps, attribution-required licences,
	   values diverging from the wiki). --color-warning is the solid text/border/dot value;
	   -soft* is the pale filled badge (hint boxes, "Lücke" badges); -strong* is the filled
	   ACTIVE warn chip. */
	--color-warning: #b8860b;
	--color-warning-soft: #faeeda;
	--color-warning-soft-border: #ef9f27;
	--color-warning-soft-text: #854f0b;
	--color-warning-strong: #f4c869;
	--color-warning-strong-text: #4a3300;
	/* Route waypoints — ONE language across map, route planner and infopanel (Owner): every waypoint is
	   red, the destination is a teardrop, and the SELECTED one turns gold-yellow. Red means "waypoint",
	   gold means "selected" — never "which position in the route".
	   These stay the SAME in both themes on purpose: the same mark appears on the always-light map tiles
	   and on the dark panels, and it must read as the same thing in both places. */
	--color-marker-waypoint: #e33b35;      /* heraldic red — matches the red settlement markers */
	--color-marker-waypoint-core: #2e2119; /* the dark "eye" + outline inside the mark */
	--color-marker-waypoint-ring: #dcb877; /* the gold ring (map marker only — invisible below ~16px) */

	/* Review stars — the rating glyphs (infobox summary + write-dialog picker). Warm coat-gold,
	   not a generic yellow; `-muted` is the empty-star track. */
	--color-star: #e0a528;
	--color-star-muted: #d9c7a6;

	/* Active/selected map location — the clicked settlement's marker fills gold-yellow (Owner). Also the
	   SELECTED route waypoint (see above). The marker sits on the always-light map tiles, so the dark
	   value stays the same warm gold. */
	--color-marker-active: #f0b429;

	/* Editor-Markierungswerkzeuge (Discord #25) -- kräftige Warnringe um Marker, je ein Ton pro
	   Befund: pink = "Unverbunden" (gar keine Anbindung), türkis = "Kreuzungen mit 2 Wegen"
	   (überflüssiger Knoten). Pinned wie --color-marker-waypoint oben: die Ringe sitzen auf den
	   IMMER-hellen Kartenkacheln, nicht auf einem Theme-Panel, also kein Dark-Override. */
	--color-marker-unconnected-ring: #e0559a;
	--color-marker-sparse-crossing-ring: #0fb9b1;
	/* Ringstärke, EIN Wert für beide Töne (Owner 14.08.2026: „ruhig dicker", vorher 4 px) — sonst
	   driften pink und türkis auseinander, sobald jemand nur einen der beiden anfasst.
	   ⚠️ Das Zeichen der Prüfzeile im Anzeige-Menü wiederholt den Ring als Legende, nimmt diesen Wert
	   aber NICHT: sein 24er-viewBox schrumpft auf --icon-md, dort ist 7 px die falsche Zahl (und
	   `var()` löst in `stroke-width` als Attribut ohnehin nicht auf). Es soll gleich aussehen, nicht
	   gleich groß sein. */
	--marker-check-ring-width: 7px;
	/* Discord #43 -- bernstein = "offenes Wegende": ein per Strg vom Ort getrenntes Wegende, das noch
	   an nichts haengt. Gleiche Begruendung wie oben (helle Kacheln, kein Dark-Override). Bewusst
	   NICHT --color-accent: das Gold markiert waehrend des Ziehens den Marker, das Bernstein danach
	   die zurueckgebliebene Luecke -- zwei Zustaende, zwei Toene. */
	--color-marker-open-path-end-ring: #e8850c;

	/* „Grenze aus Territorien" (Fall #68) -- die Territoriumsumrisse, solange das Fenster offen ist
	   (leise), und der Umriss unter dem Zeiger (laut). Gepinnt wie die Ringe darueber: beides liegt auf
	   den IMMER-hellen Kartenkacheln, ein Dark-Override machte sie dort unsichtbar.
	   Bewusst NICHT --color-marker-active: das Gold traegt hier schon die Vorschau der GEWAEHLTEN
	   Vereinigung. „Was ich treffen wuerde" und „was ich gewaehlt habe" duerfen nicht denselben Ton
	   haben, sonst sagt keiner von beiden noch etwas. */
	--color-import-outline: #8a7350;
	--color-import-hover: #b4651a;

	/* "Edit in progress" blue -- the ring of every drag handle on the map (.path-edit-handle-marker__dot
	   in css/features/path-editor.css, used by the path, region and landscape editors). This is one of
	   the two documented no-blue EXCEPTIONS in docs/design-language.md: it encodes a STATE, not chrome,
	   and must not be "corrected" to a warm tone. It is a token so the contour of an area being edited
	   can say the same thing in the same colour instead of writing the literal a second time. Pinned:
	   drawn on the always-light map tiles. */
	--color-edit-handle: #1452f7;
	/* Dieselbe Ausnahme, eine Stufe leiser: die Unterflächen einer mehrteiligen Landschaftsfläche, die
	   GERADE NICHT gemeint sind. Die gemeinte trägt --color-edit-handle, die übrigen dieses dunklere
	   Blau — man sieht damit auf einen Blick, aus wie vielen Stücken die Fläche besteht und welches der
	   nächste Klick trifft (Owner 2026-07-27). Gepinnt, liegt auf hellen Kacheln. */
	--color-edit-handle-muted: #0b2a80;

	/* Landschaften (Erprobung), colours per Owner 2026-07-26. All three layers are on at once, so the
	   tones must stay tellable apart -- but they are not three peers: the derographic layer draws
	   administrative CONTAINERS (grey, and unfilled while it rests), topography draws relief, and only
	   vegetation carries real ground cover, which is why it is the one that gets a tone per type
	   instead of a single colour. Pinned in both themes for the same reason as the marker rings above:
	   these are painted ON the always-light map tiles, never on a themed panel. */
	--color-ecosystem-derographisch: #575757; /* neutral grey -- regions, islands, continents */
	/* Placeholder. The height map (high -> white) replaces this per the concept; until then one
	   brown-grey stands in for the whole relief layer. */
	--color-ecosystem-topographie: #7a6c5e;   /* brown-grey -- mountains, hills, coast, sea */
	/* CONTOURS for those two, markedly darker than their own fill (Owner 2026-07-26). Only these two
	   have one: vegetation carries a tone per type, and its contour follows that tone -- see
	   ecosystemAreaColor(). A missing token here means "use the fill colour", which is what keeps the
	   rule one rule instead of a second table.
	   ⚠️ The topographic contour is a neutral dark SLATE, not the brown it started as: since that layer
	   gained a tone per type it has to sit on brown-grey, grey-green, blue, dark blue and turquoise
	   alike, and a brown line on a sea reads as dirt. One line per LAYER is still the rule -- the point
	   of the dark contour is "this is where the area ends", and that answer must not change per type. */
	--color-ecosystem-derographisch-contour: #2e2e2e;
	--color-ecosystem-topographie-contour: #2b3138;
	/* Owner 2026-07-29: „die Konturen der Vegetationsflächen dunkler". Bis hierher hatte die Vegetation
	   als EINZIGE Ebene keinen eigenen Konturton und erbte deshalb ihre Füllfarbe -- ein Waldrand war
	   waldgrün auf waldgrün und verschwand. Ein dunkles Blattgrün statt des Grau-Blaus der Topographie:
	   die Kante gehört zur Ebene, nicht zum Fels. */
	--color-ecosystem-vegetation-contour: #22351c;
	/* The fallback for a vegetation region with no type set. The per-type tones below win when the
	   region has one; they are looked up BY RULE from the type_key
	   (--color-ecosystem-<kind>-<type_key with _ as ->), so a newly seeded type needs a token here
	   and nothing else -- there is no list of them in the client to keep in sync. */
	--color-ecosystem-vegetation: #5f7d33;
	--color-ecosystem-vegetation-wald: #3f6b2c;             /* dense forest */
	--color-ecosystem-vegetation-suempfe-moore: #2f4a2a;    /* swamp and moor, dark green */
	--color-ecosystem-vegetation-steppe: #a8bd8a;           /* steppe, pale green */
	--color-ecosystem-vegetation-tundra: #6f9d94;           /* tundra, blue-green */
	--color-ecosystem-vegetation-auenlandschaft: #4f9e35;   /* floodplain, vivid green */
	--color-ecosystem-vegetation-wueste: #e0c74e;           /* desert, yellow */
	--color-ecosystem-vegetation-graslandschaft: #8fbf6a;   /* grassland, soft green */
	--color-ecosystem-vegetation-flussland-flusstal: #4a8f6b; /* river land and valley, green with a water cast */
	--color-ecosystem-vegetation-dschungel: #1e7d32;        /* jungle, deep saturated tropical green */
	--color-ecosystem-vegetation-wuestenoase: #2fa88c;      /* desert oasis, teal-green -- water in the sand */
	--color-ecosystem-vegetation-kulturlandschaft: #a9a14c; /* cultivated land, matt olive gold -- ripe grain; duller and darker than the desert yellow so the two never blur, warmer than steppe and grassland */

	/* Topography per type, same rule (Owner 2026-07-27). Until today the whole layer was one brown-grey;
	   it draws relief AND water, and those two do not share a colour in any map anyone has ever read.
	   💣 THE BLUES ARE A DELIBERATE, PERMANENT EXCEPTION TO "no blue" (§12) -- do not "correct" them in a
	   token sweep. The no-blue rule is about UI chrome: panels, controls, links, menus. These are DATA
	   painted on the map, in the same category as the analytics chart's categorical palette and the
	   heraldic red of the route markers, and the map's own rivers have been blue all along. A sea drawn
	   in warm brown would be unreadable to every editor who has ever seen a map. */
	--color-ecosystem-topographie-gebirge: #7a6c5e;         /* mountains, brown-grey */
	--color-ecosystem-topographie-huegelland: #7d8f6e;      /* hills, grey-green */
	--color-ecosystem-topographie-see: #4a86b8;             /* lake, blue */
	--color-ecosystem-topographie-meer: #2d5f8a;            /* sea, dark blue */
	--color-ecosystem-topographie-kueste: #3f9e9a;          /* coast, turquoise */
	--color-ecosystem-topographie-wadi: #9b8a5c;            /* wadi, sand with an olive cast -- a bed that is dry most of the time */
	--color-ecosystem-topographie-schlucht: #5c5148;        /* gorge, dark rock -- deliberately darker than the mountains: it reads as depth */
	--color-ecosystem-topographie-hochebene: #9a9b82;       /* plateau, pale grey-green -- high but flat, lighter than the hills */
	--color-ecosystem-topographie-tiefebene: #6f7a55;       /* lowland, deeper warm olive -- the plateau's counterpart, low and lush */
	--color-ecosystem-topographie-tal: #6b7266;             /* valley, shaded green-grey -- an incision like the gorge, but wide and walkable */
	--color-ecosystem-topographie-flussdelta: #5e8f86;      /* river delta, silted teal -- water and deposited land, duller than the coast's turquoise */
	/* Owner 2026-07-30, the day `insel` moved from derographisch to topographie. 🔴 NOT optional: without
	   this token ecosystemAreaColor() falls back to --color-ecosystem-topographie, which IS the mountain
	   brown-grey -- all 251 islands would render as mountains. Sandy beige-olive: reads as LAND against
	   see (#4a86b8) and meer (#2d5f8a), and stays apart from gebirge (#7a6c5e) and hochebene (#9a9b82). */
	--color-ecosystem-topographie-insel: #b2a273;           /* island, sandy beige-olive -- dry land ringed by water */

	/* Klimazonen (Owner 2026-08-03). Sieben Bänder von Nord nach Süd, abgeleitet aus sechs
	   Trennlinien. Bewusst KEINE Grün-Skala: Grün gehört der Vegetation, und die beiden Ebenen müssen
	   nebeneinander unterscheidbar bleiben. Dies ist eine reine TEMPERATURSKALA -- Eis, blass, neutral,
	   gold, warm --, die von selbst „oben kalt, unten heiss" liest.
	   💣 Die Namensregel ist bindend: --color-ecosystem-klima-<type_key mit - statt _>. Fehlt ein Ton,
	   fällt ecosystemAreaColor() auf --color-ecosystem-klima zurück und alle sieben Bänder sehen gleich
	   aus -- dieselbe Falle, die bei `insel` 251 Flächen zu Gebirgen gemacht hätte.
	   Die kühlen Töne sind dieselbe bewusste Ausnahme von „kein Blau" wie See und Meer darüber:
	   gemalte KARTENDATEN, nicht UI-Chrom (§12). Gepinnt, sie liegen auf den immer hellen Kacheln.

	   💣 HIER STAND EIN ÜBERZÄHLIGES KOMMENTARENDE (seit 2026-08-03, gefunden am 12.08.2026). Der
	   Absatz darunter war damit kein Kommentar mehr, sondern Text mitten im :root-Block -- und der
	   CSS-Parser verwirft ab dort bis zum nächsten Semikolon. Verschluckt hat das GENAU EINE Zeile:
	   `--color-ecosystem-klima`, den Rückfallton, den der Absatz oben als tragend beschreibt. Live
	   gemessen war er neun Tage lang nicht definiert, während alle sieben Bänder daneben standen.
	   ⚠️ So etwas fällt nie von selbst auf: Es gibt keine Fehlermeldung, die Datei sieht richtig
	   aus, und der Fehler zeigt sich erst, wenn ausgerechnet der Rückfall gebraucht wird. Gewacht
	   wird jetzt von js/app/__tests__/css-comment-balance.test.js.

	   Owner 2026-08-03, zweiter Durchgang: „etwas stärker". Die ganze Rampe eine Stufe kräftiger, und
	   das kalte Ende am deutlichsten -- #e6eef3 war auf den hellen Kacheln bei jeder Deckkraft fast
	   unsichtbar, was die Polare Zone praktisch unbeschriftet liess. Die Reihenfolge kalt→warm und der
	   neutrale Ton in der Mitte bleiben; nur der Kontrast zwischen benachbarten Zonen wächst. */
	--color-ecosystem-klima: #bfc888;                       /* fallback -- the middle of the ramp */
	--color-ecosystem-klima-polar: #cfe0eb;                 /* polar, pale ice */
	--color-ecosystem-klima-subpolar: #a2c3d1;              /* subpolar, ice blue */
	--color-ecosystem-klima-boreal: #7aada9;                /* boreal, cold teal */
	--color-ecosystem-klima-gemaessigt: #bfc888;            /* temperate, neutral olive */
	--color-ecosystem-klima-subtropen-winterfeucht: #dcb857; /* winter-wet subtropics, warm gold */
	/* Owner 2026-08-03, nachtraeglich zwischen die beiden geschoben. Der Unterschied zur Nachbarin
	   darueber ist die FEUCHTE, nicht die Temperatur -- deshalb ein entsaettigter Sandton statt einer
	   weiteren Stufe auf der Warm-Rampe. Er liegt zwischen Gold (#dcb857) und Ocker (#d98f3c) und
	   unterscheidet sich von beiden durch die Blässe, nicht durch den Farbton: zwischen zwei so nahen
	   Nachbarn ist das der einzige Platz, der noch frei war. */
	--color-ecosystem-klima-trockene-subtropen: #cdb083;    /* dry subtropics, dusty sand */
	--color-ecosystem-klima-subtropisch: #d98f3c;           /* subtropical, orange ochre */
	--color-ecosystem-klima-tropisch: #c65e2e;              /* tropical, warm terracotta */
	/* Die Trennlinie. Ein neutrales Dunkel, das auf allen acht Tönen sitzt -- dieselbe Begründung wie
	   beim topographischen Konturton: wo eine Zone aufhört, ist genau die Auskunft dieser Ebene, und
	   die darf ihre Farbe nicht je Zone wechseln.
	   🪤 Der ZONENNAME hatte hier bis 2026-08-05 einen eigenen Ton (--color-ecosystem-klima-label,
	   #33302b). Er trägt jetzt den Ton SEINER Zone und holt ihn über dieselbe Regel wie die Füllung
	   ihres Bandes (ecosystemAreaColor) -- je Zone steht der Ton schon oben, ein zweiter wäre die
	   Kopie, die beim Einschieben einer neunten Zone zurückfiele. */
	--color-ecosystem-klima-divider: #2b3138;
	/* Der dunkle Saum hinter dem Zonennamen (Owner 2026-08-05: „vielleicht den halo dunkel machen wie
	   beim rest"). Bis dahin war es umgekehrt -- dunkle Schrift, heller Saum. Seit der Name den Ton
	   seiner Zone trägt, geht das nicht mehr: die Rampe reicht von fast weissem Polareis bis zu warmem
	   Ocker, und ein heller Saum liesse das kalte Ende auf den hellen Kacheln verschwinden. Ein dunkler
	   trennt alle acht Töne vom Grund -- dieselbe Bauart wie bei den Karten-Labels, deren Halo
	   ebenfalls rgba(0, 0, 0, 0.85) ist (`glow` in map-features-labels.js), nur als text-shadow statt
	   im Canvas gezeichnet. Halbtransparent, damit er ein Saum bleibt und kein Kasten. */
	--color-ecosystem-klima-label-halo: rgba(0, 0, 0, 0.85);

	/* Höhenrampe (V8). Fünf Stufen vom Gebirgsfuss bis zum Firn, aus dem Prototyp
	   (html/landschaften-modell.html:589) übernommen -- dort standen sie als rohe RGB-Tripel im Code,
	   was AGENTS.md §12 verbietet. Warme Erdtöne, kein Blau: das Relief ist gemalte Karte, nicht
	   Datenvisualisierung, und es liegt neben Pergament und Wappengold.
	   🔴 UMGESTELLT (Owner 2026-07-28): Graustufen auf ABSOLUTER Skala, als Schleier über die
	   Topographieflächen gelegt -- 0 Schritt schwarz, HEIGHT_WHITE_SCHRITT weiss
	   (map-features-ecosystem-height-render.js). Vorher war es eine warme Fünf-Farben-Rampe, RELATIV
	   zum höchsten Gipfel DERSELBEN Fläche.
	   Der Grund für den Wechsel: relativ skaliert sah ein 2.600er Bergland aus wie ein 5.200er Wall --
	   die Farbe war innerhalb eines Gebirges lesbar, zwischen zweien aber bedeutungslos. Absolut
	   skaliert bedeutet ein Grauwert überall dasselbe.
	   💣 Der Preis steht hier, weil er beim Umstellen bestritten wurde und wieder bestritten werden
	   wird: je höher der Weisspunkt, desto dunkler und flacher wird ALLES darunter. Bei 15.000 Schritt
	   und einem Livebestand, dessen Gipfel per Vorgabe auf 5.000 stehen, bleibt der grösste Teil der
	   Karte im unteren Drittel der Rampe. Das ist die eine Zahl, an der man dreht -- nicht die Farben. */
	/* 🔴 Der untere Anschlag ist die GRUNDFARBE DER FLÄCHE, nicht Schwarz (Owner 2026-07-28). Damit
	   ändert sich beim Aktivieren am Gebirgsfuss nichts sichtbar und es entsteht der Eindruck, dass
	   nur das Höhenmodell dazukommt -- vorher wurde ein warm brauner Zug zu einem dunklen Fleck.
	   Der Wert spiegelt --color-ecosystem-topographie-gebirge; wer den ändert, ändert auch diesen. */
	/* 🔴 Die FÜNF Stützstellen des Prototyps (html/landschaften-modell.html:589), auf Owner-Wunsch
	   2026-07-28 wieder eingesetzt -- dort standen sie als rohe RGB-Tripel im Code, was AGENTS.md §12
	   verbietet. Warme Erdtöne vom Gebirgsfuss bis zum Firn, kein Blau: das Relief ist gemalte Karte.

	   🔴 FARBE UND DECKKRAFT SIND ZWEI DINGE, und das ist der Kern dieser Fassung. Die Farbe kommt aus
	   dieser Rampe, die Deckkraft aus derselben Höhe: 0 Schritt = durchsichtig, 5.000 = voll. Am
	   Gebirgsfuss ist der Schleier deshalb unsichtbar, und welche Farbe dort steht, spielt keine Rolle
	   -- nach oben hin verdichtet er sich und die Rampe kommt zum Vorschein.

	   Die Abstände sind ungleich, so wie im Prototyp: der Übergang ins Firn sitzt spät (0,8), damit
	   nicht jeder Mittelhang schon weiss wird. */
	--color-ecosystem-height-0: #b0be9e;                    /* 0 % -- Fuss, fahles Grün */
	--color-ecosystem-height-1: #c6be96;                    /* 25 % -- untere Hänge, Sand */
	--color-ecosystem-height-2: #bea37c;                    /* 55 % -- Mittellage, Braun */
	--color-ecosystem-height-3: #d6c4b2;                    /* 80 % -- Hochlage, helles Braun */
	--color-ecosystem-height-4: #f7f3ee;                    /* 100 % -- Firn, fast Weiss */
	/* Deckkraft des Höhenschleiers. Er liegt ÜBER den Flächenfüllungen (Pane 420 über 250), also
	   entscheidet dieser Wert, wie viel Regionsfarbe noch durchkommt. */
	--opacity-ecosystem-height: 0.55;
	/* Selection contour (Owner 2026-07-26): a SELECTED area is outlined in white, an area whose corners
	   are open for editing in the handle blue above. Two states, two contours -- the same principle as
	   the two marker rings further up, and the reason the fill keeps its own tone in both cases: the
	   colour says "which area", the contour says "what can I do with it". White because it reads on
	   every one of the ten ground tones below/above it; pinned for the usual reason (light tiles). */
	--color-ecosystem-selected-outline: #ffffff;
	/* Das Ziel, über dem die Maus bei einer laufenden booleschen Operation steht. Blasses Gold, damit es
	   sich von der weissen Auswahlkontur darüber unterscheidet und trotzdem auf allen zehn Grundtönen
	   liest. Wert übernommen aus der Territorien-Hervorhebung, die ihn hartkodiert im setStyle stehen
	   hat (map-features-region-pending-highlight.js:16) -- hier steht er einmal als Token, damit die
	   beiden Ebenen nicht auseinanderlaufen. Gepinnt wie die Nachbarn: liegt auf hellen Kacheln. */
	--color-ecosystem-target-outline: #fff4a3;
	/* 💣 DIE BREITE DES TREFFERBANDES STEHT EINMAL, WEIL SIE ZWEI REGELN TRAEGT (Owner 2026-08-14, 12px).
	   Waehrend einer booleschen Zielwahl trifft nicht mehr die Fuellung, sondern allein die Kontur
	   (`pointer-events: stroke`) -- und `stroke` misst sein Trefferfeld an `stroke-width`. Die Zahl ist
	   damit KEINE Verzierung, sondern der Anfasser selbst: sie steht an der Band-Regel UND an der
	   Hervorhebung der Flaeche unter dem Zeiger (.ecosystem-area--target). Getrennt gepflegt schrumpfte
	   das Band im Augenblick des Ueberfahrens auf die alten 5px -- also genau dann, wenn der Zeiger schon
	   daraufsteht, und der Treffer ginge unter der Hand verloren. Guard: ecosystem-pick-band.test.js. */
	--ecosystem-pick-band-width: 12px;
	/* The paper the map is drawn on. The "Untergrund" slider fades the base tiles out towards THIS, so
	   at 0% the frame looks like no base map at all and the drawn areas stand alone (Owner 2026-07-26).
	   Pinned white, deliberately NOT --color-panel: this is map surface, not a panel, and in the dark
	   theme a themed value would fade the tiles into near-black instead of clearing them away. */
	/* Was hinter den ausgeblassten Kacheln durchscheint. 🔴 NICHT MEHR WEISS (Owner 2026-08-04: „kann man
	   den Untergrund etwas dunkler ... machen?"). Reines Weiss hinter 25 % Kachel ergab eine fast leere
	   Seite, auf der auch kräftige Flächenfarben blass wirkten -- der Untergrund nahm ihnen den Kontrast
	   von unten. Ein warmes Pergamentgrau ist der Ton, gegen den die Landschaftsfarben stehen, statt in
	   ihm zu verschwinden; es bleibt heller als jede Flächenfarbe und damit Hintergrund. */
	--color-ecosystem-underground: #d3cec2;

	/* Modal scrim (behind centred dialogs) */
	--color-scrim: rgba(38, 28, 16, 0.5);

	/* Editor dialog overlays (report/edit/wiki-sync/path/powerline/label/region) — a
	   darker, denser scrim than --color-scrim above. Pinned: same in both themes. */
	--color-scrim-dialog: rgba(20, 16, 12, 0.56);
	/* Full-bleed territory editor overlay — stronger still, paired with backdrop blur. */
	--color-scrim-editor: rgba(20, 16, 12, 0.6);
	/* Spotlight search overlay — lighter + blurred, keeps the map visible behind it. */
	--color-scrim-light: rgba(18, 15, 12, 0.34);
	/* Spoiler lid on a Kartensammlung card (Spec §3.7). Unlike every scrim above it does not sit BEHIND a
	   dialog but ON a card, over already-blurred content: dense enough that the title underneath stays
	   unreadable, light enough to read as a lid rather than a hole. Pinned + its own text colour: it
	   always covers card content and always carries light text, so a themed --color-text-strong would go
	   dark-on-dark in the light theme. */
	--color-scrim-spoiler: rgba(20, 16, 12, 0.62);
	--color-scrim-spoiler-text: #f4ece0;

	/* Territory-editor sticky header — translucent panel + backdrop-filter blur
	   so scrolled content shows through faintly. */
	--color-panel-translucent: rgba(255, 253, 249, 0.96);

	/* Travel-speed tiers — the functional ampel in the speed-matrix dialog. A data
	   highlight, not chrome. 💣 THIS ONE IS THEMED (see the dark block below): it was
	   pinned across both themes until 2026-08-04, and the pale light-theme fills then
	   stood at 11:1 against the dark dialog — three glaring blocks instead of a tinted
	   table. The dark set repeats the LIGHT theme's own relationship (fill ~1.5:1 over
	   its panel), which is what makes it read as the same component. */
	--color-tier-fast-bg: #d2e5ad;
	--color-tier-fast-text: #2b5407;
	--color-tier-mid-bg: #f2ddb0;
	--color-tier-mid-text: #6b3d07;
	--color-tier-slow-bg: #f3cfcf;
	--color-tier-slow-text: #7a1c1c;

	/* Territory-editor "on map" presence indicator (tree/legend swatch ring). A
	   data highlight (not chrome), deliberately identical in both themes. */
	--color-map-presence: #6a7f3a;

	/* Der Außendurchmesser des grünen Statuskreises. 💣 Er steht als Token da, weil es DREI
	   Zeichner gibt und zwei davon nebeneinander im selben Fenster sichtbar sind: die geteilte
	   Listenregel (css/components/map-status-circle.css) und das Abzeichen `.cov` des
	   Territorienbaums (html/wiki-sync-settlement-editor.html, html/wiki-sync-monitor.html).
	   Am 18.08.2026 zeigte der Ortseditor 12px links und 11px in der Mitte -- dieselbe Aussage in
	   zwei Größen, in einem Blick. `.cov` bringt sein eigenes Markup mit (`.all`/`.own-only`/
	   `.children-only` statt der `tree-map-status--*`), deshalb bleibt es eine eigene Regel; die
	   GRÖSSE darf nicht zweimal geraten werden. */
	--map-status-circle-size: 11px;

	/* Wegarten — die Farbe, in der die KARTE diese Wegart zeichnet (map-features.js, centerColors).
	   Sie machen die Art-Beschriftung in der Wegeliste zu einer Legende: man sieht dort, wie die
	   Linie draußen aussieht.
	   🔴 Es sind NICHT die Kartenwerte selbst. Die sind für eine LINIE auf heller Karte gewählt;
	   als SCHRIFT auf Pergament fielen sie durch — Wüstenpfad kam auf 2,23 Kontrast, die
	   Untergrenze für kleine Schrift ist 4,5. Diese Werte sind dieselben Farbtöne, so weit
	   abgedunkelt, dass 4,6 erreicht ist — gerechnet gegen den GEMESSENEN Grund der Editorseite
	   (#f3f0e8). 💣 Die erste Fassung rechnete gegen --color-panel-soft (#faf6ee) und landete bei
	   4,27 bis 4,38: knapp daneben ist hier unbrauchbar, und nur die Messung in der echten Seite
	   hat es gezeigt.
	   ⚠️ Reichsstraße, Straße und Weg haben KEIN Token. Ihre Kartenfarben sind Weiß, Grau und
	   Hellwarm — als Text wären das keine Farben, sondern Rauschen. Sie tragen die kräftige bzw.
	   die gedämpfte Schriftfarbe.
	   ⚠️ Blau bei Fluss- und Seeweg ist die Regel, nicht die Ausnahme: docs/design-language.md
	   („No blue = UI chrome only") erlaubt es ausdrücklich, wo Farbe DATEN kodiert statt
	   Bedienoberfläche — wie schon bei den Wassertönen der Landschaften-Ebene. */
	--color-path-pfad: #86654e;
	--color-path-gebirgspass: #965d52;
	--color-path-wuestenpfad: #7b6a48;
	--color-path-flussweg: #3f7191;
	--color-path-seeweg: #296db9;
	--color-map-presence-text: #2f6b3a; /* darker text variant of the above, same pinning rule */

	/* Territory-assignment picker (parent-tree/tabs/breadcrumb "active" rows) —
	   translucent white overlays that sit ONLY on the --color-button solid fill,
	   never on a page surface. --color-button stays mid-dark in both themes, so
	   these are deliberately identical in both (no dark override needed). */
	--color-on-button-muted: rgba(255, 255, 255, 0.8);    /* secondary/meta text on the fill */
	--color-on-button-hairline: rgba(255, 255, 255, 0.25); /* faint divider/chip-bg on the fill */

	/* Interaction & focus (see "Button states" in the doc) */
	--color-focus: rgba(191, 160, 58, 0.45);      /* gold focus glow */
	--focus-ring: 0 0 0 3px var(--color-focus);   /* compose with the element's shadow, don't replace it */
	--color-hover-wash: rgba(191, 160, 58, 0.14); /* row / option hover */
	--color-active-wash: rgba(191, 160, 58, 0.24);/* selected row */

	/* ---- Chart series (categorical) -----------------------------------------------------------
	 * FOUR slots, assigned in fixed order, never cycled. Introduced 2026-08-02 for the way editor's
	 * „Funktionen anzeigen" window -- the first surface in this project that draws several data
	 * series at once.
	 *
	 * 💣 FOUR IS THE CEILING, AND IT IS A MEASURED ONE. These were not picked by eye: the palette
	 *    was run through an OKLab/ΔE validator with protanopia, deuteranopia and tritanopia
	 *    simulation against the real chart surfaces (--color-panel-soft, light and dark). Lightness
	 *    band, chroma floor, normal-vision separation (ΔE 18,1 light / 15,7 dark) and contrast all
	 *    pass. The red-green pair does NOT: ΔE 4,8 light and 1,0 dark against a target of 8.
	 *
	 * 🔴 That failure cannot be fixed with better hues, and it is the price of AGENTS.md §12's „no
	 *    blue". Red and green ARE the red-green confusion axis, and the one hue that separates
	 *    cleanly there is the forbidden one. Seven warm earth tones were tried first and scored
	 *    worse (ΔE 1,3) -- two of them indistinguishable even with full colour vision.
	 *
	 * ⭐ THEREFORE COLOUR NEVER CARRIES IDENTITY ALONE on these charts. Whoever uses these tokens
	 *    also ships a second encoding -- stroke pattern per series, plus small multiples so that
	 *    rarely more than four series share one picture. A fifth series is refused, never given an
	 *    invented fifth hue.
	 */
	--color-chart-1: #c9821c;  /* gold-orange */
	--color-chart-2: #a02a24;  /* brick red   */
	--color-chart-3: #2f7d3a;  /* leaf green  */
	--color-chart-4: #6b4a8f;  /* plum        */
	--color-check-accent: var(--color-accent-strong); /* checkbox/radio checked mark + border */
	--color-check-fill: var(--color-active-wash);      /* checkbox/radio checked fill */
	--color-disabled-bg: #ece7dd;
	--color-disabled-text: #a99f8e;
	--color-disabled-border: #dcd3c4;

	/* Scrollbars — thin, theme-aware track/thumb (Firefox scrollbar-color + WebKit
	   pseudo-elements), applied globally in base.css. */
	--color-scrollbar-thumb: rgba(141, 121, 98, 0.4);
	--color-scrollbar-thumb-hover: rgba(141, 121, 98, 0.6);
	--color-scrollbar-track: transparent;

	/* Spacing scale — value-named steps; use a token, never a stray px */
	/* Owner: alle Spacing-Vars global +2px (mehr Luft überall). Die Namen (2/4/6/…)
	   bleiben als Skala-Stufen; die WERTE tragen +2. App-weit + reversibel. */
	--space-2: 4px;
	--space-4: 6px;
	--space-6: 8px;
	--space-8: 10px;
	--space-10: 12px;
	--space-12: 14px;
	--space-16: 18px;
	--space-20: 22px;
	--space-24: 26px;

	/* Radius — 3 rungs; the old 4/6/7/9 fold to the nearest (controls → md) */
	--radius-sm: 5px;   /* mirrored panel shell + tiniest chips */
	--radius-md: 8px;   /* all controls: buttons, inputs, selects, pills, rows */
	--radius-lg: 10px;  /* menus, cards, autocomplete */

	/* Hüllenmaße der Editoren (Spec 2026-07-22-editor-designsprache §3.1a). Sie standen bis
	   2026-08-15 in css/components/editor-page.css und waren damit genau den Editor-SEITEN
	   vorbehalten. Der Vorkommeneditor ist aber der einzige der fünf, der KEIN iframe ist — er
	   lebt als Dialog in index.html und lädt editor-page.css nicht. Abschreiben wäre die
	   Wiederholung des Fehlers, den editor-page.css beendet hat (derselbe Wert an drei Stellen,
	   dreimal verschieden), also stehen sie hier: tokens.css laden BEIDE Welten. Der Name ist
	   die Stufe, nicht die Pixelzahl — --space-* trägt global +2px. */
	--avm-control-h: 32px;                              /* Suchfeld, Eingabe, Auswahl, Knopf */
	--avm-ribbon-pad: var(--space-8) var(--space-12);   /* 10 / 14 — Menüband */
	--avm-ribbon-gap: var(--space-4);                   /* 6 */
	--avm-status-pad: var(--space-4) var(--space-12);   /* 6 / 14 — Statuszeile */
	--avm-status-min-h: 30px;
	--avm-col-pad: var(--space-6) var(--space-10);      /* 8 / 12 — jede der drei Spalten */
	--avm-row-pad: var(--space-2) var(--space-4);       /* 4 / 6 — Listenzeile */
	--avm-field-label-w: 130px;                         /* Beschriftung links neben dem Feld */
	/* Die Feldzeile mit Wiki-Override (Entwurf 2026-08-17-wiki-override-fuer-alle-design.md §2.8):
	   Beschriftung · durchgestrichener Wiki-Stand + ↺ · Eingabefeld.
	   🔴 DAS EINGABEFELD BEKOMMT MINDESTENS DIE HAELFTE (Owner 17.08.2026), der Wiki-Stand weicht
	   als Erster -- deshalb steht hier ein Mindestmass fuer das FELD und ein Hoechstmass fuer den
	   Wiki-Stand, nicht umgekehrt.
	   💣 Die obere Schranke des clamp() ist tragend: ohne sie fordern die drei Spalten bei schmalem
	   Fenster mehr als 100 % an und das Raster haengt eine waagerechte Bildlaufleiste an -- bei
	   300px gemessen. Die 165px sind Beschriftung (130) + zwei Spaltenabstaende (12) + das ↺ samt
	   Vorabstand (18) + Rest; in der ersten Rechnung war das ↺ schlicht vergessen. */
	/* 🪤 HIER STANDEN ZWEI TOKEN -- eine Hoechstbreite fuer den Wiki-Stand und ein gerechneter
	   Mindestplatz fuers Feld (clamp mit 100% - 165px). Beide sind am 17.08.2026 gefallen, und die
	   Lehre ist groesser als die zwei Zeilen: die Rechnung loeste ein Problem, das die AUFTEILUNG
	   gar nicht erst hat. Der Owner hat es in einer Zeile gesagt -- „50% | 50%" --, nachdem zwei
	   gerechnete Fassungen an zwei Oberflaechen danebengegangen waren. Wer einen Mindestwert
	   ausrechnet, sollte zuerst fragen, ob eine Haelfte reicht. */
	/* Hoehe der Wiki-Zuweisungs-Trefferliste. 💣 Stand bis 16.08.2026 als nackte 340px an ZWEI
	   Stellen -- .label-wiki-picker-list (region-sync.css) und der abgeschriebenen .dt-picker-list
	   (editor-page.css) -- und ein Kommentar behauptete "dieselbe Hoehe". Das gilt genau bis jemand
	   eine der beiden aendert (AGENTS.md §12: erst das Token, dann benutzen). */
	--avm-picker-list-max-h: 340px;                     /* Trefferliste der Wiki-Zuweisung */

	/* Divider rhythm — symmetric space above & below a section line (on-scale) */
	--divider-gap: var(--space-12);       /* reading sections (infobox) */
	--divider-gap-tight: var(--space-6);  /* dense control groups (route planner) */

	/* Icon sizes — one scale for UI glyphs (sm/md) AND the existing colour
	   imagery (lg..hero: transport, type toggles, coats) so sizes stop drifting */
	--icon-sm: 16px;    /* dense inline glyph */
	--icon-md: 20px;    /* standard UI glyph */
	--icon-lg: 24px;    /* inline content icon — transport mode */
	--icon-xl: 46px;    /* map-display type toggle — fills the wider 350px route-planner cell */
	--icon-2xl: 48px;   /* infobox type icon (coat fallback) */
	--icon-hero: 130px; /* coat / logo hero */

	/* Die beiden Randlaschen -- „Routenplaner" links (#toggle-button, css/layout/map-layout.css) und
	   „Info" rechts (.avesmaps-infopanel__handle, css/features/infopanel.css). Sie sind seit jeher
	   gleich gebaut, standen aber mit denselben drei Zahlen in ZWEI Dateien; das ist die Divergenz
	   aus AGENTS.md §12, und am Telefon musste sie an beiden Enden zugleich wandern. */
	--avesmaps-tab-w: 30px;
	--avesmaps-tab-top: 30px;
	--avesmaps-tab-h: 140px;
	/* Der Kantenschatten der Telefon-Lasche: ein schmales dunkles Band an genau der Kante, unter der
	   sie hervorkommt -- ausdruecklich KEIN Verlauf ueber die volle Breite (Owner 12.08.2026, am
	   Entwurf entschieden: „nicht ueber die volle breite, sondern dass es so aussieht wenn die lasche
	   unter dem panel sitzt"). Als fertiges Bild und nicht als Farbe, weil erst die drei Stopps
	   zusammen die Aussage sind; einzeln waeren es drei Zahlen, die auseinanderlaufen koennen.
	   ⚠️ Derselbe Wert in hell und dunkel: er verdunkelt den Knopfgrund, statt eine eigene Farbe zu
	   setzen, und beide Knopfgruende sind warme Brauntoene. */
	--avesmaps-tab-edge-shade: linear-gradient(90deg, rgba(18, 15, 10, 0.36) 0, rgba(18, 15, 10, 0.17) 5px, rgba(18, 15, 10, 0) 13px);

	/* Der Abstand zum Kartenrand -- EINE Zahl fuer alles, was unten an der Karte klebt: der
	   Knopfbund („Neuigkeiten"/„Hinweise"), der Zoom darueber und die beiden Panels.
	   💣 Sie standen vorher als 12 gegen 14 nebeneinander, und man sah es: das Infopanel endete
	   2px ueber „Hinweise" (Owner 11.08.2026, am Zeiger gemessen 786 gegen 788). Zwei Zahlen, die
	   dasselbe meinen -- genau der Fall aus AGENTS.md §12. */
	--avesmaps-edge-gap: 12px;
	/* Die Panels leiten ihren unteren Rand DARAUS ab, statt ihn zu waehlen. Damit kann das
	   Infopanel gar nicht mehr neben dem Knopfbund enden, und wer den Kartenrand aendert, aendert
	   beide. Oben haben sie einen eigenen Wert -- dort steht nichts, mit dem sie fluchten muessten. */
	--avesmaps-panel-inset-top: 10px;
	--avesmaps-panel-inset-bottom: var(--avesmaps-edge-gap);
	/* Die Breite des Routenplaners (#search) -- und seit dem 12.08.2026 auch die des
	   Anzeige-Menues in der Kartenecke (Owner: „auf dem desktop etwa die breite des
	   routenplaners"). Bei dieser Breite stehen die sechs Ortsklassen nebeneinander, ohne sich zu
	   quetschen. Zwei Zahlen, die dasselbe meinen, laufen beim ersten Anfassen auseinander --
	   derselbe Fall wie --avesmaps-edge-gap darueber. */
	--avesmaps-planner-width: 350px;
	/* Eine Sprosse ueber --z-map-panel (1010): ein GEOEFFNETES Menue in der Kartenecke. Es
	   schwebt seit dem 12.08.2026 ueber der Karte und ueberlappt dabei die Routenplaner-Lasche,
	   die sonst darueber laege und ihm die erste Zeile abschneidet.
	   ⚠️ Nur fuer den offenen Zustand gedacht -- der Bund selbst bleibt auf --z-map-ui. */
	--z-map-menu: 1020;

	/* Elevation */
	--shadow-panel: 0 8px 24px rgba(0, 0, 0, 0.16);
	--shadow-dialog: 0 20px 45px rgba(0, 0, 0, 0.38);
	/* Button hover lift — warm brown drop, one step stronger for the filled main action. Matches the
	   route-planner buttons (which still inline these values; migrate them to these tokens later). */
	--shadow-button-hover: 0 4px 10px rgba(52, 41, 32, 0.14);
	--shadow-button-hover-strong: 0 5px 12px rgba(52, 41, 32, 0.22);

	--z-map-ui: 1000;
	/* Der Routenplaner liegt UEBER der uebrigen Kartenbedienung (Owner 11.08.2026: "der
	   routenplaner soll ueber den buttons auf der karte liegen"). Vorher trugen beide
	   --z-map-ui, und dann entscheidet die Reihenfolge im Markup -- der Knopfbund steht spaeter
	   und lag deshalb obenauf, mitten im Panelinhalt.
	   ⚠️ Unter dem Infopanel (1080) und dem Editorpanel (1100): die beiden decken den Planer
	   weiterhin zu, wenn sie aufgehen. */
	--z-map-panel: 1010;
	--z-dialog: 1450;
	--z-dialog-high: 1460;
	/* Editor overlays (the iframe tools: territory, settlement, adventure, citymap, wiki-sync).
	   Above --z-dialog-high so an editor overlay always clears the map context menu sitting there. */
	--z-editor-overlay: 1500;
	/* A dialog opened FROM an editor overlay ("Alle anzeigen") — must clear --z-editor-overlay. */
	--z-dialog-over-editor: 3000;
	/* Typeahead dropdowns. Must clear --z-editor-overlay: the source autocomplete opens from an
	   add-row that lives INSIDE the editor overlays. Also carries the route planner's jQuery-UI
	   menu (.ui-autocomplete), which must out-rank jquery-ui.css's .ui-front (z-index: 100). */
	--z-autocomplete: 1600;
	--z-modal: 5000; /* full-screen modal overlay — above --z-autocomplete */
}

/* ═══════════════════════════════════════════════════════════════════════════════════════════
   DIE IOS-SCHWELLE — der EINE Ort, an dem die Feldschrift fuer grobe Zeiger steht.
   💣 Unter 16px faehrt Safari beim Fokus in jedes Feld hinein und kehrt NICHT zurueck -- bei
   jeder einzelnen Eingabe. 16 ist eine Schwelle, kein Richtwert: 15,5px zoomt noch.
   🔴 NICHT ueber maximum-scale / user-scalable im Viewport-Meta loesen: das naehme allen das
   Aufziehen der Karte, und neuere iOS-Fassungen ignorieren es ohnehin.
   ⚠️ `pointer: coarse` meint den PRIMAEREN Zeiger -- ein Laptop mit Touchscreen und Maus meldet
   `fine` und bleibt unberuehrt.
   ═══════════════════════════════════════════════════════════════════════════════════════════ */
@media (pointer: coarse) {
	:root {
		--font-size-control: 16px;
	}
}

/* 💣 DER STEMPEL DIESER DATEI WIRD AUS DEM REPO GERECHNET, HOCHGELADEN WIRD NUR DER PUSH-DIFF.
   Am 11.08.2026 scheiterte der Deploy dieser Datei an einem roten Test -- hochgeladen wurde
   nichts. Der naechste, erfolgreiche Lauf trug ihren NEUEN Inhaltsstempel ins HTML, ohne sie
   selbst mitzunehmen: `tokens.css?v=903dace7de` lieferte zweieinhalb Stunden den ALTEN Inhalt,
   und jeder Browser hat genau den unter dieser Adresse gecacht. Ein spaeterer Voll-Deploy
   repariert das NICHT -- er laedt die richtige Datei unter dieselbe, laengst vergiftete Adresse.
   Heilung ist nur eine INHALTSAENDERUNG (neuer Hash = neue Adresse); dieser Absatz ist sie.
   ⚠️ Merkmal des Falls: der Server liefert mit Cache-Umgehung das Richtige, die Seite zeigt das
   Falsche, und das HTML ist NICHT veraltet (docs/asset-caching-and-versioning.md).

   Am Telefon laufen die PANELS von Kante zu Kante -- die Randlaschen NICHT.
   🔴 Das war am 11.08.2026 fuer wenige Stunden anders und ist zurueckgenommen: „von oben nach
   unten durchgehen" galt dem PANEL, nicht seinem Reiter (Owner, nach dem Ansehen: „das Tab sollte
   nicht veraendert werden, ich meinte dass das Panel selbst von oben nach unten gehen soll"). Eine
   Lasche ueber die volle Bildschirmhoehe ist ein 100-dvh-Balken neben der Karte.
   ⚠️ Seit dem 12.08.2026 ist die Lasche des Planers am Telefon KLEINER als am Zeiger (26x56 statt
   30x140, Werte unten) und sitzt mittig statt oben -- also das Gegenteil jener Aenderung, nicht sie
   noch einmal: der Owner hat den kleinen Pfeilgriff am Entwurf abgenommen, weil der beschriftete
   Balken am Telefon zu viel Karte verdeckt. `--avesmaps-tab-top` gilt dort deshalb nur noch der
   Info-Lasche (die im Frontend ohnehin weg ist, also praktisch nur dem Edit-Modus).
   💣 An `html.avesmaps-phone`, NICHT an einer Media-Query: „Telefon" ist in diesem Haus EINE
   Definition -- avesmapsIsPhoneViewport() (pointer: coarse UND Kurzseite <= 600px) setzt die Klasse,
   das CSS liest sie. Eine zweite Fassung als Breiten-Query traefe ein quer gehaltenes Telefon nicht
   und ein Tablet zu viel.
   ⚠️ Hier stehen nur die WERTE. Beide Laschen lesen sie in ihren eigenen Dateien -- eine Regel, die
   von hier aus auf `#toggle-button` und `.avesmaps-infopanel__handle` zielte, waere ein dritter Ort,
   an dem ihre Maße stehen. */
html.avesmaps-phone {
	/* Die Panels laufen von Kante zu Kante (Owner 11.08.2026: „im mobile full
	   height"). Nur SIE -- --avesmaps-edge-gap bleibt bei 12px, sonst klebte der Knopfbund am
	   Bildschirmrand. Deshalb hat der Panel-Rand einen eigenen Token, statt der Kartenrand-Zahl
	   direkt zu folgen: am Zeiger ist er von ihr abgeleitet, am Telefon faellt er weg. */
	--avesmaps-panel-inset-top: 0px;
	--avesmaps-panel-inset-bottom: 0px;

	/* Die Randlasche ist am Telefon ein kleiner Pfeilgriff statt eines beschrifteten Balkens (Owner
	   12.08.2026, am Entwurf abgenommen). Nur die MASSE stehen hier; die Form -- Pfeil statt Wort,
	   mittig statt oben, Kantenschatten -- steht bei der Lasche selbst in css/layout/map-layout.css.
	   ⚠️ Beide Laschen lesen die Werte. Im Frontend ist die Info-Lasche am Telefon ohnehin weg
	   (css/features/infopanel.css); im Edit-Modus bleibt sie und traegt ihr Wort auch in der
	   kleineren Form -- „Info" misst gemessene 24px und passt in die 56. */
	--avesmaps-tab-w: 26px;
	--avesmaps-tab-h: 56px;
}

/* Dark theme — opt-in (set data-theme="dark" on :root). Same warm family,
   deep parchment-brown canvas, cream text; the gold is lightly desaturated
   (~12% less than the light gold) so it stays calm on dark instead of shouting. */
:root[data-theme="dark"] {
	--color-page-bg: #211f19;
	--color-page-bg-deep: #181611;
	--color-panel: #312e26;
	--color-panel-soft: #37342b;
	--color-panel-muted: #39352b;
	/* Lighter than the panel here -- the same "pressed" reading, mirrored for dark. */
	--color-panel-active: #4c4636;

	--color-text: #eee7da;
	--color-text-strong: #f5f0e4;
	--color-text-muted: #b4a895;
	--color-placeholder: #7b7467;

	--color-border: #514a3c;
	--color-border-strong: #615a49;
	--color-divider: rgba(207, 197, 171, 0.24);

	--color-button: #6b6456;
	--color-button-border: #7a7361;
	--color-button-text: #f5ebd7;
	/* Hover geht hier DUNKLER, anders als im hellen Thema. Auf dunklem Grund steht
	   cremefarbene Schrift auf dem Knopf: ein hellerer Hover senkt den Kontrast, statt
	   ihn zu heben. Der alte Wert #797264 lag bei 4,03:1 gegen --color-button-text und
	   damit unter WCAG AA (4,5) -- sichtbar an jeder Sync-Kachel. Jetzt 6,05:1.
	   Die 1px-Anhebung und der staerkere Schatten tragen das Hover-Signal. */
	--color-button-hover: #5e5749;
	/* Muss mitwandern: der bisherige Wert #5d5648 lag praktisch auf dem neuen Hover
	   und waere nicht mehr davon zu unterscheiden gewesen. Jetzt 7,46:1. */
	--color-button-active: #4f4a3d;

	--color-button-soft: #3a362c;
	--color-button-soft-text: #eae1cf;
	--color-button-soft-border: #585142;
	--color-button-soft-hover: #453f32;
	--color-button-soft-active: #4e4739;

	--color-accent: #cfb767;
	--color-accent-strong: #dcc77e;
	/* Wegarten im dunklen Thema — dieselben Farbtöne, für den dunklen Panelgrund aufgehellt.
	   Gemessen 4,7 bis 6,8 (die vorhandene gedämpfte Schrift liegt bei 5,3). */
	--color-path-pfad: #c79a78;
	--color-path-gebirgspass: #d99184;
	--color-path-wuestenpfad: #d8bd85;
	--color-path-flussweg: #7fc9f0;
	--color-path-seeweg: #5aa6e0;

	--color-link: #d7c38b;
	--color-link-hover: #e3d39f;

	--color-accent-brown: #c9a97e;
	--color-accent-brown-hover: #dcbe97;
	--color-accent-brown-soft: #a3835c;
	--color-accent-brown-text: #241d14;
	--color-accent-brown-focus: rgba(201, 169, 126, 0.25);

	--color-pill: #3b3522;
	--color-pill-border: #5c5237;
	--color-pill-text: #e7d7a5;

	--color-danger: #d27566;
	--color-success: #7cc48a;
	--color-success-halo: rgba(124, 196, 138, 0.22);
	--color-muted-halo: rgba(180, 168, 149, 0.20);
	--color-success-soft: #2c3a24;
	--color-success-soft-border: #4d6b3a;
	--color-success-soft-text: #9cd39a;
	--color-danger-soft: #3f2a26;
	--color-danger-soft-border: #6b463f;
	--color-danger-soft-text: #e29c8f;
	--color-warning: #e0b45c;
	--color-warning-soft: #3b3122;
	--color-warning-soft-border: #6d5629;
	--color-warning-soft-text: #e9c684;
	--color-warning-strong: #c79a3c;
	--color-warning-strong-text: #241d14;
	/* Link status, dark: the muted grey lifts so it stays legible on the deep panel. --color-status-online
	   needs no override -- it is var(--color-success), which is re-pointed just above. */
	--color-status-offline: #9a9184;
	/* No dark override for the waypoint marks (or the --color-marker-*-ring editor marks below) on
	   purpose -- the SAME mark appears on the always-light map tiles and on the dark panels; a
	   theme-shifted red would make the planner (or the editor) disagree with the map. */

	--color-panel-translucent: rgba(49, 46, 38, 0.96);

	/* Travel-speed tiers, dark — deep warm fills with a light tint of their own hue, so the
	   ampel stays readable as green/amber/red without lighting up the dialog. Measured on
	   --color-panel #312e26: text 6,5–7,4:1 (AA is 4,5) and all three fills sit ~1,5:1 over
	   the panel, the same modest lift the light theme has. */
	--color-tier-fast-bg: #3f5326;
	--color-tier-fast-text: #d3e9ac;
	--color-tier-mid-bg: #5d4720;
	--color-tier-mid-text: #f2dcab;
	--color-tier-slow-bg: #753831;
	--color-tier-slow-text: #f7d4ce;

	/* Review stars, dark: the gold stays warm; the empty track darkens so it doesn't glare on the
	   deep panel (a light beige track would read almost as bright as a filled star). */
	--color-star: #e6b850;
	--color-star-muted: #6f6552;
	--color-marker-active: #f0b429;

	--color-focus: rgba(207, 183, 103, 0.5);
	--color-hover-wash: rgba(207, 183, 103, 0.18);
	--color-active-wash: rgba(207, 183, 103, 0.30);

	/* Chart series, dark. NOT an automatic lightening of the light steps -- these were re-validated
	   against the dark chart surface (#37342b) as their own palette. The dark lightness band is
	   narrower (L 0,48-0,67 vs 0,43-0,77), and the first attempts sat above it. Same ceiling of
	   four, same obligation to a second encoding. */
	--color-chart-1: #b58c10;
	--color-chart-2: #c74a55;
	--color-chart-3: #2f9647;
	--color-chart-4: #8f5fc4;
	/* Checkbox/radio checked, dark: the gold read as muddy + too yellow (owner). Use a
	   markedly desaturated gold and a solid subtle fill instead of the translucent wash. */
	--color-check-accent: #aaa598;
	--color-check-fill: var(--color-panel-soft);
	--color-disabled-bg: #322f27;
	--color-disabled-text: #6e685c;
	--color-disabled-border: #433e33;

	/* Scrollbars, dark: same warm-brown family as --color-text-muted, lightened so the
	   thumb still shows up against the deep panel. */
	--color-scrollbar-thumb: rgba(180, 168, 149, 0.35);
	--color-scrollbar-thumb-hover: rgba(180, 168, 149, 0.55);

	--shadow-panel: 0 8px 24px rgba(0, 0, 0, 0.45);
	--shadow-dialog: 0 20px 45px rgba(0, 0, 0, 0.6);
	--shadow-button-hover: 0 4px 10px rgba(0, 0, 0, 0.38);
	--shadow-button-hover-strong: 0 5px 12px rgba(0, 0, 0, 0.5);
}

/* ===== css/components/editor-row.css ===== */
/* Die Listenzeile der Editoren — `.avm-row`. EINE Datei, weil sie an ZWEI Orten gebraucht wird.
 *
 * 💣 Sie stand bis 2026-08-15 in css/components/editor-page.css, und das laden nur die
 *    Editor-SEITEN in html/. Der Vorkommeneditor ist aber der einzige der sieben, der kein iframe
 *    ist — er lebt als Dialog in index.html. Seine Auswahlliste trug deshalb die PANEL-Zeile
 *    (`.wikisync-itemlist .tree-item`: flach, Trennlinie, keine Rundung), während die Listen der
 *    Nachbarfenster (Orte, Karten, Literatur, Kraftlinien, Landschaften, Wege) schwebende
 *    gerundete Zeilen zeigten. Owner 2026-08-15, nachdem er sie nebeneinander gesehen hat:
 *    „angleichen".
 *
 * 🔴 Abschreiben war keine Option. Genau daraus ist die Divergenz gewachsen, die die
 *    Vereinheitlichung vom 14.08.2026 beseitigt hat (sieben Zeilenformen, vier davon Abschriften
 *    voneinander). Die Regel steht deshalb weiterhin GENAU EINMAL — nur eben in einer Datei, die
 *    beide Welten erreichen: css/styles.css importiert sie für die App, editor-page.css für die
 *    sechs Editorseiten. Gewacht von js/pages/__tests__/editor-row-single-source.test.js.
 *
 * ⚠️ Hier stehen die ECHTEN Tokens, nicht die Kurznamen `--mut`/`--ok`/`--warn`. Die sind lokale
 *    Aliase aus editor-page.css und existieren in index.html nicht; eine ungültige `var()` macht
 *    `color` zu `inherit`, und die Meta-Zeile wäre im Fenster still nicht mehr gedämpft. Die
 *    Aliase zeigen ohnehin genau auf diese Tokens, für die Editorseiten ändert sich also nichts —
 *    und editor-page.css sagt selbst: „NEW rules should reach for the real token".
 */

/* ---- List rows (Spec §3.1a rule 2) ----------------------------------------------------------
 * The row FLOATS -- it does not run edge to edge with a divider. The transparent 1px border is
 * mandatory: it is always there and only changes colour on selection, otherwise the row jumps by
 * two pixels the moment it is picked.
 */
.avm-row {
	display: flex;
	align-items: center;
	gap: var(--space-6);
	padding: var(--avm-row-pad);
	border: 1px solid transparent;
	border-radius: var(--radius-md);
	cursor: pointer;
	/* ⚠️ Literatur- und Karteneditor rendern ihre Zeilen als <button> (Tastaturbedienung, die
	   nicht verlorengehen darf). Ohne diese fünf Zeilen bringt der Knopf Systemschrift, grauen
	   Grund, eigenen Rahmen und Zentrierung mit. Auf einem <div> sind sie wirkungslos — Wege- und
	   Landschaften-Editor merken davon nichts. */
	width: 100%;
	background: transparent;
	color: inherit;
	font: inherit;
	text-align: left;
}

.avm-row:hover { background: var(--color-hover-wash); }

.avm-row.is-selected {
	background: var(--color-active-wash);
	border-color: var(--color-accent);
}

.avm-row__text { flex: 1 1 auto; min-width: 0; }

.avm-row__l1 {
	display: flex;
	align-items: baseline;
	gap: var(--space-4);
}

.avm-row__name {
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	font-weight: var(--font-weight-bold);
}

.avm-row__kind {
	margin-left: auto;
	white-space: nowrap;
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

.avm-row__l2 {
	margin-top: 1px;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

.avm-row__l2.ok { color: var(--color-success); }
.avm-row__l2.warn { color: var(--color-warning); }

/* ===== css/components/map-status-circle.css ===== */
/* Der Statuskreis — der grüne Ring rechts neben einem Listennamen. EINE Datei, weil er an ZWEI
 * Orten gebraucht wird, genau wie die Listenzeile nebenan (css/components/editor-row.css).
 *
 * 💣 Er stand bis 2026-08-18 in css/components/region-sync.css, und die lädt nur index.html. Damit
 *    war er an die PANEL-Zeile gefesselt (`.wikisync-itemlist .tree-item`), während die
 *    Editorfenster ihre eigene Zeile tragen (`.avm-row`) und deshalb gar keinen Kreis haben
 *    konnten. Owner 18.08.2026, zur Kraftlinienliste im Editor: „kannst du die grünen kreise bzw.
 *    die kraftliniendarstellung auf die liste im kraftlinieneditor übertragen?"
 *
 * 🔴 Abgeschrieben wurde NICHTS. Es gibt weiterhin genau EINE Rezeptur; sie nennt jetzt drei
 *    Wirte statt zwei. Eine zweite Fassung im Editor-Stylesheet wäre exakt die Divergenz, die die
 *    Vereinheitlichung vom 14.08.2026 beseitigt hat (sieben Zeilenformen, vier davon Abschriften).
 *    Eingebunden von css/styles.css (die App) und css/components/editor-page.css (die sechs
 *    Editorseiten) — dieselbe Verdrahtung wie editor-row.css.
 *
 * ⚠️ Hier stehen die ECHTEN Tokens, nie die Kurznamen `--mut`/`--ok`/`--warn`: die sind lokale
 *    Aliase der Editorseiten und existieren in index.html nicht.
 *
 * Bedeutung (aus settlementStatusMarker, js/review/review-settlement-list.js — die FORM muss
 * überall dasselbe heißen): voll = fertig · halb = da, aber nicht verbunden · leer = nicht auf der
 * Karte.
 * ⚠️ WORAN „fertig" gemessen wird, entscheidet die Objektart, nicht diese Datei — und es sind seit
 * 18.08.2026 DREI Regeln: die Wiki-Zuweisung (Ort, Landschaft), `every` über eine Namensgruppe aus
 * Segmenten (Weg, Kraftlinie) und `some` über zugeordnete ORTE (Literatur, Karte). Die Begründung
 * steht je an ihrer Codestelle; hier steht nur, wie der Kreis aussieht.
 */

/* 🔴 Er hängt an .has-map-status, NICHT an der Zeile. Eine Liste bekommt ihn erst, wenn sie die
   Klasse ausdrücklich setzt — sonst erbte jede neue Liste ihn in dem Moment, in dem sie dieselbe
   Zeile trägt. Im ersten Entwurf des Mockups ist genau das passiert, und gesehen hat es der
   Owner, nicht das Werkzeug.
   🪤 Hier stand bis 18.08.2026, Literatur und Karten hätten „kein liegt auf der Karte" und ihr
   fehlender Kreis sei Information. Der Owner hat das an diesem Tag entschieden: sie bekommen
   einen, und er misst dort etwas anderes (siehe Bedeutung oben). Nur die Vorkommen bleiben ohne.
   ⚠️ Ausdrücklich gesetzt statt aus den Daten abgeleitet: ein `:has(.tree-map-status)` würde den
   Kreis dort lautlos entfernen, wo eine Liste ihn (noch) ungefüllt tragen soll. */
.wikisync-itemlist .tree-item.has-map-status .tree-item-name::after,
#wiki-sync-territory-tree .tree-item.has-map-status .tree-item-name::after,
.avm-row.has-map-status .tree-map-status {
	display: inline-block;
	/* 11px statt 13px: neben einem 13px-Namen war der alte Kreis höher als dessen Versalhöhe und
	   zog die Zeile auf. 🔧 Abgeleitet, nicht vom Owner beschlossen.
	   ⚠️ Als Token, weil `.cov` (der Territorienbaum) denselben Kreis in eigenem Markup zeichnet
	   und im Ortseditor direkt daneben steht. */
	width: var(--map-status-circle-size);
	height: var(--map-status-circle-size);
	border: 2px solid var(--color-map-presence);
	border-radius: 50%;
	background: var(--color-panel);
	box-sizing: border-box;
}
/* 💣 DER DRITTE WIRT ZEICHNET AUF DEM MARKER-ELEMENT, die beiden anderen auf `::after` des Namens
   — und das ist keine Geschmacksfrage, sondern die Reparatur einer gemessenen Grenze.
   `.avm-row__name` trägt `overflow: hidden` + `text-overflow: ellipsis` (editor-row.css), die
   Panel-Zeile `.tree-item-name` nicht. Als `::after` war der Kreis die letzte Inline-Box IN dieser
   Zelle und verschwand mit den Auslassungspunkten. Bis zum 18.08.2026 stand hier nur die Warnung,
   das sei „für die Kraftlinienliste unerreichbar" — bei den fünf Listen, die am selben Tag
   dazukamen, ist es erreicht: die Titel der Kartensammlung sind im Median 42 Zeichen lang, im p90
   60 (529 Karten, live gemessen), die Spalte ist rund ein Drittel des Fensters. Über die Hälfte
   der Karten hätte ihren Kreis nie gezeigt.
   🔴 Es bleibt EINE Rezeptur: Fläche, Rahmen und alle drei Füllungen stehen genau einmal und
   nennen nur einen Wirt mehr. Der Marker ist im `.avm-row__l1`-Flex ein eigenes Kind, also
   unbeschnitten — und der `gap: var(--space-4)` dieser Zeile liefert bereits genau die 6px, die
   die beiden anderen Wirte sich als `margin-left` nehmen müssen. */
.wikisync-itemlist .tree-item.has-map-status .tree-item-name::after,
#wiki-sync-territory-tree .tree-item.has-map-status .tree-item-name::after {
	/* Nur die Pseudo-Elemente brauchen `content`; ein echtes Element wird davon zum Replaced
	   Element und das ist hier nirgends gewollt. */
	content: "";
	margin-left: 6px;
	vertical-align: -2px;
}
/* ⚠️ Im Flex bleibt er stehen, auch wenn der Name daneben schrumpft — sonst wäre die Ellipse nur
   an eine andere Stelle gewandert. */
.avm-row.has-map-status .tree-map-status { flex: 0 0 auto; }

/* Nur Territorien kennt diesen Zustand: die Kinder liegen auf der Karte, das Gebiet selbst nicht.
   Die Füllung läuft deshalb andersherum als bei --own-only. */
.wikisync-itemlist .tree-item.has-map-status:has(.tree-map-status--children-only) .tree-item-name::after,
#wiki-sync-territory-tree .tree-item.has-map-status:has(.tree-map-status--children-only) .tree-item-name::after,
.avm-row.has-map-status .tree-map-status--children-only {
	background: linear-gradient(to right, var(--color-map-presence) 0 50%, var(--color-panel) 50% 100%);
}
.wikisync-itemlist .tree-item.has-map-status:has(.tree-map-status--own-only) .tree-item-name::after,
#wiki-sync-territory-tree .tree-item.has-map-status:has(.tree-map-status--own-only) .tree-item-name::after,
.avm-row.has-map-status .tree-map-status--own-only {
	background: linear-gradient(to right, var(--color-panel) 0 50%, var(--color-map-presence) 50% 100%);
}
.wikisync-itemlist .tree-item.has-map-status:has(.tree-map-status--all) .tree-item-name::after,
#wiki-sync-territory-tree .tree-item.has-map-status:has(.tree-map-status--all) .tree-item-name::after,
.avm-row.has-map-status .tree-map-status--all {
	background: var(--color-map-presence);
}

/* Der Status-Marker selbst ist unsichtbar; er steuert nur die Kreis-Füllung.
   ⚠️ Gebunden an die drei Wirte, nicht global: im Territorien-EDITOR ist `.tree-map-status` ein
   SICHTBARES Abzeichen (css/pages/political-territory-wiki-tree.css) — ein `display: none` ohne
   Wirt löschte es dort.
   🔴 In `.avm-row` gilt es nur OHNE `has-map-status`: dort IST der Marker seit 18.08.2026 der
   Kreis (siehe oben). Eine Zeile ohne die Klasse hält ihn weiterhin unsichtbar, damit eine Liste
   ihn mitführen kann, bevor sie den Kreis zeigen soll. */
.wikisync-itemlist .tree-map-status,
#wiki-sync-territory-tree .tree-map-status,
.avm-row:not(.has-map-status) .tree-map-status {
	display: none;
}

/* ===== css/components/editor-page.css ===== */
/* Editor-SEITEN-Stylesheet — gemeinsame Hüllenmaße der Editor-iframes.
 *
 * 💣 NICHT verwechseln mit css/components/editor-shell.css. Die beiden klingen gleich und sind es
 *    nicht:
 *      editor-shell.css  → kommt über css/styles.css (@import) in die APP-Hülle (index.html) und
 *                          stylt das äußere Overlay-Fenster: Rahmen, Titelzeile, ✕.
 *      editor-page.css   → DIESE Datei, verlinkt von den Editor-SEITEN in html/, also von dem, was
 *                          IM iframe läuft.
 *    Spec §4.6 verlangte einmal, den gemeinsamen Block „in editor-shell.css" zu legen, „das jede
 *    Editor-Seite ohnehin bindet". Keine tut das. Deshalb gibt es diese Datei.
 *
 * Warum überhaupt: die Editor-iframes binden css/base/tokens.css, aber NICHT css/base/base.css.
 * Alles, was dort global steht, erreicht sie nie — jede Editorseite müsste es kopieren, und genau
 * das ist passiert. Am 2026-07-22 standen die Hüllenmaße dreimal abgeschrieben da und waren
 * dreimal verschieden (15 gemessene Abweichungen, Spec §3.1a). Werte, die an drei Stellen stehen,
 * laufen auseinander — nicht vielleicht, sondern verlässlich.
 *
 * Ergänzt tokens.css, ersetzt es nicht: hier stehen nur EDITOR-Maße. Farben, Schriftgrade und die
 * Abstandsskala bleiben in css/base/tokens.css. Ein Wert ohne Token? Erst das Token, dann benutzen
 * (AGENTS.md §12).
 */

/* 💣 Die --avm-*-Hüllenmaße stehen seit 2026-08-15 NICHT mehr hier, sondern in
   css/base/tokens.css. Grund: der Vorkommeneditor ist der einzige der fünf, der kein iframe ist
   -- er lebt als Dialog in index.html und lädt diese Datei nicht, wohl aber tokens.css. Hier
   erneut zu deklarieren hiesse, denselben Wert an zwei Stellen zu führen; genau das hat diese
   Datei einmal beendet. Jede Editorseite bindet tokens.css ohnehin, also ändert sich für sie
   nichts. Die Regeln unten (Bildlaufleisten, .type-filter, Menüband, Spalten) bleiben
   editor-SEITEN-Sache. */

/* 💣 Die Listenzeile .avm-row hat dieselbe Reise gemacht und wird von hier IMPORTIERT — sie steht
   in css/components/editor-row.css, das auch css/styles.css lädt, weil der Vorkommeneditor als
   Dialog in index.html lebt und diese Datei nie sieht. Ein @import muss VOR jeder Regel stehen
   (nur Kommentare dürfen davor), deshalb sitzt er hier oben und nicht unten bei den Zeilenregeln.
   Die sechs Editorseiten merken nichts: sie binden editor-page.css und bekommen die Zeile mit. */


/* 💣 Und der Statuskreis daneben -- dieselbe Bauform, derselbe Grund. Er stand bis 2026-08-18 in
   css/components/region-sync.css, und die laedt nur index.html; eine Editorliste konnte deshalb
   gar keinen Kreis haben. Auch dieser @import muss VOR jeder Regel stehen. */


/* Bildlaufleisten. Stand bis 2026-07-22 dreimal kopiert in den Editorseiten (zwei davon auf 7px,
   eine auf 10px). Bewusst NICHT der 7px-Wert aus css/base/base.css: die Editoren sind
   Arbeitsflächen mit vielen Scrollbereichen, die App ringsum ist es nicht. Die WebKit-
   Pseudoelemente vererben nicht, daher `*` statt `:root`. */
* {
	scrollbar-width: thin;
	scrollbar-color: var(--color-scrollbar-thumb) var(--color-scrollbar-track);
}
*::-webkit-scrollbar {
	width: 10px;
	height: 10px;
}
*::-webkit-scrollbar-track {
	background: var(--color-scrollbar-track);
}
*::-webkit-scrollbar-thumb {
	background: var(--color-scrollbar-thumb);
	border-radius: 999px;
	border: 2px solid var(--color-scrollbar-track);
}
*::-webkit-scrollbar-thumb:hover {
	background: var(--color-scrollbar-thumb-hover);
}

/* ---- Filter-Aufklappmenü (Spec §4.4) --------------------------------------------------------
 * „Alle Filter eines Editors gehören in EIN Aufklappmenü." Stand bis 2026-07-23 nur im
 * Siedlungseditor, dort lokal und mit harten Werten (8px/10px/12px/11px/4px/8px, font-weight:600,
 * ein handgeschriebener Schatten). Der Abenteuer-Editor hatte stattdessen sieben Felder dauerhaft
 * offen in der Listenspalte — der auffälligste Block-Unterschied der beiden Editoren.
 * Beim Umzug auf die Leiter gezogen: Bedienhöhe, --font-size-*, --radius-*, --shadow-panel,
 * font-weight 600 → 700 (§4.1 kennt nur 400 und 700).
 */
.type-filter {
	position: relative;
	flex: 0 0 auto;
	display: flex;
}
.type-filter__toggle {
	min-height: var(--avm-control-h);
	padding: 0 var(--space-8);
	font: inherit;
	font-size: var(--font-size-body);
	white-space: nowrap;
	cursor: pointer;
	color: var(--color-button-soft-text);
	background: var(--color-button-soft);
	border: 1px solid var(--color-button-soft-border);
	border-radius: var(--radius-md);
}
.type-filter__toggle:hover {
	background: var(--color-button-soft-hover);
}
/* Aktiv = mindestens ein Filter greift. Ohne diese Rückmeldung versteckt das Aufklappmenü, dass die
   Liste gefiltert ist — „warum sehe ich nur drei Einträge" wird dann zur Suche nach einem Bug. */
.type-filter__toggle.is-active {
	background: var(--color-button);
	border-color: var(--color-button-border);
	color: var(--color-button-text);
}
.type-filter__menu {
	position: absolute;
	right: 0;
	top: calc(100% + var(--space-2));
	z-index: 30;
	min-width: 170px;
	max-height: 320px;
	overflow-y: auto;
	padding: var(--space-4);
	background: var(--color-panel);
	border: 1px solid var(--color-border-strong);
	border-radius: var(--radius-md);
	box-shadow: var(--shadow-panel);
}
.type-filter__menu[hidden] { display: none; }
.type-filter__opt {
	display: flex;
	align-items: center;
	gap: var(--space-4);
	padding: var(--space-2) var(--space-4);
	font-size: var(--font-size-small);
	color: var(--color-text);
	cursor: pointer;
	border-radius: var(--radius-sm);
}
.type-filter__opt:hover { background: var(--color-hover-wash); }
.type-filter__label { flex: 1 1 auto; min-width: 0; }
.type-filter__count { color: var(--color-text-muted); font-size: var(--font-size-caption); }
.type-filter__section-title {
	padding: var(--space-2) var(--space-4) 2px;
	font-size: var(--font-size-caption);
	font-weight: var(--font-weight-bold);
	color: var(--color-text-muted);
}
.type-filter__section + .type-filter__section {
	margin-top: var(--space-2);
	padding-top: 2px;
	border-top: 1px solid var(--color-divider);
}
/* Unterabschnitt: gehoert zum Abschnitt DARUEBER, statt neben ihm zu stehen ("Lage" gilt nur
   fuer Bauwerke und haengt am Typ). Eingerueckt und OHNE den Trennstrich, der sonst zwei
   gleichrangige Abschnitte scheidet -- der Strich hoebe die Zugehoerigkeit gerade auf.
   Spiegelbild der Regel in css/features/review-panel.css: dieselbe Komponente, zwei Seiten. */
.type-filter__section--sub {
	margin-left: var(--space-4);
}
.type-filter__section + .type-filter__section--sub {
	border-top: 0;
	margin-top: 0;
}
/* Zahlenbereich im Trichter (BF-Zeitraum), gespiegelt aus css/features/review-panel.css --
   dieselbe Komponente (js/ui/filter-menu.js) wird von den Editor-iframes UND dem Panel geladen,
   und jede Seite bringt ihre eigenen .type-filter__*-Regeln mit. Die zwei Felder stehen UNTER den
   Vorauswahlen „Alle / heute / Zeitraum"; Hineintippen schaltet die Vorauswahl selbst auf „Zeitraum". */
.type-filter__range {
	display: flex;
	align-items: center;
	gap: var(--space-2);
	padding: var(--space-2) var(--space-4);
}
.type-filter__rangefield {
	flex: 1 1 0;
	min-width: 0;
	width: 100%;
	height: var(--avm-control-h);
	padding: 0 var(--space-4);
	font: inherit;
	font-size: var(--font-size-small);
	color: var(--color-text);
	background: var(--color-input-bg, var(--soft, var(--color-panel)));
	border: 1px solid var(--color-border, var(--line));
	border-radius: var(--radius-md);
}
.type-filter__rangedash,
.type-filter__rangeunit {
	flex: 0 0 auto;
	font-size: var(--font-size-caption);
	color: var(--color-text-muted);
}

/* ═══════════════════════════════════════════════════════════════════════════════════════════════
 * THE SHARED EDITOR BODY — ribbon, status line, three columns, list rows, tabs, detail fields.
 *
 * 💣 MOVED HERE ON 2026-08-02, and the reason is the whole point of this file. Every rule below
 *    was written for the SEVENTH editor (css/pages/landschaften-editor.css) and lived there. The
 *    EIGHTH one (html/wege-editor.html) needs the same body -- and the moment it copies them,
 *    the same value exists twice and the file header's promise starts running backwards: „Werte,
 *    die an drei Stellen stehen, laufen auseinander -- nicht vielleicht, sondern verlässlich."
 *    The measurements were centralised on 2026-07-22 after fifteen of them had drifted; letting
 *    the RULES that consume them drift instead would only move the problem one layer up.
 *
 * ⭐ The split is: everything an editor body needs lives here, everything about ONE editor's
 *    subject stays on its page (`.eco-*` for landscapes, `.wp-*` for ways).
 *
 * The measured proof that this move changed nothing: the seventh editor was measured before and
 * after -- columns 466,66/466,67/466,66 px, five tiles at 269,59-269,61, and every one of the
 * fourteen hull measurements identical.
 * ═══════════════════════════════════════════════════════════════════════════════════════════ */

/* Local short aliases for the real tokens. They alias, they never redefine -- changing a value
   means changing the token, not this line.
   ⚠️ NEW rules should reach for the real token (`var(--color-panel)`), not the alias. The aliases
   exist because the seventh editor's body was written with them and they are load-bearing for its
   `.eco-*` rules; they are not an invitation to add a second vocabulary. */
:root {
	--bg: var(--color-page-bg);
	--panel: var(--color-panel);
	--soft: var(--color-panel-soft);
	--line: var(--color-border);
	--line2: var(--color-border-strong);
	--fg: var(--color-text-strong);
	--mut: var(--color-text-muted);
	--accent: var(--color-link);
	--warn: var(--color-warning);
	--bad: var(--color-danger);
	--ok: var(--color-success);
	--font-ui: "Faculty Glyphic", "Arial", sans-serif;
}

.avm-editor-body { box-sizing: border-box; }
.avm-editor-body * { box-sizing: border-box; }

body.avm-editor-body {
	margin: 0;
	height: 100vh;
	display: flex;
	flex-direction: column;
	font: var(--font-size-body)/var(--leading-normal) var(--font-ui);
	/* Spec §3.1d: the dark dialog ground is part of the language -- the bright framed scroll boxes
	   need it to read as boxes at all. An editor on --color-panel leaves them hanging in nothing. */
	background: var(--bg);
	color: var(--fg);
}

/* ---- Ribbon (Spec §3.3) ---------------------------------------------------------------------
 * All tiles EXACTLY the same width, full width of the dialog. grid-auto-columns, not flex --
 * same reason as the columns below.
 */
.avm-ribbon-bar {
	padding: var(--avm-ribbon-pad);
	background: var(--panel);
	border-bottom: 1px solid var(--line);
}

.avm-ribbon {
	display: grid;
	grid-auto-flow: column;
	grid-auto-columns: minmax(0, 1fr);
	gap: var(--avm-ribbon-gap);
	align-items: stretch;
}

/* 💣 `:where()` IS LOAD-BEARING HERE, and it cost a measurement to find out. On the seventh
   editor's own page this was a bare `button { … }` (specificity 0,0,1), so every `.avm-tile`,
   `.eco-partner` and `.eco-terr` rule (0,1,0) beat it. Scoping it as `.avm-editor-body button`
   raises it to 0,1,1 -- which then beats all of them: measured, the ribbon tiles collapsed from
   48px to 32px, lost their padding and wore the soft button colour instead of --primary. The
   `.eco-*` buttons broke the same way. `:where()` contributes ZERO specificity, so the selector
   is scoped to the class without changing who wins. Do not "simplify" it away. */
:where(.avm-editor-body) button {
	font: inherit;
	min-height: var(--avm-control-h);
	padding: 0 var(--space-8);
	cursor: pointer;
	color: var(--color-button-soft-text);
	background: var(--color-button-soft);
	border: 1px solid var(--color-button-soft-border);
	border-radius: var(--radius-md);
}

:where(.avm-editor-body) button:hover { background: var(--color-button-soft-hover); }
:where(.avm-editor-body) button:disabled { opacity: .5; cursor: default; }

/* Two-line tile: .t1 bold, .t2 muted (Spec §3.3). The second line is where a tile says what it
   knows -- state belongs IN the button, not next to it. */
.avm-tile {
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: flex-start;
	text-align: left;
	min-height: 48px;
	padding: var(--space-4) var(--space-8);
	gap: 1px;
	line-height: var(--leading-tight);
}

.avm-tile .t1 {
	max-width: 100%;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	font-size: var(--font-size-body);
	font-weight: var(--font-weight-bold);
}

.avm-tile .t2 {
	max-width: 100%;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
	font-size: var(--font-size-caption);
	color: var(--mut);
}

/* Only the sync tile carries an icon and --primary (owner decision, ribbon session 2026-07-17). */
.avm-tile--primary {
	background: var(--color-button);
	border-color: var(--color-button-border);
	color: var(--color-button-text);
}

.avm-tile--primary .t2 { color: var(--color-on-button-muted); }

/* 💣 --primary needs its OWN hover rule, and it MUST stand AFTER the general `button:hover`.
   Without it the general hover wins with its light ground while the text stays cream: light on
   light, unreadable. It is invisible without a contrast measurement -- it happened exactly this
   way when the pattern was built (Spec §3.3). */
.avm-tile--primary:hover { background: var(--color-button-hover); }

/* A tile that carries state needs a resting look for „on". Same filled treatment as --primary,
