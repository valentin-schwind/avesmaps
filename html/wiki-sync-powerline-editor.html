<script>
  /* Resolve light/dark exactly like the parent app (js/app/theme-toggle.js): an explicit saved
     choice wins, otherwise follow the OS scheme. Runs before the stylesheet paints so this overlay
     iframe never flashes the wrong theme. Same guard as html/wiki-sync-settlement-editor.html. */
  (function () {
    function isDark() {
      var s = null; try { s = localStorage.getItem("avesmaps-theme"); } catch (e) {}
      if (s === "dark") { return true; }
      if (s === "light") { return false; }
      return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
    function apply() {
      if (isDark()) { document.documentElement.setAttribute("data-theme", "dark"); }
      else { document.documentElement.removeAttribute("data-theme"); }
    }
    apply();
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) { mq.addEventListener("change", apply); }
      else if (mq.addListener) { mq.addListener(apply); }
    }
  })();
</script>

<style>

  :root { --bg:var(--color-page-bg); --panel:var(--color-panel); --soft:var(--color-panel-soft); --line:var(--color-border); --line2:var(--color-border-strong); --fg:var(--color-text-strong); --mut:var(--color-text-muted); --accent:var(--color-link); --warn:var(--color-warning); --bad:var(--color-danger); --ok:var(--color-success); --font-ui:"Faculty Glyphic","Arial",sans-serif; }

  body { margin:0; font:var(--font-size-body)/var(--leading-normal) var(--font-ui); background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { padding:var(--avm-ribbon-pad); background:var(--panel); border-bottom:1px solid var(--line); }

  .btn2 { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; text-align:left; min-height:48px; padding:var(--space-4) var(--space-8); gap:1px; line-height:var(--leading-tight); }
  .btn2 .t1 { font-size:var(--font-size-body); font-weight:var(--font-weight-bold); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn2 .t2 { font-size:var(--font-size-caption); color:var(--mut); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .btn2.primary .t2 { color:var(--color-on-button-muted); }

  #plStatus { padding:var(--avm-status-pad); min-height:var(--avm-status-min-h); color:var(--mut); background:var(--soft); border-bottom:1px solid var(--line); white-space:nowrap; display:flex; align-items:center; gap:var(--space-12); }
  #plStatusText { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Drei GLEICHE Spalten per GRID (Owner-Regel), nicht flex:1 1 0. Spaltenflaeche = dunkleres
     --color-page-bg (der Body-Grund), die Scroll-/Listenkaesten das hellere --color-panel -- genau
     wie im Siedlungseditor. */
  .cols { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); flex:1 1 auto; min-height:0; }
  .col { overflow:hidden; padding:var(--avm-col-pad); display:flex; flex-direction:column; min-height:0; min-width:0; }
  .col + .col { border-left:1px solid var(--line); }
  .listhead { font-size:var(--font-size-subhead); line-height:var(--leading-snug); font-weight:var(--font-weight-bold); margin:0 0 var(--space-6); color:var(--color-accent-strong); }
  .bar { display:flex; gap:var(--space-4); align-items:center; margin-bottom:var(--space-4); }
  input[type=search], input[type=text], input[type=url], textarea, select { font:inherit; color:var(--fg); background:var(--soft); border:1px solid var(--line); border-radius:var(--radius-md); }
  input[type=search] { height:var(--avm-control-h); padding:0 var(--space-6); flex:1; }
  .scrollbox { flex:1 1 auto; overflow:auto; min-height:0; background:var(--color-panel); border:1px solid var(--line); border-radius:6px; padding:4px; }

  /* 💣 Hier stand ein zweites .se-row, wortgleich abgeschrieben vom Ortseditor -- der Kommentar
     darueber lautete "Listenzeilen (Referenz .se-row)" und benannte die Abschrift damit selbst.
     Mitgekommen war font-size:10px, unter der 11px-Untergrenze (docs/design-language.md).
     Diese Seite laedt css/components/editor-page.css: die Zeile heisst .avm-row und steht dort.
     Entfernt am 14.08.2026, ersatzlos -- der Kraftlinien-Editor hatte keine eigenen Zusaetze.

  .se-empty { color:var(--mut); padding:8px; }
  .se-error { color:var(--bad); padding:8px; }

  /* 💣 Hier stand die ZWEITE Fassung der .dt-*-Regeln -- derselbe Fehler wie beim .se-row einen
     Kommentar weiter oben, nur stehengeblieben. Dieser <style>-Block laedt NACH
     css/components/editor-page.css und gewann damit bei gleicher Spezifitaet die Kaskade, und die

     kein Token kennt, .pl-hint margin-top:3px gegen 2px. Entfernt am 16.08.2026.
     Gemessen an der Eigenschaften-Spalte, vorher/nachher: Rasterzeile 76,88 -> 73,88px,
     .dt-check 28,98 -> 26,97px, Knopfzeile 12px -> 8px Abstand, Inhalt insgesamt 12,3px kuerzer.
     Gewacht von js/pages/__tests__/editor-row-single-source.test.js.

     ⚠️ NICHT alles war Abschrift. Was hier stehenbleibt, hat in editor-page.css KEIN
        Gegenstueck -- eine Zahl steht bewusst nicht dabei, die liest sich wie eine
        vollstaendige Liste (AGENTS.md, die Vier-Erzeuger-Falle). */
  .dt-grid.stack { grid-template-columns:1fr; }
  /* 💣 Die geteilte Datei kleidet input[type=text|url|number] und select ein, aber KEIN textarea.
     Ohne diese Zeile verloere die Beschreibung Breite und Polster. Die 4px/6px sind unveraendert,

  .dt-badge { font-size:var(--font-size-caption); color:var(--mut); border:1px solid var(--line2); border-radius:8px; padding:0 6px; white-space:nowrap; font-weight:normal; }
  .dt-badge.warn { color:var(--warn); border-color:var(--color-warning-soft-border); }

  /* Nodices-Spalte (Domänenbegriff für die Knotenpunkte einer Kraftlinie) */
  .pl-topo-note { font-size:11px; color:var(--mut); background:var(--color-panel-soft); border:1px solid var(--line); border-left:3px solid var(--color-accent); border-radius:6px; padding:6px 9px; margin-bottom:8px; }
  /* Die Breite der Kurven-Spalte -- EIN Wert, den Kantenliste und Verbindung teilen. Stuenden
     hier zwei Zahlen, liefen die zwei Ansichten beim ersten Nachjustieren auseinander. */

  .pl-end-label { font-size:var(--font-size-caption); color:var(--color-accent-strong); text-transform:uppercase; letter-spacing:.04em; margin:0 0 3px 2px; font-weight:bold; }
  .pl-node { display:flex; align-items:center; gap:7px; padding:6px 8px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:0 1px 2px rgba(0,0,0,.06); }

  .pl-node-flag { flex:0 0 auto; color:var(--warn); font-size:11px; }
  .pl-icon-btn { flex:0 0 auto; width:22px; height:22px; padding:0; display:grid; place-items:center; border:1px solid var(--line2); border-radius:6px; background:var(--soft); color:var(--mut); cursor:pointer; font-size:12px; min-height:0; }
  .pl-icon-btn:hover { background:var(--color-hover-wash); }
  .pl-icon-btn.del:hover { color:var(--bad); border-color:var(--bad); }

  /* 🔴 Die Verbindung zwischen zwei Nodices IST optisch das Segment und traegt seit dem
     29.08.2026 dessen Kurven-Schieber -- ein 2px-Strich konnte ihn nicht fassen. Der Strich

     ⚠️ Die Regel steht HIER und nicht in editor-page.css: dort stuende eine zweite mit

  .pl-conn { min-height:12px; margin:0 0 0 16px; border-left:2px solid var(--line2);
    /* ⚠️ 9px rechts = 8px Polsterung + 1px Rahmen der .pl-node darueber. Ohne sie sitzt der
       Schieber der Verbindung 9px weiter rechts als die Knoepfe der Nodix-Zeilen, und die

    padding-left:10px; padding-right:9px; display:flex; align-items:center; justify-content:flex-end; }
  .pl-reorder-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 8px; padding:6px 9px; background:var(--color-active-wash); border:1px solid var(--color-accent); border-radius:6px; }
  .pl-reorder-lead { font-size:11px; font-weight:bold; color:var(--color-accent-strong); margin-right:auto; }
  .pl-reorder-bar button { min-height:26px; padding:0 10px; font-size:12px; }
  /* 🔴 TABELLENFORM MIT FESTEN SPALTEN (Owner 29.08.2026). Mit Flex verschob jeder Name die
     Position aller folgenden Elemente -- bei „Kreuzung-4 — Nadoret" gegen „Kreuzung-4 — Festum"
     stand jeder Schieber woanders. Das Raster ist je Zeile DASSELBE, also stehen Schieber, Wert
     und Knoepfe untereinander.
     💣 Die zwei Namensspalten sind minmax(0,1fr) und NICHT auto: eine auto-Spalte waechst mit
     ihrem laengsten Inhalt, und genau das ist der Flattersatz, der hier weg soll. Die 0 als

  .pl-edge .a { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pl-edge .arw { color:var(--mut); flex:0 0 auto; }
  /* ⚠️ KEIN margin-left:auto mehr -- das war der Flex-Trick fuer „ganz rechts" und schoebe im

  .pl-add { margin-top:10px; }
  .pl-add-toggle { width:100%; text-align:center; border:1.5px dashed var(--line2); border-radius:6px; padding:8px; color:var(--mut); background:transparent; }

  .pl-results div.is-picked { background:var(--color-active-wash); }
</style>

<script>
"use strict";
(function () {

// ---- Small helpers ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const READ_API = "/api/edit/map/powerlines.php";
const MAP_FEATURES_EDIT_API = "/api/edit/map/features.php";
function esc(s) {
	return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function arraysEqual(a, b) {
	return a.length === b.length && a.every((value, index) => value === b[index]);
}
async function mapFeaturesEditPost(body) {
	const response = await fetch(MAP_FEATURES_EDIT_API, {
		method: "POST",
		credentials: "same-origin",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify(body),
	});
	let data = null;
	try { data = await response.json(); } catch (e) { /* non-JSON error body */ }
	if (!response.ok || (data && data.ok === false)) {
		const msg = (data && data.error && data.error.message) || (data && data.error) || ("HTTP " + response.status);
		throw new Error(msg);
	}
	return data || {};
}

// ---- State -----------------------------------------------------------------------------------
let segments = [];          // [{public_id,name,from_public_id,to_public_id,show_label,description,wiki_url,wiki_no_article,wiki_powerline,revision}]
let nodesMap = {};          // { public_id: {name,type,is_nodix} }
let candidates = [];        // [{public_id,name,type}]
let lines = [];             // grouped, see groupLines()
let selectedName = null;
let showDupesOnly = false;
let searchTerm = "";
let pendingSelectName = null;  // set by the host's "Bearbeiten" postMessage before data has loaded
let reorderDraft = null;       // strand node order the user is arranging (▲▼); null = the true stored order
let wikiArticles = [];      // [{name, wiki_url, wiki_key, staerke, affinitaet, laenge, regionen}]
let wikiAssign = null;      // Steuerung des geteilten Zuweisungs-Bauteils (js/ui/wiki-assign.js)
let dumpState = { has_run: false, completed_at: "", article_count: 0 };
// Gegenrichtung (Schritt 5): steht nur in der Antwort des Sync-Aufrufs und verfaellt sonst mit ihr --
// deshalb hier festgehalten, solange das Fenster offen ist. null = noch nie gefuellt (kein Sync seit
// dem Oeffnen gelaufen) -- dann zeigt der Abschnitt GAR NICHTS, keine 0, kein Platzhalter.
let lastUnmatchedNames = null;   // string[] | null
let lastClaimsUnresolved = null; // number | null

// nodeLookup for the shared pure topology helpers.
function nodeLookup(publicId) {
	const n = nodesMap[publicId];
	if (!n) { return null; }
	return { name: n.name, isCrossing: n.type === "crossing" };
}
// Der Anzeigetext EINES Knotens. Rein -- Knoten rein, Text raus, kein DOM, kein Modulzustand:
// nur so laesst sie sich ohne die Seite pruefen (js/pages/__tests__/kraftlinien-knoten-name.test.js).
//
// 🔴 DREI Faelle, nicht zwei. Bis zum 18.08.2026 gab es zwei, und der mittlere fehlte:
//   1. Knoten da und aktiv        -> sein Name.
//   2. Knoten da, aber deaktiviert -> Name + " (deaktiviert)". Der Endpunkt liefert ihn seit dem
//      18.08.2026 mit (Abschnitt 2 dort); vorher fiel er durch dessen `is_active = 1`-Filter und
//      landete in Fall 3 -- der Editor zeigte fuer sechs Knoten eine nackte UUID, einer davon auf
//      fuenf Linien. Reaktiviert wird nichts; der Editor SAGT nur, was los ist.
//   3. Knoten gar nicht da        -> die rohe Kennung. Sie bleibt als letzte Bremse: ein Knoten
//      kann wirklich geloescht sein, und dann ist die Kennung das Einzige, was wir haben.
// ⚠️ Der Zusatz haengt an `is_active === false`, nicht an `!is_active`: eine aeltere Antwort ohne
//    das Feld (undefined) darf keinen Knoten faelschlich als deaktiviert ausweisen.
function nodeAnzeigeName(node, publicId) {
	if (!node || !node.name) { return publicId || "?"; }
	return node.is_active === false ? node.name + " (deaktiviert)" : node.name;
}
// 🔴 Die EINZIGE Anzeigequelle fuer einen Knotennamen -- Ortsliste, Nodices-Spalte, Kantenliste,
// Auswahlfeld und Rueckfrage beim Entfernen gehen alle hier durch. Eine zweite Stelle waere die
// Bauform, in der die Kennzeichnung an vier von fuenf Oberflaechen steht.
function nodeName(publicId) {
	return nodeAnzeigeName(nodesMap[publicId], publicId);
}
function nodeIsCrossing(publicId) {
	const n = nodesMap[publicId];
	return !!(n && n.type === "crossing");
}

// ---- Grouping: segments -> lines -------------------------------------------------------------
// Two names count as near-duplicates when their normalized form (lowercased, punctuation and
// whitespace stripped) collides. That catches "Elementares Hexagramm" vs "Elementare Hexagramm"
// and "Elemntarlinie" only partially -- exact typo detection is a separate job; this flags the
// obvious collisions plus any name carrying a URL.
function normName(name) {
	return String(name || "").toLowerCase().replace(/https?:\/\/\S+/g, "").replace(/[^a-z0-9äöüß]/g, "");
}
function levenshtein(a, b) {
	const m = a.length, n = b.length;
	if (m === 0) { return n; }
	if (n === 0) { return m; }
	let prev = Array.from({ length: n + 1 }, (_, i) => i);
	for (let i = 1; i <= m; i++) {
		const cur = [i];
		for (let j = 1; j <= n; j++) {
			const cost = a[i - 1] === b[j - 1] ? 0 : 1;
			cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
		}
		prev = cur;

	return prev[n];
}
function groupLines() {
	const byName = new Map();
	segments.forEach((seg) => {
		const name = String(seg.name || "").trim();
		if (name === "") { return; }
		if (!byName.has(name)) { byName.set(name, []); }
		byName.get(name).push(seg);
	});
	const names = [...byName.keys()];
	// Near-duplicate: two DISTINCT names whose normalized forms are within edit distance 2 (and long
	// enough that the distance is meaningful). Catches "Elementares/Elementare Hexagramm" and
	// "Elemntarlinie/Elementarlinie"; the fix is a rename onto the canonical name (= merge).
	const nearDupe = new Set();
	const norms = names.map(normName);
	for (let i = 0; i < names.length; i++) {
		for (let j = i + 1; j < names.length; j++) {
			const a = norms[i], b = norms[j];
			if (a === "" || b === "" || Math.min(a.length, b.length) < 5) { continue; }
			const d = levenshtein(a, b);
			if (d >= 1 && d <= 2) { nearDupe.add(names[i]); nearDupe.add(names[j]); }
		}
	}
	lines = names.map((name) => {
		const segs = byName.get(name);
		const topo = avesmapsPowerlineTopology(segs, nodeLookup);
		const anchor = segs.map((s) => s.public_id).sort()[0];
		const warnings = [];
		if (/https?:\/\//i.test(name)) { warnings.push("URL im Namen — bereinigen"); }
		if (nearDupe.has(name)) { warnings.push("Beinahe-Dublette — zusammenführen?"); }
		return { name, segments: segs, topology: topo, anchor, warnings };
	}).sort((a, b) => a.name.localeCompare(b.name, "de"));
}
function lineByName(name) {
	return lines.find((l) => l.name === name) || null;
}
function shapeLabel(shape) {
	return shape === "ring" ? "Ring" : shape === "branched" ? "verzweigt" : "Strang";
}

	if (t.endpointIds.length === 2) { return nodeName(t.endpointIds[0]) + " ↔ " + nodeName(t.endpointIds[1]); }
	if (t.isRing) { return "geschlossen"; }
	if (t.endpointIds.length > 0) { return t.endpointIds.length + " Enden"; }
	return "";

	// 🔴 EIN Bauer, zwei Oberflaechen: derselbe Aufruf steht in js/review/review-powerline-list.js

function renderList() {

function fieldSample(line, key) {

// 💣 DREI Faelle, nicht zwei. Eine leere Vorschlagsliste sieht aus wie „es gibt keine Artikel",
// heisst aber fast immer „es wurde noch kein Dump geholt" (Entwurf §6) -- und der dritte Fall,
// „ein Dump ist gelaufen und hat trotzdem keine Kraftlinien abgelegt", ist genau der historische,
// an dem der Abgleich schon einmal gescheitert ist („Keine Kraftlinien im Zwischenspeicher").
// Solange nur has_run unterschieden wurde, bekam ausgerechnet der beruhigenden Satz „Der Abgleich
// folgt der Zuweisung …", waehrend darunter nichts zur Auswahl stand.
//
// ⚠️ Der mittlere Satz sagt, was MESSBAR ist (der Lauf hat nichts abgelegt) und was zu tun ist
// (Dump erneut holen) -- nicht, WARUM, denn das weiss diese Seite nicht.

// 💣 ZWEI der Zweige endeten bis zum 16.08.2026 auf "Eine Adresse von Hand einzufügen geht

// der Umstellung auf das geteilte Bauteil weggefallen (Entwurf §5: keine freien Adressen). Ein
// Hinweis, der zu einem Bedienelement schickt, das es nicht gibt, ist schlimmer als keiner.
// 🔴 Wer hier etwas ergaenzt, prueft zuerst, ob der Satz noch einen Weg beschreibt, den es gibt.
function wikiListHint() {
	// 🔴 "Kein abgeschlossener LAUF" heisst NICHT "keine Dump-Datei". Am 15.08.2026 stand hier
	// "Noch kein Dump geholt", waehrend die Datei laengst da war -- der Satz schickte zum falschen
	// Knopf. Was fehlt, ist das EINLESEN des Dumps in den Zwischenspeicher.
	if (dumpState.problem === "fehler") {
		return "Die Artikelliste konnte nicht geladen werden — das ist ein Fehler, kein fehlender Dump. Bis sie da ist, lässt sich nichts zuweisen: gewählt wird nur aus der Liste.";
	}
	if (!dumpState.has_run) {
		return "Kein abgeschlossener Dump-Lauf — die Dump-Datei kann da sein, eingelesen ist sie noch nicht. Deshalb keine Artikel zur Auswahl.";
	}
	// article_count kommt aus derselben Quelle wie die Liste; die Liste ist der Rueckfall, falls
	// ein aelterer Leseweg den Schluessel nicht mitschickt.
	const count = Number(dumpState.article_count ?? wikiArticles.length);

		const when = String(dumpState.completed_at || "").trim();
		return "Der Dump-Lauf" + (when ? " vom " + esc(when) : "")
			+ " hat keine Kraftlinien-Artikel abgelegt — deshalb ist die Liste leer."
			+ " Bitte „📥 Dump holen“ erneut laufen lassen; bis dahin lässt sich nichts zuweisen.";
	}

// Der Entwurfsstand der Kurven, bis „Speichern" gedrueckt wird: public_id -> Zahl, und darin
// stehen NUR die angefassten Segmente.
// 🔴 EINEN LINIEN-SCHIEBER GIBT ES NICHT MEHR (Owner 29.08.2026: „die kurvenform bei
// ‚eigenschaften' brauchen wir nicht mehr, wenn die segmente einzeln eingestellt werden koennen").
// Die Kurve ist damit ausschliesslich eine Eigenschaft des einzelnen Segments.
// ⚠️ Der Preis ist benannt und in Kauf genommen: eine Linie mit vielen Segmenten (Basiliuslinie:
// 16) wird Kante fuer Kante eingestellt, es gibt keinen Griff mehr fuer alle auf einmal.
// 💣 Die Regel „geschrieben wird nur, was jemand angefasst hat" bleibt und ist jetzt das EINZIGE,
// was zaehlt: der Server liest die Abwesenheit als „nicht geaendert" (avesmapsApplyPowerlineCurve).
// Ohne sie machte ein Speichern der Beschreibung jede Kurve platt.
let curveDraft = {};

// Der aktuelle Wert EINES Segments.
// 🔴 DIESE RANGFOLGE SPIEGELT DEN SERVER (avesmapsApplyPowerlineCurve): einzeln angefasst schlaegt
// „alle", und „alle" schlaegt den gespeicherten Stand. Laufen die zwei auseinander, zeigt der
// Editor etwas anderes an, als er speichert.
// 💣 Der mittlere Fall hat beim Bau gefehlt, und nur der Ablauf im Browser hat es gezeigt (alle
// Quelltext-Tests waren gruen): nach einem Zug am Linien-Schieber stand oben „-20 %", waehrend die
// vier Segment-Schieber weiter ihre alten Werte zeigten -- gespeichert haette der Server richtig,
// angezeigt war es falsch.
function curveOfSegment(seg) {
	const entwurf = curveDraft[seg.public_id];
	return Number(entwurf !== undefined ? entwurf : seg.curve) || 0;
}

// Das Segment zwischen zwei benachbarten Nodices einer Kette -- die Richtung ist dabei egal.
function segmentBetween(line, pidA, pidB) {
	return line.segments.find((seg) =>
		(seg.from_public_id === pidA && seg.to_public_id === pidB)
		|| (seg.from_public_id === pidB && seg.to_public_id === pidA)) || null;
}

// Der kleine Schieber an einer Kante bzw. an einer Verbindung.
function curveSegMarkup(seg) {
	if (!seg) { return ""; }
	const wert = curveOfSegment(seg);
	return '<span class="pl-curve-seg">'
		+ '<input type="range" min="-45" max="45" step="1" value="' + wert + '"'
		+ ' title="Kurvenform dieses Segments" aria-label="Kurvenform dieses Segments"'

// „+26 %" statt „26" -- eine nackte Zahl an einem Schieber sagt nicht, ob sie Prozent, Grad oder
// Meilen ist.
// 🔴 Die Kurven wandern LIVE auf die Karte, waehrend man zieht (Owner 29.08.2026: „die aenderungen

// nichts und muss raten -- der eigentliche Sinn des Reglers.
// 💣 EINE Stelle fuer alle Erzeuger (Kantenregler, Kartenregler-Rueckweg, Speichern), sonst zeigt

function meldeKurvenAnKarte(gespeichert) {
	if (!window.parent || window.parent === window) { return; }
	try {
		window.parent.postMessage({
			avesmapsPowerlineCurvePreview: Object.assign({}, curveDraft),

	} catch (e) { /* noop -- ohne Elternfenster gibt es schlicht keine Karte */ }

// ---- Die Wiki-Zuweisung: NUR der Datenweg -----------------------------------------------------
// Alles uebrige -- die drei Zustaende, die Suche samt Tastatur, die Trefferliste, die Entscheidung,
// ob ein Sync-Knopf erscheint -- macht js/ui/wiki-assign.js aus der Erklaerung "kraftlinie" im
// Feldregister (js/ui/wiki-assign-registry.js). Diese Seite steuert bei: die Kandidaten aus ihrem
// Leseweg, den heutigen Stand der Linie, und die Auskunft, ob ein Artikel schon an einer ANDEREN
// Linie haengt.
//
// 🔴 Geschrieben wird hier NICHTS. Der Speicherweg bleibt `update_powerline_line`, und saveLine()
// holt den Stand ueber `wikiAssign.lies()`. `zuweisen`/`loesen` sind deshalb keine Schreibaufrufe,
// sondern nur die Rueckmeldung "noch nicht gespeichert" -- sie sind die Stelle, an der eine
// Oberflaeche sofort schreiben WUERDE, und diese tut es bewusst nicht.
function wikiAssignBelegung() {
	// EXAKT, nicht geraten: dieser Editor haelt jede Linie samt ihrer Zuweisung im Speicher, ein
	// Vergleich der Adressen ist also eine Messung, keine Schaetzung. 💣 Die Suchen der uebrigen
	// Objektarten koennen das heute NICHT -- gemessen am 16.08.2026 liefert kein Suchendpunkt eine
	// Belegt-Angabe, auch die Label-Liste nicht (anders als Entwurf §5 annahm). Dort bleibt die
	// dritte Trefferzeile leer; eine erfundene Belegt-Anzeige, die manchmal stimmt, waere
	// schlimmer als keine.
	const belegt = new Map();
	lines.forEach((l) => {
		const url = fieldSample(l, "wiki_url");
		if (url !== "") { belegt.set(url, l.name); }
	});
	return belegt;
}
function wikiAssignZustand(line) {
	const belegt = wikiAssignBelegung();
	const kandidaten = wikiArticles.map((a) => ({
		name: a.name,
		wiki_url: a.wiki_url,
		wiki_key: a.wiki_key,
		// Dieselben Schluessel wie das Nest `properties.wiki_powerline` -- nur so zeigt ein frisch
		// gewaehlter Treffer dieselben Angaben wie derselbe Artikel nach dem naechsten Sync.
		werte: { staerke: a.staerke, affinitaet: a.affinitaet, laenge: a.laenge, regionen: a.regionen },
		haengtAn: (belegt.get(a.wiki_url) && belegt.get(a.wiki_url) !== line.name) ? belegt.get(a.wiki_url) : "",
	}));
	const wikiUrl = fieldSample(line, "wiki_url");
	// "some", nicht fieldSample: der Merker ist ein Wahrheitswert, fieldSample liefert das erste
	// nicht-leere Feld und verhielte sich bei false unvorhersehbar.
	const noArticle = line.segments.some((s) => s.wiki_no_article === true);
	const nest = line.segments.map((s) => s.wiki_powerline).find((w) => w && typeof w === "object") || {};
	const passend = wikiUrl === "" ? null : (kandidaten.find((k) => k.wiki_url === wikiUrl) || null);
	return {
		// 💣 Eine Adresse, die auf keinen gestagten Artikel zeigt, ist KEIN Fehler und keine verlorene
		// Zuweisung -- sie kann ein brandneuer Artikel sein, den der letzte Dump nicht kannte. Dann
		// steht die Adresse selbst als Artikelzeile da, statt zu verschwinden.
		artikel: wikiUrl === "" ? null : {
			name: passend ? passend.name : String(nest.name || ""),
			wiki_url: wikiUrl,
			wiki_key: passend ? passend.wiki_key : String(nest.wiki_key || ""),
			// Bei aufgeloester Zuweisung die Werte DES ARTIKELS, nicht das Nest: das Nest kann noch vom
			// frueheren Namenstreffer stammen und gehoert dann einem anderen Artikel.
			werte: passend ? passend.werte : nest,
		},
		keinArtikel: noArticle,
		listen: { wiki_articles: kandidaten },
	};
}
function wikiAssignUngespeichert() {
	setSaveMsg("Geändert – noch nicht gespeichert.", "");
}
// „Abbrechen" im Zuweisungskasten: die ungespeicherte Zuweisung verwerfen, das Formular daneben
// nicht anfassen.
// 🔴 HIER IST NICHTS ZURUECKZUNEHMEN, und das ist kein Versehen: `wikiAssignZuweisen`/`-Loesen`
// setzen nur diese Meldung, den Zuweisungsstand haelt das Bauteil selbst (`lies()` ist der einzige
// Rueckkanal). Das anschliessende `neuLaden()` des Bauteils liest `line` -- den GELADENEN Stand --
// und damit ist der Entwurf weg. Der Rueckruf steht trotzdem da: ohne ihn saehe der Klick wie ein
// Fehlschlag aus, weil die Speicherleiste weiter „Geändert" behauptete.
function wikiAssignVerwerfen() {
	setSaveMsg("Zuweisung verworfen.", "");
}
function mountWikiAssign(line) {
	if (wikiAssign) { wikiAssign.zerstoeren(); wikiAssign = null; }
	const host = $("plWikiAssign");
	if (!host) { return; }
	if (typeof avesmapsWikiAssignMount !== "function") {
		// Kein stiller Leerlauf: ohne das Bauteil gibt es GAR KEINE Zuweisung mehr, und ein leerer
		// Fleck saehe aus wie "diese Linie hat keine".
		host.innerHTML = '<div class="pl-hint">Wiki-Zuweisung nicht geladen (js/ui/wiki-assign.js).</div>';
		return;
	}
	// 💣 `mount` kann auch dann noch scheitern, wenn ES SELBST geladen ist -- naemlich wenn eine
	// seiner zwei Voraussetzungen fehlt (Feldregister, Diff-Rechnung). Genau dieser Fall ist NICHT
	// hypothetisch: ein Deploy-Fehlschlag vergiftet den ?v=-Stempel, und Dateien stehen live auf
	// 404, waehrend die Seite sie schon anfordert (AGENTS.md §9) -- seit heute haengen DREI neue
	// Skripte an diesem Fenster. Das Bauteil gibt dann einen erkennbaren Blindgaenger zurueck
	// (`bereit === false`, `lies()` liefert null), und saveLine() faellt darauf auf den GELADENEN
	// Stand zurueck statt auf Leerstrings. Ohne das Merkmal loeschte ein Klick auf „Speichern“ die
	// Zuweisung aller Segmente dieser Linie, ohne dass jemand einen Loeschbefehl gegeben haette.
	wikiAssign = avesmapsWikiAssignMount(host, {
		subject: "kraftlinie",
		skin: "dt",
		laden: () => wikiAssignZustand(line),
		zuweisen: wikiAssignUngespeichert,
		loesen: wikiAssignUngespeichert,
		verwerfen: wikiAssignVerwerfen,
		// `sync: false` in der Erklaerung -- es erscheint gar kein Sync-Knopf, also wird dieser
		// Rueckruf nie gerufen. Er steht hier, damit die Schnittstelle vollstaendig ablesbar ist.
		syncUebernehmen: () => {},
	});
}
function setSaveMsg(text, cls) {
	const el = $("plSaveMsg"); if (!el) { return; }
	// ⚠️ `avm-savebar__msg`, nicht mehr `dt-msg`: die Meldung sitzt seit 16.08.2026 IN der
	// Speicherleiste und traegt deren Schub nach rechts (flex: 1 1 auto). Mit der alten Klasse
	// verloere sie ihn, und die Knoepfe ruecken wieder nach links.
	el.textContent = text; el.className = "avm-savebar__msg" + (cls ? " " + cls : "");
}
async function saveLine() {
	const line = lineByName(selectedName);
	if (!line) { return; }
	const newName = $("plName").value.trim();
	if (newName === "") { setSaveMsg("Name darf nicht leer sein.", "bad"); return; }
	// ⚠️ Der Rueckfall ist der GELADENE Stand, nicht der leere: fiele er auf "", loeschte ein
	// Speichern bei nicht geladenem Bauteil die Zuweisung stumm -- die Fehlerklasse aus AGENTS.md
	// §10 ("eine stille Leerung ist von 'nie gespeichert' nicht zu unterscheiden").
	// 💣 GEPRUEFT WIRD `bereit`, NICHT das blosse Vorhandensein des Objekts. Ein Bauteil, dem eine
	// seiner Voraussetzungen fehlt, gibt einen Blindgaenger zurueck: der ist wahrheitswertig, und
	// `wikiAssign ? … : …` allein waere deshalb durchgelaufen und haette Leerstrings gespeichert.
	// `lies()` liefert dort null -- wer die Weiche vergisst, bekommt einen Fehler statt einer
	// stillen Loeschung.
	const gelesen = (wikiAssign && wikiAssign.bereit) ? wikiAssign.lies() : null;
	// ⚠️ Der Rueckfall traegt seit dem 16.08.2026 KEIN `kein_artikel` mehr -- er soll die Zuweisung
	// halten, nicht den Merker, und ein FEHLENDER Schluessel ist im Schreibweg die sichere Seite.
	const zuweisung = gelesen || { wiki_url: fieldSample(line, "wiki_url") };
	const rumpf = {
		action: "update_powerline_line",
		current_name: line.name,
		new_name: newName,
		show_label: $("plShowLabel").checked,
		description: $("plDescription").value,
		// Dieselbe Aktion wie immer; die Adresse kommt aus dem Bauteil statt aus einem Formularfeld.
		wiki_url: zuweisung.wiki_url,
	};
	// 🔴 DER MERKER REIST NUR NOCH BEI EINER AENDERUNG (16.08.2026). Bis dahin ging `wiki_no_article`
	// bedingungslos mit -- mit dem Haekchen war das richtig (der Wert kam ja von dort), ohne es waere
	// es ein stilles Loeschen: wer bloss die Beschreibung aendert, naehme sonst die Entscheidung des
	// Konfliktzentrums zurueck. `kein_artikel_geaendert` kann jetzt nur noch wahr werden, wenn
	// `trefferWaehlen` den Merker BEANTWORTET hat -- dann MUSS er mit, sonst stuende die Linie mit
	// Artikel UND Merker da und der Riegel lehnte jedes weitere Speichern ab.
	// 💣 DIE ANDERE HAELFTE STEHT IM SERVER: avesmapsUpdatePowerlineLine liest einen FEHLENDEN
	// Schluessel als „nicht geaendert" (vorher `?? false`). Ohne sie bewirkte diese Bedingung genau
	// das Gegenteil dessen, wofuer sie da ist -- die beiden Zeilen gehoeren zusammen.
	if (zuweisung.kein_artikel_geaendert === true) {
		rumpf.wiki_no_article = zuweisung.kein_artikel === true;
	}
	// 🔴 DIE KURVE REIST NUR MIT, WENN JEMAND SIE ANGEFASST HAT (Entwurf Abschnitt 13.1). Der Server
	// liest die Abwesenheit als „nicht geaendert" (avesmapsApplyPowerlineCurve); ginge sie
	// bedingungslos mit, machte JEDES Speichern -- auch eine reine Beschreibungsaenderung -- die
	// eingestellten Kurven platt.
	// 💣 Die andere Haelfte steht im Server (array_key_exists statt `?? 0`). Die zwei gehoeren
	// zusammen und duerfen nicht einzeln zurueckgedreht werden.
	// ⚠️ `curve` (der Griff fuer ALLE) wird von diesem Editor seit dem 29.08.2026 nicht mehr
	// geschickt -- den Schieber dafuer gibt es nicht mehr. Der Server kann es weiterhin, weil die
	// Vererbung an neue Segmente denselben Weg nimmt.
	if (Object.keys(curveDraft).length > 0) {
		rumpf.curves = curveDraft;
	}
	setSaveMsg("Speichert…", "");
	try {
		await mapFeaturesEditPost(rumpf);
		const merged = newName !== line.name && lines.some((l) => l.name === newName);
		// 🔴 ZUERST melden, DANN leeren: die Karte soll den gespeicherten Stand dauerhaft
		// uebernehmen, und nach dem Leeren waere nichts mehr zu melden.
		meldeKurvenAnKarte(true);
		// ⚠️ Erst NACH dem erfolgreichen Schreiben leeren: bei einem Fehlschlag bleibt der Entwurf
		// stehen, damit ein zweiter Versuch nicht bei null anfaengt.
		curveDraft = {};
		await reload(newName);
		setSaveMsg(merged ? "Gespeichert – mit „" + newName + "“ verschmolzen." : "Gespeichert – auf alle Segmente geschrieben.", "ok");
	} catch (e) {
		setSaveMsg(e.message || "Speichern fehlgeschlagen.", "bad");
	}
}
async function deleteLine() {
	const line = lineByName(selectedName);
	if (!line) { return; }
	if (!window.confirm('„' + line.name + '“ mit allen ' + line.segments.length + " Segmenten löschen?")) { return; }
	setSaveMsg("Löscht…", "");
	try {
		for (const seg of line.segments) {
			await mapFeaturesEditPost({ action: "delete_feature", public_id: seg.public_id });
		}
		selectedName = null;
		await reload(null);
	} catch (e) {
		setSaveMsg(e.message || "Löschen fehlgeschlagen.", "bad");
	}
}

// ---- Column 3: nodes -------------------------------------------------------------------------
function flyBtn(pid) {
	return '<button class="pl-icon-btn" title="Auf Karte zeigen" data-fly="' + esc(pid) + '">◎</button>';
}
function nodeBadge(pid) {
	return nodeIsCrossing(pid) ? '<span class="dt-badge warn">Kreuzung</span>' : '<span class="dt-badge">Nodix</span>';
}
function renderNodes() {
	const host = $("plNodes");
	const line = lineByName(selectedName);
	if (!line || !line.topology) { host.innerHTML = '<div class="dt-empty">Links eine Kraftlinie wählen.</div>'; return; }
	const t = line.topology;
	let html = "";
	if (t.shape === "strand") {
		const trueChain = avesmapsPowerlineOrderedChain(t) || [];
		const chain = (reorderDraft && reorderDraft.length === trueChain.length) ? reorderDraft : trueChain;
		const canReorder = chain.length >= 3;
		const dirty = !!reorderDraft && !arraysEqual(chain, trueChain);
		html += '<div class="pl-topo-note">Strang mit 2 Enden · Reihenfolge = Verlauf.' + (canReorder ? " ▲▼ sortiert um," : "") + ' ✕ entfernt einen Nodix (löscht seine Segmente); „+ Nodix hinzufügen" verlängert die Linie.</div>';
		if (dirty) {
			html += '<div class="pl-reorder-bar"><span class="pl-reorder-lead">Reihenfolge geändert</span>'
				+ '<button class="primary" id="plReorderSave">Speichern</button>'
				+ '<button id="plReorderReset">Zurücksetzen</button>'
				+ '<span class="dt-msg" id="plReorderMsg"></span></div>';
		}
		chain.forEach((pid, i) => {
			const isEnd = i === 0 || i === chain.length - 1;
			if (isEnd) { html += '<div class="pl-end-label">Ende</div>'; }
			html += '<div class="pl-node' + (isEnd ? " is-end" : "") + '">'
				+ '<span class="pl-node-name">' + esc(nodeName(pid)) + "</span>"
				+ nodeBadge(pid)
				+ (canReorder
					? '<button class="pl-icon-btn" title="Nach oben" data-move-up="' + i + '"' + (i === 0 ? " disabled" : "") + ">▲</button>"
						+ '<button class="pl-icon-btn" title="Nach unten" data-move-down="' + i + '"' + (i === chain.length - 1 ? " disabled" : "") + ">▼</button>"
					: "")
				+ flyBtn(pid)
				+ '<button class="pl-icon-btn del" title="Nodix entfernen" data-remove-node="' + esc(pid) + '">✕</button>'
				+ "</div>";
			// Die Verbindung IST optisch das Segment -- hier haengt sein eigener Schieber
			// (Entwurf Abschnitt 13.1). Fehlt das Segment (Kette und Segmentliste uneinig), bleibt
			// die Verbindung wie bisher leer, statt einen Regler ohne Ziel zu zeigen.
			if (i < chain.length - 1) {
				html += '<div class="pl-conn">' + curveSegMarkup(segmentBetween(line, pid, chain[i + 1])) + "</div>";
			}
		});
	} else {
		const note = t.isRing ? "Geschlossener Ring · " + line.segments.length + " Segmente · keine Enden"
			: "Verzweigte Linie · " + t.endpointIds.length + " Enden · als Kantenliste bearbeiten";
		html += '<div class="pl-topo-note">' + note + " ✕ entfernt eine Kante.</div>";
		line.segments.forEach((seg) => {
			html += '<div class="pl-edge"><span class="a">' + esc(nodeName(seg.from_public_id)) + '</span><span class="arw">—</span><span class="a">' + esc(nodeName(seg.to_public_id)) + "</span>"
				+ curveSegMarkup(seg)
				+ flyBtn(seg.from_public_id)
				+ '<button class="pl-icon-btn del" title="Kante entfernen" data-remove-seg="' + esc(seg.public_id) + '">✕</button></div>';
		});
	}
	html += renderAddPanel(line);
	host.innerHTML = html;
	wireNodeActions(line);
}
function renderAddPanel(line) {
	const nodeOptions = [...line.topology.adjacency.keys()].map((pid) => '<option value="' + esc(pid) + '">' + esc(nodeName(pid)) + "</option>").join("");
	return '<div class="pl-add">'
		+ '<button class="pl-add-toggle" id="plAddToggle">+ Nodix hinzufügen</button>'
		+ '<div class="pl-add-panel" id="plAddPanel" hidden>'
			+ '<label>Verbinden von<select id="plAddFrom">' + nodeOptions + "</select></label>"
			+ '<label>nach (Nodix-Ort oder Kreuzung)<input type="search" id="plAddSearch" placeholder="suchen …" autocomplete="off"></label>'
			+ '<div class="pl-results" id="plAddResults"></div>'
			+ '<div class="dt-actions"><button class="primary" id="plAddConfirm" disabled>Nodix anfügen</button><button id="plAddCancel">Abbrechen</button><span class="dt-msg" id="plAddMsg"></span></div>'
		+ "</div></div>";
}
let addPick = null;
function wireNodeActions(line) {
	$("plNodes").querySelectorAll("[data-fly]").forEach((b) => b.addEventListener("click", () => flyToNode(b.getAttribute("data-fly"))));
	$("plNodes").querySelectorAll("[data-remove-node]").forEach((b) => b.addEventListener("click", () => removeNode(b.getAttribute("data-remove-node"))));
	$("plNodes").querySelectorAll("[data-remove-seg]").forEach((b) => b.addEventListener("click", () => removeSegment(b.getAttribute("data-remove-seg"))));
	// Die Kurven-Schieber der einzelnen Segmente. ⚠️ Nur der ENTWURF wandert -- gespeichert wird
	// weiterhin mit „Speichern", wie bei jedem anderen Feld dieses Fensters.
	$("plNodes").querySelectorAll("[data-curve-seg]").forEach((schieber) => {
		schieber.addEventListener("input", () => {
			const pid = schieber.getAttribute("data-curve-seg");
			curveDraft[pid] = Number(schieber.value) || 0;
			const anzeige = schieber.parentNode.querySelector(".pl-curve-seg__val");
			if (anzeige) { anzeige.textContent = curveText(curveDraft[pid]); }
			// Live auf die Karte -- ohne das zieht man blind.
			meldeKurvenAnKarte(false);
		});
	});
	$("plNodes").querySelectorAll("[data-move-up]").forEach((b) => b.addEventListener("click", () => moveNode(parseInt(b.getAttribute("data-move-up"), 10), -1)));
	$("plNodes").querySelectorAll("[data-move-down]").forEach((b) => b.addEventListener("click", () => moveNode(parseInt(b.getAttribute("data-move-down"), 10), 1)));
	const reorderSave = $("plReorderSave");
	if (reorderSave) { reorderSave.addEventListener("click", saveReorder); }
	const reorderReset = $("plReorderReset");
	if (reorderReset) { reorderReset.addEventListener("click", () => { reorderDraft = null; renderNodes(); }); }
	const toggle = $("plAddToggle");
	if (toggle) {
		toggle.addEventListener("click", () => { const p = $("plAddPanel"); p.hidden = !p.hidden; if (!p.hidden) { $("plAddSearch").focus(); } });
		$("plAddCancel").addEventListener("click", () => { $("plAddPanel").hidden = true; });
		addPick = null;
		$("plAddSearch").addEventListener("input", () => renderAddResults(line));
		$("plAddConfirm").addEventListener("click", () => addNode(line));
		renderAddResults(line);
	}
}
function renderAddResults(line) {
	const term = $("plAddSearch").value.trim().toLowerCase();
	const inLine = new Set(line.topology.adjacency.keys());
	const matches = candidates
		.filter((c) => !inLine.has(c.public_id))
		.filter((c) => term === "" ? true : c.name.toLowerCase().indexOf(term) !== -1)
		.slice(0, 30);
	$("plAddResults").innerHTML = matches.length === 0
		? '<div style="padding:5px 7px;color:var(--mut);font-size:11px;">Keine Kandidaten.</div>'
		: matches.map((c) => '<div data-pick="' + esc(c.public_id) + '"' + (addPick === c.public_id ? ' class="is-picked"' : "") + ">" + esc(c.name) + " " + (c.type === "crossing" ? '<span class="dt-badge warn">Kreuzung</span>' : '<span class="dt-badge">Nodix</span>') + "</div>").join("");
	$("plAddResults").querySelectorAll("[data-pick]").forEach((d) => d.addEventListener("click", () => {
		addPick = d.getAttribute("data-pick");
		$("plAddConfirm").disabled = false;
		renderAddResults(line);
	}));
}
async function addNode(line) {
	if (!addPick) { return; }
	const from = $("plAddFrom").value;
	const msg = $("plAddMsg");
	msg.textContent = "Fügt an…"; msg.className = "dt-msg";
	try {
		await mapFeaturesEditPost({ action: "create_powerline", from_public_id: from, to_public_id: addPick, name: line.name });
		await reload(line.name);
	} catch (e) {
		msg.textContent = e.message || "Fehlgeschlagen."; msg.className = "dt-msg bad";
	}
}
async function removeSegment(publicId) {
	if (!window.confirm("Diese Kante entfernen?")) { return; }
	try { await mapFeaturesEditPost({ action: "delete_feature", public_id: publicId }); await reload(selectedName); }
	catch (e) { setSaveMsg(e.message || "Fehlgeschlagen.", "bad"); }
}
async function removeNode(pid) {
	const line = lineByName(selectedName);
	if (!line) { return; }
	const incident = line.segments.filter((s) => s.from_public_id === pid || s.to_public_id === pid);
	if (!window.confirm("„" + nodeName(pid) + "“ entfernen? Löscht " + incident.length + " Segment(e); die Linie kann dabei zerfallen.")) { return; }
	try {
		for (const seg of incident) { await mapFeaturesEditPost({ action: "delete_feature", public_id: seg.public_id }); }
		await reload(selectedName);
	} catch (e) { setSaveMsg(e.message || "Fehlgeschlagen.", "bad"); }
}
// ▲▼ swap two adjacent Nodices of a strand into a tentative order (reorderDraft). Only adjacent swaps,
// so any permutation is reachable step by step and each step is obvious. Nothing is written until
// "Speichern" -- this is a destructive rewire, so it stays staged behind a confirmation.
function moveNode(index, delta) {
	const line = lineByName(selectedName);
	if (!line || !line.topology) { return; }
	const trueChain = avesmapsPowerlineOrderedChain(line.topology) || [];
	const base = (reorderDraft && reorderDraft.length === trueChain.length) ? reorderDraft : trueChain;
	const chain = base.slice();
	const target = index + delta;
	if (index < 0 || index >= chain.length || target < 0 || target >= chain.length) { return; }
	const swap = chain[index]; chain[index] = chain[target]; chain[target] = swap;
	reorderDraft = chain;
	renderNodes();
}
async function saveReorder() {
	const line = lineByName(selectedName);
	if (!line || !line.topology) { return; }
	const trueChain = avesmapsPowerlineOrderedChain(line.topology) || [];
	const order = (reorderDraft && reorderDraft.length === trueChain.length) ? reorderDraft : trueChain;
	const diff = (typeof avesmapsPowerlineReorderDiff === "function") ? avesmapsPowerlineReorderDiff(line.segments, order) : { create: [], remove: [] };
	if (diff.create.length === 0 && diff.remove.length === 0) { reorderDraft = null; renderNodes(); return; }
	if (!window.confirm("Reihenfolge von „" + line.name + "“ ändern?\n\n" + diff.create.length + " Segment(e) werden neu angelegt, " + diff.remove.length + " entfernt.")) { return; }
	const msg = $("plReorderMsg"); if (msg) { msg.textContent = "Speichert…"; msg.className = "dt-msg"; }
	try {
		await mapFeaturesEditPost({ action: "reorder_powerline_line", current_name: line.name, ordered_public_ids: order });
		reorderDraft = null;
		await reload(line.name);
	} catch (e) {
		const failed = $("plReorderMsg");
		if (failed) { failed.textContent = e.message || "Umsortieren fehlgeschlagen."; failed.className = "dt-msg bad"; }
	}
}
function flyToNode(pid) {
	// The editor lives in an iframe; ask the parent app to fly to this map location.
	try {
		if (window.parent && typeof window.parent.avesmapsFlyToLocationPublicId === "function") {
			window.parent.avesmapsFlyToLocationPublicId(pid);
		}
	} catch (e) { /* cross-frame or not available: silent */ }
}

// ---- Ribbon ----------------------------------------------------------------------------------
function wireRibbon() {
	$("plSync").addEventListener("click", async () => {
		const sync = (window.parent && typeof window.parent.startWikiSyncPowerlines === "function") ? window.parent.startWikiSyncPowerlines : null;
		if (!sync) { return; }
		try {
			setStatus("⚡ Kraftlinien werden abgeglichen …");
			const res = await sync();                 // runs the sync in the parent; returns { type, message, unmatched_names?, claims_unresolved? }
			// Gegenrichtung (Schritt 5): die beiden Werte stehen nur in DIESER Antwort und verfallen
			// sonst mit ihr -- deshalb hier in Modul-Variablen festhalten, VOR dem reload(), damit die
			// erste Neuzeichnung sie schon zeigt.
			if (res && Array.isArray(res.unmatched_names)) {
				lastUnmatchedNames = res.unmatched_names;
				lastClaimsUnresolved = Number(res.claims_unresolved ?? 0);
			}
			await reload(selectedName);               // pull the freshly synced wiki fields into the editor
			flashStatus(res && res.message ? res.message : "Kraftlinien abgeglichen.");
		} catch (e) {
			flashStatus("Kraftlinien-Abgleich fehlgeschlagen.");
		}
	});
	$("plDupes").addEventListener("click", () => {
		showDupesOnly = !showDupesOnly;
		$("plDupes").classList.toggle("is-active", showDupesOnly);
		renderList();
	});
	$("plMapFilter").addEventListener("click", () => {
		$("plMapFilter").classList.toggle("is-active");
		// Live map filter is a parent-window concern; wired when the parent exposes it.
	});
	$("plSearch").addEventListener("input", () => { searchTerm = $("plSearch").value; renderList(); });
}

// ---- Load ------------------------------------------------------------------------------------
function setStatus(text) { $("plStatusText").textContent = text; }
function statusCountsText() {
	const dupeCount = lines.filter((l) => l.warnings.length > 0).length;
	return lines.length + " Kraftlinien · " + segments.length + " Segmente" + (dupeCount ? " · " + dupeCount + " Warnungen" : "");
}
// Show a message in the editor's OWN status bar for a few seconds, then fall back to the counts. Used
// for the "Kraftlinien syncen" result so it appears IN the editor -- the panel status sits behind the
// overlay and the owner never sees it there.
let plFlashTimer = null;
function flashStatus(message) {
	setStatus(message);
	if (plFlashTimer) { clearTimeout(plFlashTimer); }
	plFlashTimer = setTimeout(() => { setStatus(statusCountsText()); }, 7000);
}
function ingest(data) {
	reorderDraft = null;  // fresh data supersedes any half-arranged order
	segments = Array.isArray(data.segments) ? data.segments : [];
	nodesMap = (data.nodes && typeof data.nodes === "object") ? data.nodes : {};
	candidates = Array.isArray(data.nodix_candidates) ? data.nodix_candidates : [];
	wikiArticles = Array.isArray(data.wiki_articles) ? data.wiki_articles : [];
	dumpState = data.dump_state || { has_run: false, completed_at: "", article_count: 0 };
	groupLines();
	const dupeCount = lines.filter((l) => l.warnings.length > 0).length;
	setStatus(statusCountsText());
	$("plDupesInfo").textContent = dupeCount ? dupeCount + " zu prüfen" : "keine gefunden";
	if (pendingSelectName && lineByName(pendingSelectName)) { selectedName = pendingSelectName; pendingSelectName = null; }
	renderList();
	if (selectedName && lineByName(selectedName)) { renderDetail(); renderNodes(); }
	else { selectedName = null; $("plDetail").innerHTML = '<div class="dt-empty">Links eine Kraftlinie wählen.</div>'; $("plNodes").innerHTML = '<div class="dt-empty">Links eine Kraftlinie wählen.</div>'; }
}
async function reload(selectName) {
	if (selectName !== undefined) { selectedName = selectName; }
	await loadData();
}
async function loadData() {
	if (new URLSearchParams(location.search).has("demo")) { ingest(demoData()); return; }
	try {
		const response = await fetch(READ_API, { credentials: "same-origin", headers: { "Accept": "application/json" } });
		const data = await response.json();
		if (!response.ok || data.ok === false) { throw new Error((data.error && data.error.message) || ("HTTP " + response.status)); }
		ingest(data);
	} catch (e) {
		$("plList").innerHTML = '<div class="se-error">Konnte Kraftlinien nicht laden: ' + esc(e.message) + "</div>";
		setStatus("Fehler beim Laden.");
	}
}

// ---- Boot ------------------------------------------------------------------------------------
function boot() {
	wireRibbon();
	// The host may ask us to jump to a line by name (map popup "Bearbeiten"). Remember it; if the
	// list is already loaded, jump right away.
	window.addEventListener("message", (event) => {
		if (event.origin !== location.origin) { return; }
		// Das Ergebnis des Kurven-Reglers auf der Karte. ⚠️ Nur ins Formular, NICHT speichern -- das
		// bleibt beim Knopf „Speichern", wie bei jedem anderen Feld dieses Fensters.
		// Was auf der Karte eingestellt wurde: eine Karte public_id -> Wert.
		// 💣 Die Werte wandern in denselben ENTWURF wie die Kantenregler -- damit gilt fuer sie
		// dieselbe Regel „nur Angefasstes reist mit", und ein Zug auf der Karte ist so ein
		// Anfassen. Ohne das stellte man die Kurve auf der Karte ein, drueckte „Speichern", und der
		// Server bekaeme nichts: von „hat nicht funktioniert" nicht zu unterscheiden.
		const kurven = event.data && event.data.avesmapsPowerlineCurveResult;
		if (kurven && typeof kurven === "object") {
			Object.keys(kurven).forEach((pid) => {
				const wert = Number(kurven[pid]);
				if (Number.isFinite(wert)) { curveDraft[pid] = wert; }
			});
			renderNodes();
			return;
		}
		const name = event.data && event.data.avesmapsPowerlineSelect;
		if (!name) { return; }
		pendingSelectName = String(name);
		if (lineByName(pendingSelectName)) { selectLine(pendingSelectName); pendingSelectName = null; }
	});
	loadData();
}
if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", boot); } else { boot(); }

})();
