		: t("ecosystem.editor.enabled.clickOn", "Klick schaltet ein");
	tile.disabled = false;
	tile.classList.toggle("avm-tile--on", moduleEnabled);
	tile.title = moduleEnabled
		? "Die Landschaften-Ebene ist serverseitig eingeschaltet (app_setting['ecosystem_enabled']=1). Ausschalten leert den öffentlichen Lesepfad für alle."
		: "Die Landschaften-Ebene ist serverseitig ausgeschaltet (app_setting['ecosystem_enabled']=0). Der öffentliche Lesepfad liefert keine Flächen.";
}

// The state comes from the PUBLIC read path, which answers `ecosystem_enabled` before anything else
// -- no extra endpoint, and no write just to find out.
async function loadModuleEnabled() {
	try {
		const response = await fetch(AREAS_API, { credentials: "same-origin", headers: { Accept: "application/json" } });
		const data = await response.json();
		moduleEnabled = data && data.ok === true ? data.ecosystem_enabled === true : null;
		// The switched-off answer carries no areas, so nothing is cached from it.
		if (moduleEnabled === true && Array.isArray(data.areas)) {
			allAreas = data.areas;
			ecosystemRevision = Number(data.revision || 0);
			// This request already paid for everything the cache key needs, so a remembered answer
			// can be put on screen right here -- no clipping, and no political fan-out at all.
			const cached = raycastCacheRead();
			if (cached) {
				raycastCacheApply(cached);
				$("ecoRaycastInfo").textContent = t("ecosystem.editor.raycast.remembered", "{areas} Flächen · {terr} Territorien · gemerkt", { areas: allAreas.length, terr: (territories || []).length });
				renderDetail();
				renderPreview();
			}
		}
	} catch (error) {
		moduleEnabled = null;
	}
	renderEnabledTile();
}

// ---- Load ------------------------------------------------------------------------------------
async function loadWikiRegions() {
	const response = await fetch(WIKI_REGIONS_API, { credentials: "same-origin", headers: { Accept: "application/json" } });
	const data = await response.json();
	if (!response.ok || data.ok === false) {
		throw new Error((data.error && data.error.message) || data.error || ("HTTP " + response.status));
	}
	return data;
}

// ?demo=1 renders the whole column without a backend or a login -- same device as the powerline
// editor. It exists because there is NO local database: every DB path is only verifiable live, so
// the union logic above would otherwise be unmeasurable until it is deployed. One row per case the
// union has to get right.
function demoData() {
	// Map space is 0..1024; GeoJSON stores [x, y] (AGENTS.md §5).
	const rect = (publicId, regionId, regionName, kind, regionType, x1, y1, x2, y2) => ({
		public_id: publicId, region_public_id: regionId, region_name: regionName, kind, region_type: regionType,
		geometry: { type: "Polygon", coordinates: [[[x1, y1], [x2, y1], [x2, y2], [x1, y2], [x1, y1]]] },
		bounds: { min_x: x1, min_y: y1, max_x: x2, max_y: y2 },
	});
	return {
		// Chosen so the two halves of the raycast rule are both visible:
		//   Heldentrutz x Blautann   -> 10 000 / 40 000 = 25 %  (a normal overlap)
		//   Heldentrutz x Sichelwacht-> 2 500 / 2 500  = 100 %  (share of the SMALLER; measured
		//                               against the larger it would be 6,25 % and drop out)
		//   Wald-001                 -> no overlap at all
		areas: [
			rect("a3", "r3", "Heldentrutz", "topographie", "gebirge", 100, 100, 300, 300),
			rect("a1", "r1", "Blautann", "vegetation", "wald", 200, 200, 400, 400),
			rect("a2", "r2", "Blautann-Nord", "vegetation", "wald", 200, 400, 300, 500),
			rect("a5", "r5", "Sichelwacht", "topographie", "gebirge", 120, 120, 170, 170),
			rect("a4", "r4", "Wald-001", "vegetation", "wald", 700, 700, 800, 800),
		],
		// Nested, the way territories really lie: baronies tile, a county bundles them, a realm
		// bundles counties. Blautann (200..400) covers both baronies and therefore, by construction,
		// their county and its realm -- exactly the chain the display has to collapse.
		territories: [
			// Names carry their rank, exactly as the live layer delivers them -- that is the shape
			// that produced "Baronie Baronie Schneehag" when the type was prefixed.
			{ publicId: "t-bar-1", name: "Baronie Hartsteen", type: "Baronie", parentId: "t-graf", isAggregate: false, x1: 180, y1: 180, x2: 300, y2: 300 },
			{ publicId: "t-bar-2", name: "Baronie Grauensee", type: "Baronie", parentId: "t-graf", isAggregate: false, x1: 300, y1: 180, x2: 420, y2: 300 },
			// The awkward live variant: type "Herzogliche Baronie", name starting with plain "Baronie".
			{ publicId: "t-bar-3", name: "Baronie Herzoglich Wolfsstein", type: "Herzogliche Baronie", parentId: "t-graf", isAggregate: false, x1: 180, y1: 300, x2: 420, y2: 420 },
			{ publicId: "t-graf", name: "Grafschaft Ferdok", type: "Grafschaft", parentId: "t-reich", isAggregate: true, x1: 180, y1: 180, x2: 420, y2: 420 },
			// A name that does NOT carry its rank -- here the type is worth appending.
			{ publicId: "t-reich", name: "Kosch", type: "Königreich", parentId: "", isAggregate: true, x1: 100, y1: 100, x2: 500, y2: 500 },
			// weit weg -- darf nie auftauchen
			{ publicId: "t-fern", name: "Al'Anfa", type: "Stadtstaat", parentId: "", isAggregate: false, x1: 800, y1: 800, x2: 900, y2: 900 },
		],
		// Two separate vocabularies, never one filtered list: `wald` can never sit on a topographic
		// region (ecosystem_region_type.kind, checked again server-side).
		region_types: [
			{ kind: "vegetation", type_key: "wald", label: "Wald" },
			{ kind: "vegetation", type_key: "steppe", label: "Steppe" },
			{ kind: "topographie", type_key: "gebirge", label: "Gebirge" },
			{ kind: "topographie", type_key: "huegelland", label: "Hügelland" },
			{ kind: "derographisch", type_key: "sumpf", label: "Sumpf" },
		],
		eco: {
			regions: [
				// drawn + wiki + label: the complete case
				{ public_id: "r1", name: "Blautann", kind: "vegetation", region_type: "wald", wiki_region_key: "wiki:blautann", wiki_url: "https://…/Blautann", area_count: 2 },
				// second drawn region on the SAME wiki key -- normal, not a collision
				{ public_id: "r2", name: "Blautann-Nord", kind: "vegetation", region_type: "wald", wiki_region_key: "wiki:blautann", wiki_url: "https://…/Blautann", area_count: 1 },
				// drawn + wiki, no map label
				{ public_id: "r3", name: "Heldentrutz", kind: "topographie", region_type: "gebirge", wiki_region_key: "wiki:heldentrutz", wiki_url: "https://…/Heldentrutz", area_count: 3 },
				// drawn, no wiki at all (origin='own') -- a valid state, not a defect
				{ public_id: "r4", name: "Wald-001", kind: "vegetation", region_type: "wald", wiki_region_key: null, wiki_url: null, area_count: 1 },
				// drawn, key points at no staging row (renamed article / redirect)
				{ public_id: "r5", name: "Sichelwacht", kind: "topographie", region_type: "gebirge", wiki_region_key: "wiki:sichelwacht-alt", wiki_url: "https://…/Sichelwacht", area_count: 1 },
				// 💣 THE LIVE CASE (2026-07-28): a drawn region whose own name differs from the wiki
				// article it hangs on -- „Blautann" linked to „Falkenforst". The union merges it onto
				// the wiki row, and for one release the row then showed ONLY the wiki name, so the
				// editor could not find their own region at all. Verhaltensdoku §7a is explicit:
				// „jede Fläche bleibt unter ihrem eigenen Namen auffindbar".
				{ public_id: "r7", name: "Eichwald", kind: "vegetation", region_type: "wald", wiki_region_key: "wiki:falkenforst", wiki_url: "https://…/Falkenforst", area_count: 1 },
				// a region WITHOUT areas: in the list, not on the map
				{ public_id: "r6", name: "Nebelmoor", kind: "derographisch", region_type: "sumpf", wiki_region_key: null, wiki_url: null, area_count: 0 },
			],
		},
		wiki: {
			matched: [
				{ wiki_key: "wiki:blautann", name: "Blautann", art: "Wald", continent: "Aventurien", wiki_url: "https://…/Blautann", label: { public_id: "L1", name: "Blautann", subtype: "wald" } },
				{ wiki_key: "wiki:svelltal", name: "Svelltal", art: "Tal", continent: "Aventurien", wiki_url: "https://…/Svelltal", label: { public_id: "L2", name: "Svelltal", subtype: "tal" } },
			],
			ambiguous: [
				{ wiki_key: "wiki:bornland", name: "Bornland", art: "Region", continent: "Aventurien", wiki_url: "https://…/Bornland", labels: [{ public_id: "L3", name: "Bornland", subtype: "region" }, { public_id: "L4", name: "Bornland", subtype: "region" }] },
			],
			missing: [
				{ wiki_key: "wiki:heldentrutz", name: "Heldentrutz", art: "Gebirge", continent: "Aventurien", wiki_url: "https://…/Heldentrutz" },
				{ wiki_key: "wiki:gorische-wueste", name: "Gorische Wüste", art: "Wüste", continent: "Aventurien", wiki_url: "https://…/Gor" },
				{ wiki_key: "wiki:falkenforst", name: "Falkenforst", art: "Wald", continent: "Aventurien", wiki_url: "https://…/Falkenforst" },
				{ wiki_key: "wiki:myranor-nord", name: "Nordmyranor", art: "Region", continent: "Myranor", wiki_url: "https://…/Myranor" },
			],
			unmatched_map_labels: [
				{ public_id: "L9", name: "Trollzacken", subtype: "gebirge" },
			],
		},
	};
}

async function loadData(options) {
	const keepSelection = !!(options && options.keepSelection);
	const previousKey = keepSelection ? selectedKey : null;
	const previousPartner = keepSelection ? selectedPartnerId : null;
	const previousPartnerKind = keepSelection ? selectedPartnerKind : "";
	loadError = "";
	setStatus("Regionen werden geladen …");
	// After a save the selection has to survive the re-read, or every save throws the editor back to
	// "pick a region on the left" -- with the block you were just working in gone.
	const restoreSelection = () => {
		if (!keepSelection) { return; }
		selectedKey = rowByKey(previousKey) ? previousKey : null;
		selectedPartnerId = selectedKey ? previousPartner : null;
		selectedPartnerKind = selectedKey ? previousPartnerKind : "";
		renderDetail();
		renderPreview();
	};
	if (new URLSearchParams(location.search).has("demo")) {
		const demo = demoData();
		rows = buildRows(demo.eco.regions, demo.wiki);
		regionTypes = demo.region_types;
		allAreas = demo.areas;
		raycast = computeRaycast(allAreas);
		territories = demo.territories.map((entry) => {
			const geometry = { type: "Polygon", coordinates: [[[entry.x1, entry.y1], [entry.x2, entry.y1], [entry.x2, entry.y2], [entry.x1, entry.y2], [entry.x1, entry.y1]]] };
			return { publicId: entry.publicId, name: entry.name, type: entry.type, parentId: entry.parentId, isAggregate: entry.isAggregate,
				geometry, bounds: ecosystemGeometryBounds(geometry), area: Math.abs(ecosystemGeometryArea(geometry)) };
		});
		territoryHits = computeTerritoryHits(allAreas, territories);
		moduleEnabled = true;
		renderEnabledTile();
		$("ecoRaycastInfo").textContent = t("ecosystem.editor.raycast.info", "{areas} Flächen · Schwelle {pct} %", { areas: allAreas.length, pct: Math.round(RAYCAST_THRESHOLD * 100) });
		rebuildFilterMenu();
		renderList();
		restoreSelection();
		setStatus(statusCountsText());
		return;
	}
	try {
		// Both halves in parallel -- they are independent reads and the list needs both to exist.
		// list_regions WITHOUT `kind`: the payload's kind filter is optional, and the tabs filter in
		// the browser, so one request covers all three layers -- and region_types then carries the
		// vocabulary of all three, which the per-layer Art select needs.
		const [eco, wiki] = await Promise.all([ecoPost("list_regions", {}), loadWikiRegions()]);
		rows = buildRows(eco.regions || [], wiki);
		regionTypes = Array.isArray(eco.region_types) ? eco.region_types : [];
		rebuildFilterMenu();
		renderList();
		restoreSelection();
		setStatus(statusCountsText());
	} catch (error) {
		rows = [];
		loadError = "Regionen konnten nicht geladen werden: " + (error && error.message ? error.message : String(error));
		renderList();
		setStatus(loadError, "bad");
	}
}

// V9: was der Server über den zuletzt gespeicherten Lauf weiß. Eine kleine Abfrage, unabhängig von
// den Listen -- die Kachel muss ihren Stand auch dann sagen, wenn das Laden der Regionen scheitert.
// Ein Fehler bleibt still: „noch nicht gerechnet" ist die richtige Auskunft, wenn niemand antwortet.
async function loadAssignmentStamp() {
	try {
		assignmentStamp = await ecoPost("assignment_status", {});
		heightmapStatus = await ecoPost("heightmap_status", {});
		renderHeightmapTile();
		renderAssignmentTile();
	} catch (error) { /* die Kachel behaelt ihren Ausgangstext */ }
}

// ---- Boot ------------------------------------------------------------------------------------
function boot() {
	wireRibbon();
	wireTabs();
	wireFilters();
	renderEnabledTile();
	loadData();
	// Independent of the list: the switch must say what it is even if the lists fail to load.
	if (!new URLSearchParams(location.search).has("demo")) { loadModuleEnabled(); loadAssignmentStamp(); }
}
if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", boot); } else { boot(); }

})();
</script>
