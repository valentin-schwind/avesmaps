<script>
  /* Resolve light/dark exactly like the parent app (js/app/theme-toggle.js): an explicit saved
     choice wins, otherwise follow the OS scheme. Runs before the stylesheet paints so this overlay
     iframe never flashes the wrong theme. Same guard as html/wiki-sync-powerline-editor.html. */
  (function () {
    function isDark() {
      var s = null; try { s = localStorage.getItem("avesmaps-theme"); } catch (e) {}
      if (s === "dark") { return true; }
      if (s === "light") { return false; }
      return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
    function apply() {
      if (isDark()) { document.documentElement.setAttribute("data-theme", "dark"); }
      else { document.documentElement.removeAttribute("data-theme"); }
    }
    apply();
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) { mq.addEventListener("change", apply); }
      else if (mq.addListener) { mq.addListener(apply); }
    }
  })();
</script>

<script>
"use strict";
(function () {

// ---- Small helpers ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
// German is the default and stays it; ?lang=en (handed over by the host) or the DE|EN toggle in
// localStorage swaps in the English table. Falls back to the German literal if the engine is
// absent -- opening this page standalone must not blank every label (AGENTS.md §8).
const t = (key, german, params) => (typeof tr === "function" ? tr(key, german, params) : german);
function esc(s) {
	return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 🔴 The write/read channel is the EXISTING one: postEcosystemEdit in the parent app
// (js/map-features/map-features-ecosystem-region-store.js). It knows ECOSYSTEM_EDIT_API_URL, sets
// credentials and attaches error.code / error.status. Rebuilding it here would be a second answer
// to the same question -- and the second one is the one that drifts.
function ecoPost(action, payload) {
	const post = (window.parent && window.parent !== window && typeof window.parent.postEcosystemEdit === "function")
		? window.parent.postEcosystemEdit
		: null;
	if (!post) {
		return Promise.reject(new Error("Der Landschaften-Editor läuft ohne Hauptfenster; Schreiben und Listen sind hier nicht erreichbar."));
	}
	return post(action, payload || {});
}

// The wiki half of the list. Read straight from the endpoint the WikiSync „Regionen" tab already
// uses -- same action, same parameters (continent='' = every continent, filtered in the browser so
// the funnel can offer the choice; limit is clamped to 2000 server-side).
// 🔴 A wiki file, not a political one (main plan, rule 1).
const WIKI_REGIONS_API = "/api/edit/wiki/regions.php?action=match&continent=&limit=5000";

// ---- State -----------------------------------------------------------------------------------
let rows = [];              // the union, see buildRows()
let regionTypes = [];       // [{kind, type_key, label}] -- the Art vocabulary, per layer
let selectedKey = null;
let activeKind = "";        // "" = Alle; otherwise ecosystem_region.kind
let searchTerm = "";
let loadError = "";

// Funnel state. Same shapes js/ui/filter-menu.js expects: Set for "multi", {value} for "single".
const filterWiki = { value: "" };        // "" | "with" | "without"
const filterDisplay = { value: "" };     // "" | "label" | "area" | "both" | "none"
const filterArt = new Set();             // ecosystem_region.region_type
// Aventurien by default, exactly like the panel list (review-region-sync.js:10). The map IS
// Aventurien -- this is the map's identity, not a restriction, which is why it does not count as an
// active filter in the funnel's badge.
const filterContinent = new Set(["Aventurien"]);
let rebuildFilterMenu = () => {};

// ---- Status line -----------------------------------------------------------------------------
let ecoFlashTimer = null;
function setStatus(text, tone) {
	const el = $("ecoStatusText");
	el.textContent = text;
	el.classList.toggle("ok", tone === "ok");
	el.classList.toggle("bad", tone === "bad");
}
// Counts are the resting state; a result message shows for a while and then gives the line back.
function statusCountsText() {
	if (loadError) { return loadError; }
	if (rows.length === 0) { return t("ecosystem.editor.noRegions", "Keine Regionen geladen."); }
	const drawn = rows.filter((row) => row.areaCount > 0).length;
	const areas = rows.reduce((sum, row) => sum + row.areaCount, 0);
	return t("ecosystem.editor.counts", "{regions} Regionen · {drawn} gezeichnet · {areas} Flächen",
		{ regions: rows.length, drawn, areas });
}
function flashStatus(message, tone) {
	setStatus(message, tone);
	if (ecoFlashTimer) { clearTimeout(ecoFlashTimer); }
	ecoFlashTimer = setTimeout(() => { setStatus(statusCountsText()); }, 7000);
}

// ---- Column 1: the union ---------------------------------------------------------------------
// Owner decision 2026-07-27: this list is the UNION of three things that each answer "is there a
// region here" differently --
//   * gezeichnete Fläche   ecosystem_region (+ ecosystem_area), the editor's own rows
//   * Karten-Label         a map_features label, what a reader sees on the map
//   * Wiki-Region          a wiki_region_staging row with neither of the above
// The join key is wiki_key. A row that has neither a label nor an area is exactly what the filter
// „Map-Darstellung: keine" is for -- that is why the union, and not just the drawn areas.
//
// 🔴 Nothing is merged, moved or written here. This is a read; several drawn regions sharing one
// wiki key is the normal case (idx_ecosystem_region_wiki is an INDEX, not UNIQUE).
function emptyRow(key, name) {
	return {
		key, name,
		wikiKey: "", wikiUrl: "", art: "", continent: "",
		labels: [], regions: [], areaCount: 0,
		orphanKey: false,
	};
}

function buildRows(ecoRegions, wiki) {
	const byWikiKey = new Map();
	const out = [];

	const addWikiEntry = (entry, labels) => {
		const key = String(entry.wiki_key || "").trim();
		const row = emptyRow("wiki:" + key, String(entry.name || ""));
		row.wikiKey = key;
		row.wikiUrl = String(entry.wiki_url || "");
		row.art = String(entry.art || "");
		row.continent = String(entry.continent || "").trim() || "Aventurien";
		row.labels = labels;
		if (key !== "") { byWikiKey.set(key, row); }
		out.push(row);
	};

	(wiki.matched || []).forEach((entry) => addWikiEntry(entry, entry.label ? [entry.label] : []));
	(wiki.ambiguous || []).forEach((entry) => addWikiEntry(entry, entry.labels || []));
	(wiki.missing || []).forEach((entry) => addWikiEntry(entry, []));

	// A map label whose name matches no wiki region. It IS on the map, so it belongs in a list that
	// asks "what is displayed where" -- it simply has no wiki side.
	(wiki.unmatched_map_labels || []).forEach((label) => {
		const row = emptyRow("label:" + String(label.public_id || label.name || ""), String(label.name || ""));
		row.labels = [label];
		// No wiki row means no continent field. Aventurien, like every other continent-less row
		// (regionRowContinent in review-region-sync.js does the same).
		row.continent = "Aventurien";
		out.push(row);
	});

	// The drawn regions last: they either hang onto a wiki row that is already here, or they stand
	// on their own.
	(ecoRegions || []).forEach((region) => {
		const key = String(region.wiki_region_key || "").trim();
		const host = key !== "" ? byWikiKey.get(key) : null;
		if (host) {
			host.regions.push(region);
			return;
		}
		const row = emptyRow("eco:" + String(region.public_id || ""), String(region.name || ""));
		row.regions.push(region);
		row.wikiKey = key;
		row.wikiUrl = String(region.wiki_url || "");
		row.continent = "Aventurien";
		// ⚠️ A key that points at no staging row: the article was renamed or is a redirect. Writing
		// would be correct and the row would still never show up under that wiki region -- so it is
		// named here rather than quietly merged (docs/oekosystem-editor-verhalten.md §7a).
		row.orphanKey = key !== "";
		out.push(row);
	});

	out.forEach((row) => {
		row.areaCount = row.regions.reduce((sum, area) => sum + Number(area.area_count || 0), 0);
	});
	out.sort((a, b) => a.name.localeCompare(b.name, "de"));
	return out;
}

// Map-Darstellung: what a reader actually sees. „Fläche" asks for a DRAWN area, so a region row
// with zero active areas counts as „keine" -- it exists in the list and not on the map, and a
// region without areas is a valid state (Verhaltensdoku §10), not an error.
function displayOf(row) {
	const hasLabel = row.labels.length > 0;
	const hasArea = row.areaCount > 0;
	if (hasLabel && hasArea) { return "both"; }
	if (hasLabel) { return "label"; }
	if (hasArea) { return "area"; }
	return "none";
}
const DISPLAY_LABEL = { label: "Label", area: "Fläche", both: "Label + Fläche", none: "nicht auf der Karte" };

// The drawn names under a row that differ from its wiki title. Empty when the row has no wiki side
// (then the title IS the drawn name) -- so this only ever flags a real name/article disagreement.
function rowOwnNames(row) {
	return [...new Set(row.regions.map((region) => String(region.name || "")).filter((name) => name !== "" && name !== row.name))];
}
// 💣 „Der Name weicht ab" is NOT the finding -- several regions under one wiki key is the FEATURE
// (Verhaltensdoku §7a: „Bilku", „Bilku-Archipel", „Sorak" and „Kossike" are four regions the wiki
// knows as one, and the shared key is what brings them together). A first version flagged every
// multi-region row and lit up „Blautann" + „Blautann-Nord", which is entirely normal.
//
// The finding is narrower: NOT ONE of the drawn regions relates to the wiki title. That is the
// Blautann/Falkenforst case -- a single region whose name has nothing to do with its article -- and
// it leaves the legitimate groupings alone, because one member always carries the shared name.
function namesRelate(a, b) {
	const x = String(a || "").toLowerCase().trim();
	const y = String(b || "").toLowerCase().trim();
	if (x === "" || y === "") { return false; }
	return x.includes(y) || y.includes(x);
}
function rowNameMismatch(row) {
	if (row.wikiKey === "" || row.regions.length === 0) { return false; }
	return !row.regions.some((region) => namesRelate(region.name, row.name));
}

function rowKinds(row) {
	return new Set(row.regions.map((area) => String(area.kind || "")).filter(Boolean));
}

// Everything except the tab: the tab is what the Art/continent option builders count WITHIN, so
// they must see the tab applied but not the funnel's own section.
function rowsForTab() {
	return rows.filter((row) => activeKind === "" || rowKinds(row).has(activeKind));
}

function matchesSearch(row) {
	const term = searchTerm.trim().toLowerCase();
	if (term === "") { return true; }
	return [row.name, row.art, row.wikiKey].concat(row.regions.map((a) => a.name))
		.filter(Boolean).some((value) => String(value).toLowerCase().includes(term));
}

function visibleRows() {
	return rowsForTab().filter((row) => {
		if (!matchesSearch(row)) { return false; }
		if (filterContinent.size > 0 && !filterContinent.has(row.continent)) { return false; }
		if (filterWiki.value === "with" && row.wikiKey === "") { return false; }
		if (filterWiki.value === "without" && row.wikiKey !== "") { return false; }
		if (filterWiki.value === "mismatch" && !rowNameMismatch(row)) { return false; }
		if (filterDisplay.value !== "" && displayOf(row) !== filterDisplay.value) { return false; }
		if (filterArt.size > 0 && !row.regions.some((area) => filterArt.has(String(area.region_type || "")))) { return false; }
		return true;
	});
}

// Option builders read the LOADED rows and carry counts -- never a list written into the program.
// A fixed list offers values that do not exist and swallows real ones, and an empty result then
// looks exactly like "there is none" (review-subjects.js:79).
function artOptions() {
	const byType = new Map();
	rowsForTab().forEach((row) => row.regions.forEach((area) => {
		const type = String(area.region_type || "").trim();
		if (type === "") { return; }
		if (!byType.has(type)) { byType.set(type, { value: type, label: type, count: 0 }); }
		byType.get(type).count += 1;
	}));
	return [...byType.values()].sort((a, b) => a.label.localeCompare(b.label, "de"));
}

function continentOptions() {
	const byContinent = new Map();
	rowsForTab().forEach((row) => {
		if (!byContinent.has(row.continent)) { byContinent.set(row.continent, { value: row.continent, label: row.continent, count: 0 }); }
		byContinent.get(row.continent).count += 1;
	});
	return [...byContinent.values()].sort((a, b) =>
		/aventurien/i.test(a.value) ? -1 : /aventurien/i.test(b.value) ? 1 : a.label.localeCompare(b.label, "de"));
}

function displayOptions() {
	const counted = { label: 0, area: 0, both: 0, none: 0 };
	rowsForTab().forEach((row) => { counted[displayOf(row)] += 1; });
	return [
		{ value: "label", label: "nur Label", count: counted.label },
		{ value: "area", label: "nur Fläche", count: counted.area },
		{ value: "both", label: "Label + Fläche", count: counted.both },
		{ value: "none", label: "keine", count: counted.none },
	];
}

function wikiOptions() {
	const withWiki = rowsForTab().filter((row) => row.wikiKey !== "").length;
	// The third value is the sweep the owner asked for after the Blautann/Falkenforst case: find
	// every row whose drawn region disagrees with its wiki article, in one click, instead of
	// noticing one by accident.
	const mismatched = rowsForTab().filter(rowNameMismatch).length;
	return [
		{ value: "with", label: "mit Wiki", count: withWiki },
		{ value: "without", label: "ohne Wiki", count: rowsForTab().length - withWiki },
		{ value: "mismatch", label: "Name ≠ Artikel", count: mismatched },
	];
}

function renderList() {
	const host = $("ecoList");
	if (loadError) {
		host.innerHTML = '<div class="avm-error">' + esc(loadError) + "</div>";
		$("ecoSummary").textContent = "";
		return;
	}
	const visible = visibleRows();
	$("ecoSummary").textContent = visible.length === rowsForTab().length
		? visible.length + " Regionen"
		: visible.length + " von " + rowsForTab().length + " Regionen";
	if (visible.length === 0) {
		host.innerHTML = '<div class="avm-empty">' + (rows.length === 0 ? "Keine Regionen." : "Nichts gefunden.") + "</div>";
		return;
	}
	host.innerHTML = visible.map((row) => {
		const display = displayOf(row);
		const kinds = [...rowKinds(row)].join(" · ");
		const parts = [];
		// 💣 The row is titled after the WIKI region, because that is what joins several drawn
		// regions into one line. But a drawn region may carry a DIFFERENT name than the article it
		// hangs on -- live on 2026-07-28, „Blautann" hangs on „Falkenforst" -- and for one release
		// the editor's own name then appeared nowhere at all. Verhaltensdoku §7a is explicit that
		// the shared key must bring regions together "ohne dass jemand entscheiden muss, welcher der
		// vier Namen überlebt: jede Fläche bleibt unter ihrem eigenen Namen auffindbar".
		// So every own name that differs from the title is named here, first.
		// 🔴 A name that differs from its wiki article is a FINDING, not a nickname. The first wording
		// here read „als Blautann", which sounds like an alias and made a mis-assignment look like a
		// naming variant -- the owner read it that way immediately: „die zwei haben nix miteinander
		// zu tun". Verhaltensdoku §11 already lists this case: „Wiki-Name passt nicht zum Label
		// darunter -> Zuweisung vermutlich verrutscht". So it is said as that, and it colours the row.
		const ownNames = rowOwnNames(row);
		const nameMismatch = rowNameMismatch(row);
		if (ownNames.length > 0) {
			parts.push(nameMismatch
				? "⚠ Fläche heißt „" + ownNames.join(" · ") + "“ — Zuweisung prüfen"
				: ownNames.join(" · "));
		}
		if (row.regions.length > 0) {
			parts.push(row.regions.length + (row.regions.length === 1 ? " Region" : " Regionen") + " · " + row.areaCount + (row.areaCount === 1 ? " Fläche" : " Flächen"));
		}
		if (kinds) { parts.push(kinds); }
		if (row.art) { parts.push(row.art); }
		if (row.wikiKey === "") { parts.push("ohne Wiki-Eintrag"); }
		return '<div class="avm-row' + (row.key === selectedKey ? " is-selected" : "") + '" data-key="' + esc(row.key) + '">'
			+ '<div class="avm-row__text">'
			+ '<div class="avm-row__l1"><span class="avm-row__name">' + esc(row.name) + "</span>"
			+ '<span class="avm-pill' + (row.orphanKey ? " avm-pill--unresolved" : "") + '">'
			+ esc(row.orphanKey ? "Schlüssel ohne Wiki-Zeile" : DISPLAY_LABEL[display]) + "</span></div>"
			+ '<div class="avm-row__l2' + (nameMismatch ? " warn" : "") + '">' + esc(parts.join(" · ")) + "</div>"
			+ "</div></div>";
	}).join("");
	host.querySelectorAll(".avm-row").forEach((element) => {
		element.addEventListener("click", () => selectRow(element.getAttribute("data-key")));
	});
}

function selectRow(key) {
	selectedKey = key;
	selectedPartnerId = null;   // a new region invalidates the pair column 3 was showing
	selectedPartnerKind = "";
	renderList();
	renderDetail();
	renderPreview();
}

function wireTabs() {
	$("ecoTabs").addEventListener("click", (event) => {
		const tab = event.target.closest(".avm-tab");
		if (!tab) { return; }
		activeKind = tab.getAttribute("data-kind") || "";
		$("ecoTabs").querySelectorAll(".avm-tab").forEach((element) => element.classList.toggle("is-active", element === tab));
		// The Art values are per layer, so switching the tab changes which values exist at all. A
		// selection carried over from the previous tab would filter against a vocabulary that is no
		// longer offered -- and silently show nothing.
		filterArt.clear();
		rebuildFilterMenu();
		renderList();
	});
	$("ecoSearch").addEventListener("input", () => { searchTerm = $("ecoSearch").value; renderList(); });
}

function wireFilters() {
	rebuildFilterMenu = avmFilterMenuAttach("ecoFilterToggle", "ecoFilterMenu", [
		{ menuId: "ecoFilterWiki", kind: "single", state: filterWiki, getOptions: wikiOptions },
		{ menuId: "ecoFilterDisplay", kind: "single", state: filterDisplay, getOptions: displayOptions },
		{ menuId: "ecoFilterArt", kind: "multi", state: filterArt, getOptions: artOptions },
		{
			menuId: "ecoFilterContinent", kind: "multi", state: filterContinent, getOptions: continentOptions,
			// Aventurien is the map's identity, not a restriction -- it must not light the funnel's
			// counter up on every load. Same exception the panel list makes.
			isActive: () => !(filterContinent.size === 1 && filterContinent.has("Aventurien")) && filterContinent.size > 0,
		},
	], renderList);
}

// ---- Column 2: properties + the raycast ------------------------------------------------------
// „Zugehörigkeit": which vegetation and topography lies in which derographic region. Computed here,
// NEVER stored -- exactly like the conflict centre: a moved boundary corrects the answer by itself,
// and a stored column would be a second truth about the same thing.
//
// Rule (owner 2026-07-27, measured): share of the SMALLER of the two areas, threshold 10 %.
//   * "smaller of the two" also covers a mountain range running through several derographic regions
//     -- measured as "share of the range" it would drop out everywhere.
//   * NOT ">= 1 vertex": that misses a long forest crossing a region without having a corner in it,
//     and it hangs on the raster tracing's simplify_ratio instead of on the geography.
//   * Measured 47 ms for the whole live stock (124 areas x 20 regions) WITH the bounding-box
//     pre-filter, which discards 94 % of the pairs before any clipping runs.
const RAYCAST_THRESHOLD = 0.10;
const AREAS_API = "/api/app/ecosystem-areas.php";   // no bbox = the whole stock, with geometry

let allAreas = null;             // null = never loaded
let raycast = null;              // Map<region_public_id, [{regionId, name, kind, regionType, share}]>
let raycastNote = "";
let selectedPartnerId = null;    // the partner picked in "Gemeinsame Regionen mit" or "Liegt in"
let selectedPartnerKind = "";    // "region" | "territory" -- the two live in different stores
let moduleEnabled = null;        // null = not asked yet; the tile says so rather than guessing
let territories = null;          // [{publicId, name, type, parentId, isAggregate, geometry, bounds, area}]
let territoryHits = null;        // Map<region_public_id, [{territory, share}]>
let territoryNote = "";
let ecosystemRevision = null;    // the cache key: every write bumps it, so the answer self-expires

// ---- V9: Wege × Flächen ------------------------------------------------------------------------
// Das dritte Ergebnis desselben Knopfes, und das einzige, das die öffentliche Karte später lesen
// soll. Spec: docs/superpowers/specs/2026-07-29-landschaften-v9-vorberechnung-design.md
const PATHS_API = "/api/edit/map/paths-geometry.php";
let allPaths = null;             // null = in dieser Sitzung noch nicht geholt
let mapRevision = null;
let pathAssignments = null;      // { rows, stats } des letzten Laufs
let assignmentStamp = null;      // was der Server über den letzten gespeicherten Lauf sagt

// ---- V11: Höhenraster ---------------------------------------------------------------------
const PEAKS_API = "/api/edit/map/peaks-geometry.php";
let allPeaks = null;             // null = in dieser Sitzung noch nicht geholt
let heightmapStatus = null;      // was der Server über die gespeicherten Raster sagt

async function loadPeaks() {
	const response = await fetch(PEAKS_API, { credentials: "same-origin", headers: { Accept: "application/json" } });
	const data = await response.json();
	if (!response.ok || data.ok !== true) {
		throw new Error((data.error && data.error.message) || "Gipfel konnten nicht geladen werden.");
	}
	return data.peaks || [];
}

function boundsOverlap(a, b) {
	return !(a.max_x < b.min_x || b.max_x < a.min_x || a.max_y < b.min_y || b.max_y < a.min_y);
}

// Region -> its areas, its total area, its bounds. One pass, so the pair loop below stays cheap.
function groupAreasByRegion(areas) {
	const byRegion = new Map();
	areas.forEach((area) => {
		const id = String(area.region_public_id || "");
		if (id === "") { return; }
		if (!byRegion.has(id)) {
			byRegion.set(id, { regionId: id, name: String(area.region_name || ""), kind: String(area.kind || ""), regionType: String(area.region_type || ""), areas: [], total: 0 });
		}
		const entry = byRegion.get(id);
		entry.areas.push(area);
		entry.total += Math.abs(ecosystemGeometryArea(area.geometry));
	});
	return byRegion;
}

function computeRaycast(areas) {
	const byRegion = groupAreasByRegion(areas);
	const regions = [...byRegion.values()];
	const result = new Map(regions.map((region) => [region.regionId, []]));
	let pairsTested = 0, pairsClipped = 0;

	for (let i = 0; i < regions.length; i++) {
		for (let j = i + 1; j < regions.length; j++) {
			const a = regions[i], b = regions[j];
			let shared = 0;
			for (const areaA of a.areas) {
				for (const areaB of b.areas) {
					pairsTested++;
					// The pre-filter. Cheap, and it is what keeps the whole thing at 47 ms.
					if (!boundsOverlap(areaA.bounds, areaB.bounds)) { continue; }
					pairsClipped++;
					try {
						shared += Math.abs(ecosystemGeometryArea(ecosystemBooleanGeometry("intersection", areaA.geometry, areaB.geometry)));
					} catch (error) {
						// An EMPTY intersection is the normal case, not a fault: two bounding boxes may
						// overlap while the polygons do not. ecosystemClippingToGeometry throws on an
						// empty result, so it is caught here rather than aborting the whole run.
					}
				}
			}
			if (shared <= 0) { continue; }
			// Share of the SMALLER region. Summed over the area pairs and divided by the smaller
			// TOTAL, so a region made of several pieces is judged as one thing.
			const share = shared / Math.max(1e-9, Math.min(a.total, b.total));
			if (share < RAYCAST_THRESHOLD) { continue; }
			result.get(a.regionId).push({ regionId: b.regionId, name: b.name, kind: b.kind, regionType: b.regionType, share });
			result.get(b.regionId).push({ regionId: a.regionId, name: a.name, kind: a.kind, regionType: a.regionType, share });
		}
	}
	// Sorted by share, biggest first -- the threshold is then a line one can argue about, not magic.
	result.forEach((list) => list.sort((x, y) => y.share - x.share));
	raycastNote = regions.length + " Regionen · " + pairsTested + " Paare geprüft · " + pairsClipped + " verschnitten";
	return result;
}

// ---- „Liegt in": the same raycast against the political territories -------------------------
// 🔴 Owner 2026-07-28 relaxed the main plan's rule 1 for a READ. This module writes nothing
// political; it asks api/app/political-territories.php?action=layer through the helper the
// settlement editor already uses.
//
// ⚠️ That helper dedups by territory_public_id and keeps the FIRST geometry a zoom surfaces. A
// territory therefore appears ONCE -- with the geometry the layer actually shows for it, aggregate
// or raw. Each hit says which it was rather than pretending both are available.
//
// 💣 It fans out over zoom 0..6 because territories are zoom-banded (a single call misses most of
// them). That is seven requests at the political layer, which CLAUDE.md warns never to loop -- so
// it stays behind the explicit „Zugehörigkeit rechnen" click and runs at most once per session.
async function loadTerritories() {
	if (typeof loadAllTerritoryGeometry !== "function") {
		throw new Error("Das Territorien-Modul ist nicht geladen.");
	}
	const entries = await loadAllTerritoryGeometry();
	return entries.map((entry) => {
		const properties = (entry.feature && entry.feature.properties) || {};
		const geometry = entry.feature && entry.feature.geometry;
		const bounds = geometry ? ecosystemGeometryBounds(geometry) : null;
		return {
			publicId: String(properties.territory_public_id || ""),
			name: String(properties.name || properties.display_name || ""),
			type: String(properties.territory_type || properties.feature_subtype || ""),
			parentId: String(properties.parent_public_id || ""),
			isAggregate: properties.is_aggregate === true,
			geometry,
			bounds,
			area: geometry ? Math.abs(ecosystemGeometryArea(geometry)) : 0,
		};
	}).filter((territory) => territory.publicId !== "" && territory.bounds && territory.area > 0);
}

// Same rule as the landscape raycast: share of the SMALLER of the two, threshold 10 %. A forest
// lying wholly inside a realm scores 100 % -- measured against the realm it would be a rounding
// error and would never show.
function computeTerritoryHits(areas, allTerritories) {
	const byRegion = groupAreasByRegion(areas);
	const result = new Map();
	let tested = 0, clipped = 0;
	byRegion.forEach((region) => {
		const hits = [];
		allTerritories.forEach((territory) => {
			let shared = 0;
			// Ein Territorium ohne Hülle kommt aus dem Zwischenspeicher-Index, der die Geometrie
			// bewusst weglässt. Der Aufrufer lädt sie inzwischen nach; hier steht der Riegel trotzdem,
			// weil eine halbe Liste den ganzen Lauf gekostet hat statt nur ihren eigenen Eintrag.
			if (!territory || !territory.bounds || !territory.geometry) { return; }
			region.areas.forEach((area) => {
				tested++;
				if (!boundsOverlap(area.bounds, territory.bounds)) { return; }
				clipped++;
				try {
					shared += Math.abs(ecosystemGeometryArea(ecosystemBooleanGeometry("intersection", area.geometry, territory.geometry)));
				} catch (error) { /* empty overlap is the normal case */ }
			});
			if (shared <= 0) { return; }
			const share = shared / Math.max(1e-9, Math.min(region.total, territory.area));
			if (share >= RAYCAST_THRESHOLD) { hits.push({ territory, share }); }
		});
		hits.sort((a, b) => b.share - a.share);
		result.set(region.regionId, hits);
	});
	territoryNote = allTerritories.length + " Territorien · " + clipped + " von " + tested + " Paaren verschnitten";
	return result;
}

// The ancestor chain, from parent_public_id. 🔴 An ancestor is NOT a finding: if a forest hits a
// barony, that barony's county and realm contain it by construction. Deriving the chain instead of
// listing every ancestor as its own hit is what keeps this column readable.
// 💣 The territory NAME already carries its rank -- measured on the live layer: 713 of 945 names
// start with their exact territory_type, and the remaining ones are self-describing full names
// ("Alanfanisches Imperium", "Heiliges Neues Kaiserreich vom Greifenthron zu Gareth"). Prefixing the
// type produced "Baronie Baronie Schneehag" and "Herzogliche Baronie Baronie Herzoglich Waldleuen".
// The type is appended ONLY where the name genuinely lacks it -- "Thorwal (Reich)". Compared on the
// head noun, so "Herzogliche Baronie" counts as carried by "Baronie Herzoglich Waldleuen".
function territoryLabel(territory) {
	const name = String(territory.name || "").trim();
	const type = String(territory.type || "").trim();
	if (name === "" || type === "") { return name || type; }
	const head = type.split(/[\s,]+/).filter(Boolean).pop() || type;
	return name.toLowerCase().includes(head.toLowerCase()) ? name : name + " (" + type + ")";
}

function territoryChain(territory, index) {
	const chain = [];
	const seen = new Set();
	let current = index.get(territory.parentId);
	while (current && !seen.has(current.publicId)) {
		seen.add(current.publicId);
		chain.push(current);
		current = index.get(current.parentId);
	}
	return chain;
}

// ---- Remembering the result -------------------------------------------------------------------
// Owner 2026-07-28: „ich muss die Zugehörigkeit immer neu rechnen … schön wärs, wenn er sie sich
// speichert". Kept as a CACHE, not as stored truth, and keyed by `ecosystem_revision`:
//
// 🔴 The plan's rule „gerechnet, nie gespeichert" exists for a reason -- a moved boundary must
// correct the answer by itself, and a stored column would be a second truth that goes stale in
// silence. A revision-keyed cache keeps both: no recomputation while nothing changed, and an
// automatic recomputation the moment anything did. Every write bumps ecosystem_revision, so the key
// invalidates itself; the territory half rides along on the same key plus the territory count.
const RAYCAST_CACHE_KEY = "avesmaps-ecosystem-raycast";

function raycastCacheStamp() {
	return JSON.stringify({ rev: ecosystemRevision, areas: (allAreas || []).length, terr: (territories || []).length });
}

function raycastCacheRead() {
	try {
		const raw = localStorage.getItem(RAYCAST_CACHE_KEY);
		if (!raw) { return null; }
		const cached = JSON.parse(raw);
		return (cached && cached.stamp && cached.rev === ecosystemRevision) ? cached : null;
	} catch (error) { return null; }
}

function raycastCacheWrite() {
	try {
		localStorage.setItem(RAYCAST_CACHE_KEY, JSON.stringify({
			rev: ecosystemRevision,
			stamp: raycastCacheStamp(),
			// Only the ANSWER is kept, never the geometry: the pairs and their shares. Geometry comes
			// from the read path every time, so nothing here can drift into a stale outline.
			regions: [...raycast.entries()].map(([id, hits]) => [id, hits.map((h) => ({ regionId: h.regionId, name: h.name, kind: h.kind, regionType: h.regionType, share: h.share }))]),
			territories: territoryHits ? [...territoryHits.entries()].map(([id, hits]) => [id, hits.map((h) => ({ publicId: h.territory.publicId, share: h.share }))]) : null,
			// Name/Typ/Elternteil reisen mit -- ohne sie braeuchte schon das ANZEIGEN der Kette beim
			// Oeffnen wieder den Sieben-Zoom-Faecher an den Politik-Layer. Geometrie NICHT: die waere
			// eine alternde Zweitkopie, und fuer die Vorschau wird sie ohnehin frisch geholt.
			territoryIndex: (territories || []).map((t) => ({ publicId: t.publicId, name: t.name, type: t.type, parentId: t.parentId, isAggregate: t.isAggregate })),
			note: raycastNote,
			territoryNote,
		}));
	} catch (error) { /* a full or disabled storage must never break the editor */ }
}

// Rebuilding the maps from the cache needs the territory index, so it runs AFTER the territories
// are loaded. A territory that has since vanished is dropped rather than rendered as a blank.
function raycastCacheApply(cached) {
	raycast = new Map(cached.regions.map(([id, hits]) => [id, hits]));
	raycastNote = cached.note || "";
	territoryNote = cached.territoryNote || "";
	// Der Index kommt aus dem Zwischenspeicher, wenn die Territorien (noch) nicht geladen sind --
	// dann steht die Kette sofort da, ohne den Politik-Layer ueberhaupt anzufassen. Was fehlt, ist
	// nur die Geometrie; die holt erst die Vorschau nach.
	if (cached.territories) {
		const source = (territories && territories.length > 0) ? territories : (cached.territoryIndex || []);
		if (!territories || territories.length === 0) { territories = source; }
		const index = new Map(source.map((territory) => [territory.publicId, territory]));
		territoryHits = new Map(cached.territories.map(([id, hits]) => [
			id,
			hits.map((hit) => ({ territory: index.get(hit.publicId), share: hit.share })).filter((hit) => hit.territory),
		]));
	}
}

async function loadAreas() {
	const response = await fetch(AREAS_API, { credentials: "same-origin", headers: { Accept: "application/json" } });
	const data = await response.json();
	if (!response.ok || data.ok === false) {
		throw new Error((data.error && data.error.message) || ("HTTP " + response.status));
	}
	// 🔴 The kill switch answers first: with app_setting['ecosystem_enabled'] off this endpoint
	// returns an EMPTY list, not an error. Saying so beats showing "no overlaps".
	if (data.ecosystem_enabled === false) {
		throw new Error("Das Landschaftsmodul ist ausgeschaltet — der Lesepfad liefert keine Flächen. Im Menüband einschalten.");
	}
	// The cache key travels with the payload the cache describes -- read here, not separately, so
	// the two can never disagree about which stock was measured.
	ecosystemRevision = Number(data.revision || 0);
	return Array.isArray(data.areas) ? data.areas : [];
}

// V9. Nur hinter dem ausdrücklichen Klick und höchstens einmal je Sitzung -- dieselbe Regel, unter
// der hier schon der Sieben-Zoom-Fächer an den Politik-Layer steht. Rund 1,5 MB gegen die 17,79 MB
// der vollen Kartennutzlast, deshalb ein eigener Endpunkt statt map-features.php.
async function loadPaths() {
	const response = await fetch(PATHS_API, { credentials: "same-origin", headers: { Accept: "application/json" } });
	const data = await response.json();
	if (!response.ok || data.ok === false) {
		throw new Error((data.error && data.error.message) || ("HTTP " + response.status));
	}
	mapRevision = Number(data.map_revision || 0);
	return Array.isArray(data.paths) ? data.paths : [];
}

// 💣 Alle ~200 Wege den Haupt-Thread freigeben. Eine ununterbrochene Schleife friert den Tab ein und
// Chrome bietet irgendwann „Seite reagiert nicht" an -- und ohne die Pause malt der Fortschritt im
// Knopf nie. Gemessen in Node liegt der ganze Lauf bei 0,4 s; das ist genau der Grund, warum die
// echte Zahl im BROWSER gemessen wird und nicht dort.
const PATH_ASSIGN_YIELD_EVERY = 200;

// Beide Bezüge in einem Durchgang je Weg: die rohe Sehne (basis 0, das Maß von Graph, Reisezeit und
// Kantengewichten) und die gezeichnete Catmull-Rom-Kurve (basis 1, das Maß von allem Gezeichneten).
async function computePathAssignments(areas, paths, onProgress) {
	// Jede teilnehmende Fläche EINMAL vorbereiten. Je Weg neu wären das 31.797 Kanten × 5.650 Wege.
	const prepared = areas
		.filter((area) => area.affects_paths !== false)
		.map((area) => ({
			publicId: String(area.public_id),
			bounds: area.bounds,
			edges: ecosystemAreaEdges(area.geometry),
		}))
		.filter((area) => area.edges.length > 0);

	const rows = [];
	const stats = { chordMs: 0, curveMs: 0, chordRows: 0, curveRows: 0, areas: prepared.length, paths: paths.length, skipped: 0 };

	const pass = (coordinates, bounds, pathId, basis) => {
		let written = 0;
		for (let index = 0; index < prepared.length; index += 1) {
			const area = prepared[index];
			if (bounds.min_x > area.bounds.max_x || bounds.max_x < area.bounds.min_x) { continue; }
			if (bounds.min_y > area.bounds.max_y || bounds.max_y < area.bounds.min_y) { continue; }
			const intervals = ecosystemLineIntervals(coordinates, area.edges);
			// 💣 Über 255 Durchquerungen sind eine kaputte Geometrie, kein Ergebnis -- der Server
			// weist sie ab, also darf der Client sie gar nicht erst senden. Gemessenes Maximum: 17.
			if (intervals.length > 255) { stats.skipped += 1; continue; }
			for (let seq = 0; seq < intervals.length; seq += 1) {
				rows.push({
					path: pathId, area: area.publicId, basis, seq,
					enter: intervals[seq].enter, exit: intervals[seq].exit,
				});
				written += 1;
			}
		}
		return written;
	};

	for (let index = 0; index < paths.length; index += 1) {
		const path = paths[index];
		const coordinates = path.geometry && path.geometry.coordinates;
		if (!Array.isArray(coordinates) || coordinates.length < 2) { continue; }

		let started = performance.now();
		stats.chordRows += pass(coordinates, ecosystemLineBounds(coordinates), path.public_id, 0);
		stats.chordMs += performance.now() - started;

		// 💣 Die Kurve bekommt ihre EIGENE Hülle. Sie weicht bis zu 2,12 Karteneinheiten von der
		// Sehne ab und ragt damit aus deren Hülle heraus; mit der rohen Hülle fielen genau die Paare
		// weg, die nur die Kurve trifft (gemessen: 4).
		const smoothed = coordinates.length >= 3 ? getCatmullRomSplineCoordinates(coordinates) : coordinates;
		started = performance.now();
		stats.curveRows += pass(smoothed, ecosystemLineBounds(smoothed), path.public_id, 1);
		stats.curveMs += performance.now() - started;

		if (index % PATH_ASSIGN_YIELD_EVERY === 0) {
			if (onProgress) { onProgress(index, paths.length); }
			await new Promise((resolve) => setTimeout(resolve, 0));
		}
	}

	return { rows, stats };
}

// ---- V9: das Ergebnis speichern -----------------------------------------------------------------
// Gestückelt, und zwar von Anfang an: heute sind die drei Ergebnisse zusammen 1,3 MB (gemessen im
// Browser), beim ausgezeichneten Bestand ein Vielfaches. Die Stückelung hält JEDE einzelne Anfrage
// klein, ganz gleich wie der Bestand wächst -- und sie ist der Grund, warum es serverseitig gar
// keinen Stapellauf braucht.
const ASSIGNMENT_CHUNK = 2000;

// Die beiden vorhandenen Zuordnungen behalten ihre Form im Speicher; das hier ist nur die
// Übersetzung aufs Kabel. `raycast` führt jedes Paar ohnehin doppelt (a→b und b→a), und genau das
// speichert ecosystem_region_overlap: ein Leser fragt immer „was liegt in DIESER Region".
// 💣 Der Anteil kann knapp über 1 liegen. Am Livebestand nachgemessen (2026-07-29): **5 Paare von
// 647 Regionen**, das höchste bei **100,7 %** -- „Aventurien × See-133", „Orkland × See-116" und
// drei weitere derselben Sorte. Das ist **Rundung im Verschnitt**, nicht Doppelzählung: ein See,
// der vollständig in einer größeren Fläche liegt, liefert eine Schnittfläche, die minimal größer
// ausfällt als der See selbst, und der Quotient kippt über 100 %.
//
// Die Anzeige zeigt das seit jeher so („100,7 %"); bemerkt hat es erst der Server, weil er „ein
// Anteil ist ein Bruchteil" ernst nimmt. Genau dafür ist die Prüfung da.
//
// Gekappt statt durchgereicht: bei einem Rundungsrest ist 1,0 die wahre Aussage. Gezählt statt
// verschwiegen -- der Knopf sagt hinterher, wie oft. Steigt die Zahl je deutlich über eine Handvoll,
// ist es NICHT mehr Rundung und die Ursache gehört gesucht.
let shareClamped = 0;
function clampShare(value) {
	const share = Number(value);
	if (!Number.isFinite(share)) { return null; }
	if (share > 1) { shareClamped += 1; return 1; }
	return share < 0 ? 0 : share;
}

function overlapRowsFromRaycast() {
	const out = [];
	(raycast || new Map()).forEach((hits, regionId) => {
		hits.forEach((hit) => {
			const share = clampShare(hit.share);
			if (share === null) { return; }
			out.push({ region: regionId, other: hit.regionId, share });
		});
	});
	return out;
}

function territoryRowsFromHits() {
	const out = [];
	(territoryHits || new Map()).forEach((hits, regionId) => {
		hits.forEach((hit) => {
			if (!hit.territory || !hit.territory.publicId) { return; }
			// Dieselbe Rechnung, derselbe Rundungsrest -- hier gegen die Territoriumsfläche statt gegen eine
			// zweite Region, aber die Kappung gilt aus demselben Grund.
			const share = clampShare(hit.share);
			if (share === null) { return; }
			out.push({
				region: regionId, territory: hit.territory.publicId,
				share, aggregate: hit.territory.isAggregate === true,
			});
		});
	});
	return out;
}

async function saveAssignments(pathRows, overlapRows, territoryRows, durationMs, onProgress) {
	const begun = await ecoPost("assignment_begin", {});
	const runToken = String(begun.run_token || "");
	if (runToken === "") { throw new Error("Der Server hat kein Lauf-Kennzeichen geliefert."); }

	const batches = [];
	const slice = (kind, list) => {
		for (let index = 0; index < list.length; index += ASSIGNMENT_CHUNK) {
			batches.push({ kind, rows: list.slice(index, index + ASSIGNMENT_CHUNK) });
		}
	};
	slice("overlap", overlapRows);
	slice("territory", territoryRows);
	slice("path", pathRows);

	let skipped = 0;
	for (let index = 0; index < batches.length; index += 1) {
		if (onProgress) { onProgress(index + 1, batches.length); }
		const result = await ecoPost("assignment_chunk", {
			run_token: runToken, kind: batches[index].kind, rows: batches[index].rows,
		});
		skipped += Number(result.skipped || 0);
	}

	// 💣 Der Abschluss läuft AUCH, wenn nichts zu schreiben war. Der Stempel ist das, was „gerechnet"
	// sagt, und ein leeres Ergebnis ist ein Ergebnis -- ohne ihn meldete der nächste Aufruf „noch
	// nicht gerechnet" und der Lauf begänne ewig von vorn.
	const status = await ecoPost("assignment_commit", {
		run_token: runToken,
		duration_ms: Math.round(durationMs),
		area_count: (allAreas || []).length,
		path_count: (allPaths || []).length,
	});
	return { status, skipped, batches: batches.length };
}

// Die Kachel IST die Zustandsanzeige (Hausregel). „veraltet" ist ein Vergleich, nie eine Vermutung:
// der Stempel trägt die Revisionen, gegen die gerechnet wurde, und der Server liefert die aktuellen
// gleich mit.
function renderAssignmentTile() {
	const info = $("ecoRaycastInfo");
	if (!info) { return; }
	const stamp = assignmentStamp && assignmentStamp.stamp;
	if (!stamp || !stamp.completed) {
		info.textContent = stamp ? "unvollständig — bitte neu rechnen" : "noch nicht gerechnet";
		return;
	}
	const current = assignmentStamp.current || {};
	const stale = stamp.ecosystem_revision !== current.ecosystem_revision
		|| stamp.map_revision !== current.map_revision;
	if (stale) {
		info.textContent = "gerechnet " + String(stamp.computed_at).slice(11, 16) + " · Stand veraltet";
		return;
	}
	const wegabschnitte = stamp.path_rows_chord + stamp.path_rows_curve;
	info.textContent = wegabschnitte + " Wegabschnitte · "
		+ (stamp.duration_ms / 1000).toFixed(1).replace(".", ",") + " s";
}

// 🔴 EINE ANFRAGE JE FLÄCHE (Spec §3.3). 78 Flächen wären 5,25 MB roh und 7,0 MB base64 -- über
// dem üblichen `post_max_size` von 8 MB. Je Fläche sind es höchstens 286 KB roh. Und ein Abbruch
// entwertet dann nicht den ganzen Bestand, sondern lässt die schon geschriebenen Flächen stehen.
async function runHeightmaps() {
	const tile = $("ecoHeightmap");
	const info = $("ecoHeightmapInfo");
	tile.disabled = true;
	const started = Date.now();
	try {
		setStatus("Flächen werden geladen …");
		if (allAreas === null) { allAreas = await loadAreas(); }
		if (allPeaks === null) {
			setStatus("Gipfel werden geladen …");
			allPeaks = await loadPeaks();
		}

		// Die Gebirgsflächen -- dieselbe Weiche wie in map-features-ecosystem-height-render.js.
		// 💣 Sie steht damit an drei Stellen (Karte, Editor, terrain-store.php). Das ist der Preis
		// dafür, dass die Karte kein Editor-Modul lädt; wer `huegelland` aufmacht, macht es dreimal.
		const gebirge = (allAreas || []).filter((area) =>
			area && area.kind === "topographie" && String(area.region_type || "") === "gebirge");
		if (gebirge.length === 0) {
			info.textContent = "keine Gebirgsfläche vorhanden";
			flashStatus("Es gibt keine Gebirgsfläche — nichts zu rastern.", "ok");
			return;
		}

		// 🔴 EIN Fenster über ALLE Gipfel ALLER Flächen, und die Zuteilung je kleinster enthaltender
		// Fläche -- genau der Stapel, den die Karte baut. Ein je Fläche gebautes Fenster wäre wertlos,
		// weil der Nachbargipfel dann nicht mitzählte.
		const stack = buildEcosystemHeightStack(gebirge, (allPeaks || []).map((peak) => ({
			publicId: peak.public_id, x: peak.x, y: peak.y, height: peak.height_schritt,
		})));

		await ecoPost("heightmap_cleanup", {});

		let written = 0;
		let skipped = 0;
		let bytes = 0;
		for (let index = 0; index < stack.fields.length; index++) {
			const field = stack.fields[index];
			const areaId = stack.areaIdsByField[index];
			const area = gebirge.find((candidate) => String(candidate.public_id) === areaId);
			if (!area || !area.bounds) { continue; }
			const label = (area.region_name || areaId);
			const grid = ecosystemHeightmapGrid(area.bounds, 0.25);
			// 💣 Der Fortschritt steht IM KNOPF, und der Haupt-Thread wird je Zeilenband freigegeben.
			// Hochgerechnet aus der V8-Messung (203.520 Rasterpunkte = 249 ms): 529.531 Pixel bei 15
			// Flächen, 1,4 Mio bei 40 -- ohne Freigabe sind das mehrere Sekunden eingefrorener Tab.
			const samples = await rasterizeEcosystemHeightField(field, stack.peakWindow, grid, {
				onRowBand: (done, total) => {
					info.textContent = "Raster " + (index + 1) + "/" + stack.fields.length
						+ " · " + label + " · " + done + "/" + total;
				},
			});
			const result = await ecoPost("heightmap_put", {
				area: areaId,
				cell_size: grid.cellSize,
				origin_x: grid.originX,
				origin_y: grid.originY,
				width: grid.width,
				height: grid.height,
				samples: ecosystemHeightmapToBase64(samples),
			});
			written += Number(result.written || 0);
			skipped += Number(result.skipped || 0);
			bytes += Number(result.stored_bytes || 0);
		}

		heightmapStatus = await ecoPost("heightmap_status", {});
		renderHeightmapTile();
		const seconds = ((Date.now() - started) / 1000).toFixed(1).replace(".", ",");
		flashStatus(written + " Raster gespeichert (" + Math.round(bytes / 1024) + " KB) in " + seconds + " s"
			+ (skipped > 0 ? " · " + skipped + " Fläche(n) verschwunden" : ""), "ok");
	} catch (error) {
		info.textContent = "fehlgeschlagen";
		flashStatus("Höhenraster: " + (error && error.message ? error.message : String(error)), "error");
	} finally {
		tile.disabled = false;
	}
}

// Die Kachel IST die Zustandsanzeige. „veraltet" ist ein Vergleich, keine Vermutung: der Server
// rechnet beide Fingerabdrücke neu und stellt sie dem Stempel gegenüber.
//
// ⚠️ Die Gipfelzahl steht mit dabei, weil sie die Aussagekraft begrenzt: heute tragen 16 von 67
// Gipfeln eine Höhe, und ein Raster ohne Gipfelhöhen rechnet mit der Vorgabe 5.000, nicht mit
// erfassten Daten.
function renderHeightmapTile() {
	const info = $("ecoHeightmapInfo");
	if (!info || !heightmapStatus) { return; }
	const total = Number(heightmapStatus.area_count || 0);
	const missing = Number(heightmapStatus.missing || 0);
	const stale = Number(heightmapStatus.stale || 0);
	if (total === 0) { info.textContent = "keine Gebirgsfläche vorhanden"; return; }
	if (missing === total) { info.textContent = "noch nicht gerechnet · " + total + " Flächen"; return; }
	const parts = [(total - missing - stale) + "/" + total + " Raster"];
	if (stale > 0) { parts.push("**" + stale + " veraltet**".replace(/\*\*/g, "")); }
	if (missing > 0) { parts.push(missing + " fehlen"); }
	parts.push(heightmapStatus.peaks_with_height + "/" + heightmapStatus.peaks_total + " Gipfel mit Höhe");
	info.textContent = parts.join(" · ");
}

function rowByKey(key) { return rows.find((row) => row.key === key) || null; }

function percent(share) { return (share * 100).toFixed(1).replace(".", ",") + " %"; }

const KIND_LABEL = { derographisch: "Derographische Region", vegetation: "Vegetation", topographie: "Topographie" };

// ---- Editing a region (Name · Auto-Name · Art · Wiki-Zuweisung) -------------------------------
// The server side already existed: `update_region` takes name / region_type / kind / wiki_url and is
// a PARTIAL write -- it only touches the fields actually present in the payload. Nothing new was
// needed on the backend; column 2 was simply read-only.

// The Art vocabulary of ONE layer. Two separate lists, never one filtered list: a topographic region
// can never become „Sumpf" (ecosystem_region_type.kind). The server checks the same pair and answers
// 400 otherwise, so this select is convenience, not the guard.
function typesOfKind(kind) {
	return regionTypes.filter((type) => String(type.kind) === String(kind));
}

// The auto-name is built from the Art's LABEL, not its key -- „Wald-001", not „wald-001".
function artLabelOf(region) {
	const match = typesOfKind(region.kind).find((type) => type.type_key === String(region.region_type || ""));
	return match ? match.label : "";
}

// Every region name currently loaded, so a fresh auto-name never collides with one already taken.
function allRegionNames() {
	return rows.flatMap((row) => row.regions.map((region) => String(region.name || "")));
}

function regionEditBlock(region) {
	const artLabel = artLabelOf(region);
	const auto = isEcosystemRegionAutoName(region.name, artLabel);
	// 🔴 A wiki landscape OWNS the name (Verhaltensdoku §7d, row 3): the checkbox is disabled, not
	// hidden, and the field stays writable.
	const wikiOwns = String(region.wiki_url || "") !== "";
	const areaCount = Number(region.area_count || 0);
	const options = ['<option value="">— ohne Art —</option>'].concat(typesOfKind(region.kind).map((type) =>
		'<option value="' + esc(type.type_key) + '"' + (type.type_key === String(region.region_type || "") ? " selected" : "") + ">" + esc(type.label) + "</option>"));

	return '<div class="eco-edit" data-region="' + esc(region.public_id) + '">'
		+ '<div class="dt-grp">' + esc(KIND_LABEL[region.kind] || region.kind)
		+ ' <span class="avm-pill">' + areaCount + (areaCount === 1 ? " Fläche" : " Flächen") + "</span></div>"
		+ '<div class="dt-grid">'
		+ '<div class="k">Name</div><div><input type="text" data-f="name" value="' + esc(region.name) + '"' + (auto ? " readonly" : "") + "></div>"
		+ '<div class="k">Auto-Name</div><div><label class="dt-check"><input type="checkbox" data-f="auto"' + (auto ? " checked" : "") + (wikiOwns ? " disabled" : "") + ">"
		+ "<span>" + (wikiOwns ? "die Wiki-Landschaft besitzt den Namen" : "interner Griff — ein Leser sieht die Art") + "</span></label></div>"
		+ '<div class="k">Art</div><div><select data-f="type">' + options.join("") + "</select></div>"
		+ '<div class="k">Wiki-Artikel</div><div><input type="url" data-f="wiki" placeholder="https://de.wiki-aventurica.de/wiki/…" value="' + esc(region.wiki_url || "") + '">'
		+ '<div class="pl-hint">' + (region.wiki_region_key ? "Schlüssel <b>" + esc(region.wiki_region_key) + "</b> — vom Server aus der URL abgeleitet" : "ohne Wiki-Eintrag — ein gültiger Zustand") + "</div></div>"
		+ "</div>"
		+ '<div class="dt-actions"><button type="button" data-a="save">Speichern</button>'
		+ '<button type="button" data-a="wiki-clear"' + (region.wiki_url ? "" : " disabled") + ">Wiki-Zuweisung entfernen</button>"
		+ '<span class="dt-msg"></span></div>'
		+ "</div>";
}

function wireEditBlocks(host) {
	host.querySelectorAll(".eco-edit").forEach((block) => {
		const publicId = block.getAttribute("data-region");
		const region = rows.flatMap((row) => row.regions).find((entry) => String(entry.public_id) === publicId);
		if (!region) { return; }
		const field = (name) => block.querySelector('[data-f="' + name + '"]');
		const message = block.querySelector(".dt-msg");
		// 💣 `wiki_url` travels ONLY when someone touched it. update_region writes exactly the fields
		// in the payload, so an always-sent empty field would silently delete an existing assignment.
		let wikiTouched = false;

		const applyAutoName = () => {
			const artLabel = (() => {
				const match = typesOfKind(region.kind).find((type) => type.type_key === field("type").value);
				return match ? match.label : "";
			})();
			if (field("auto").checked) {
				field("name").value = nextEcosystemRegionAutoName(artLabel, allRegionNames());
				field("name").readOnly = true;
			} else {
				field("name").readOnly = false;
			}
		};

		field("auto").addEventListener("change", applyAutoName);
		// „ein Artwechsel zieht den Griff mit" (§7d): with the checkbox on, changing the Art renames.
		field("type").addEventListener("change", () => { if (field("auto").checked) { applyAutoName(); } });
		field("wiki").addEventListener("input", () => { wikiTouched = true; });

		block.querySelector('[data-a="wiki-clear"]').addEventListener("click", () => {
			field("wiki").value = "";
			wikiTouched = true;   // deliberate: an empty wiki_url IS the way back (Verhaltensdoku §7a)
			field("auto").disabled = false;
			message.textContent = "Zuweisung wird beim Speichern entfernt.";
			message.className = "dt-msg";
		});

		block.querySelector('[data-a="save"]').addEventListener("click", async () => {
			const button = block.querySelector('[data-a="save"]');
			const payload = {
				public_id: publicId,
				name: field("name").value.trim(),
				region_type: field("type").value,
			};
			// 🔴 Only wiki_url -- never wiki_region_key. The server derives the key from the URL
			// (avesmapsEcosystemWikiRegionKey); a client-sent key is not read at all.
			if (wikiTouched) { payload.wiki_url = field("wiki").value.trim(); }
			if (payload.name === "") {
				message.textContent = "Ein Name ist Pflicht.";
				message.className = "dt-msg bad";
				return;
			}
			button.disabled = true;
			message.textContent = "Wird gespeichert …";
			message.className = "dt-msg";
			try {
				await ecoPost("update_region", payload);
				message.textContent = "Gespeichert.";
				message.className = "dt-msg ok";
				// Re-read rather than patch the local copy: names, keys and area counts all move, and
				// the list, the raycast partners and the search index read from the same rows.
				await loadData({ keepSelection: true });
			} catch (error) {
				// The kind/region_type pair is checked server-side (400) -- that message is the useful
				// one, so it is shown rather than replaced.
				message.textContent = "Speichern fehlgeschlagen: " + (error && error.message ? error.message : String(error));
				message.className = "dt-msg bad";
			} finally {
				button.disabled = false;
			}
		});
	});
}

function renderDetail() {
	const host = $("ecoDetail");
	const row = rowByKey(selectedKey);
	if (!row) {
		host.innerHTML = '<div class="avm-empty">' + esc(t("ecosystem.editor.pickRegion", "Links eine Region wählen.")) + "</div>";
		return;
	}
	// Spec §3.5: Wappen → Bilder → Identität → Rest → Quellen. No coat and no images on a landscape
	// region, so the order starts at Identität.
	const parts = ['<div class="dt-grp">Identität</div><div class="dt-grid">'];
	parts.push('<div class="k">Name</div><div>' + esc(row.name) + "</div>");
	parts.push('<div class="k">Auto-Name</div><div>' + (isAutoName(row) ? "ja — interner Griff" : "nein") + "</div>");
	parts.push('<div class="k">Art (Wiki)</div><div>' + (row.art ? esc(row.art) : "—") + "</div>");
	parts.push('<div class="k">Kontinent</div><div>' + esc(row.continent) + "</div>");
	parts.push('<div class="k">Map-Darstellung</div><div>' + esc(DISPLAY_LABEL[displayOf(row)]) + "</div>");
	parts.push("</div>");

	parts.push('<div class="dt-grp">Wiki-Landschaft</div><div class="dt-grid">');
	if (row.wikiKey === "") {
		// Not a defect: origin='own' is for areas that exist here and not in the wiki
		// (docs/oekosystem-editor-verhalten.md §7).
		parts.push('<div class="k">Zuweisung</div><div>ohne Wiki-Eintrag</div>');
	} else {
		parts.push('<div class="k">Schlüssel</div><div>' + esc(row.wikiKey) + (row.orphanKey ? ' <span class="avm-pill avm-pill--unresolved">keine Wiki-Zeile</span>' : "") + "</div>");
		if (row.wikiUrl) {
			parts.push('<div class="k">Artikel</div><div><a class="dt-link" href="' + esc(row.wikiUrl) + '" target="_blank" rel="noopener">' + esc(row.name) + " ↗</a></div>");
		}
	}
	parts.push("</div>");

	// ---- Editable: ONE block per region (owner decision 2026-07-27) ----------------------------
	// 💣 A list row may carry SEVERAL regions -- „Blautann" and „Blautann-Nord" share one wiki key.
	// One shared form would make „rename" ambiguous, and that is exactly the trap the owner hit on
	// 2026-07-27: the name sits on the REGION, and a region carries many areas, so renaming the
	// wrong one hits every area under it. Each region therefore gets its own block and its own save.
	if (row.regions.length === 0) {
		parts.push('<div class="dt-grp">Flächen</div><div class="dt-grid">');
		parts.push('<div class="k">Gezeichnet</div><div>keine — steht in der Liste, ist auf der Karte nicht da. Bearbeiten lässt sich hier nichts: es gibt keine Landschaftsregion, die die Felder tragen könnte.</div>');
		parts.push("</div>");
	} else {
		row.regions.forEach((region) => parts.push(regionEditBlock(region)));
	}

	// „Liegt in" -- the same raycast against the political territories. Shown as a CHAIN, because a
	// hit barony implies its county and realm (owner 2026-07-28: „2-3 Baronien, 1 Grafschaft,
	// 1 Reich"). Listing every ancestor as its own flat entry would say the same thing four times.
	parts.push('<div class="dt-grp">Liegt in</div>');
	if (territoryHits === null) {
		parts.push('<div class="avm-empty">Noch nicht gerechnet — „Zugehörigkeit rechnen" im Menüband.</div>');
	} else if (row.areaCount === 0) {
		parts.push('<div class="avm-empty">Ohne gezeichnete Fläche gibt es nichts zu verschneiden.</div>');
	} else {
		const index = new Map((territories || []).map((territory) => [territory.publicId, territory]));
		const hits = [];
		const seenTerritories = new Set();
		row.regions.forEach((region) => (territoryHits.get(String(region.public_id)) || []).forEach((hit) => {
			if (seenTerritories.has(hit.territory.publicId)) { return; }
			seenTerritories.add(hit.territory.publicId);
			hits.push(hit);
		}));
		// Show the DEEPEST hits and let the ancestors ride along as their chain. A hit whose own
		// CHILD was also hit is that child's ancestor and would otherwise be named twice -- once as
		// its own entry and once inside the chain below it.
		const hitParentIds = new Set(hits.map((hit) => hit.territory.parentId).filter(Boolean));
		const leaves = hits.filter((hit) => !hitParentIds.has(hit.territory.publicId));
		leaves.sort((a, b) => b.share - a.share);
		if (leaves.length === 0) {
			parts.push('<div class="avm-empty">Kein Territorium über ' + Math.round(RAYCAST_THRESHOLD * 100) + " %.</div>");
		} else {
			parts.push('<div class="eco-partners">' + leaves.map((hit) => {
				const chain = territoryChain(hit.territory, index)
					.map((ancestor) => esc(territoryLabel(ancestor))).join(" ← ");
				// A BUTTON, like a shared region: picking it drives the intersection preview in
				// column 3. Owner 2026-07-28 -- „liegt in liefert noch keine Schnittmenge".
				return '<button type="button" class="eco-terr'
					+ (hit.territory.publicId === selectedPartnerId && selectedPartnerKind === "territory" ? " is-selected" : "")
					+ '" data-territory="' + esc(hit.territory.publicId) + '">'
					+ '<div class="eco-terr__head"><span class="eco-partner__name">'
					+ esc(territoryLabel(hit.territory)) + "</span>"
					+ (hit.territory.isAggregate ? '<span class="avm-pill">Aggregat</span>' : "")
					+ '<span class="eco-partner__share">' + percent(hit.share) + "</span></div>"
					+ (chain ? '<div class="eco-terr__chain">↳ ' + chain + "</div>" : "")
					+ "</button>";
			}).join("") + "</div>");
		}
	}

	// „Gemeinsame Regionen mit" -- the raycast result. Every entry is a BUTTON that picks the pair
	// and drives column 3.
	parts.push('<div class="dt-grp">Gemeinsame Regionen mit</div>');
	if (raycast === null) {
		parts.push('<div class="avm-empty">Noch nicht gerechnet — „Zugehörigkeit rechnen" im Menüband.</div>');
	} else if (row.areaCount === 0) {
		// areaCount, NOT regions.length: a region row WITHOUT active areas exists in the list and not
		// on the map. "Keine Überschneidung" would claim it had been compared -- it had nothing to
		// compare with.
		parts.push('<div class="avm-empty">Ohne gezeichnete Fläche gibt es nichts zu verschneiden.</div>');
	} else {
		const partners = [];
		const seen = new Set();
		row.regions.forEach((area) => (raycast.get(String(area.public_id)) || []).forEach((hit) => {
			if (seen.has(hit.regionId)) { return; }
			seen.add(hit.regionId);
			partners.push(hit);
		}));
		partners.sort((a, b) => b.share - a.share);
		if (partners.length === 0) {
			parts.push('<div class="avm-empty">Keine Überschneidung über ' + Math.round(RAYCAST_THRESHOLD * 100) + " %.</div>");
		} else {
			parts.push('<div class="eco-partners">' + partners.map((hit) =>
				'<button type="button" class="eco-partner' + (hit.regionId === selectedPartnerId ? " is-selected" : "") + '" data-partner="' + esc(hit.regionId) + '">'
				+ '<span class="eco-partner__name">' + esc(hit.name) + "</span>"
				+ '<span class="eco-partner__meta">' + esc(KIND_LABEL[hit.kind] || hit.kind) + "</span>"
				+ '<span class="eco-partner__share">' + percent(hit.share) + "</span></button>").join("") + "</div>");
		}
	}
	host.innerHTML = parts.join("");
	wireEditBlocks(host);
	host.querySelectorAll(".eco-terr").forEach((button) => {
		button.addEventListener("click", () => {
			selectedPartnerId = button.getAttribute("data-territory");
			selectedPartnerKind = "territory";
			// Same reason as the region partners: a full renderDetail would discard whatever is
			// being typed in the edit blocks above. Only the selected state moves.
			host.querySelectorAll(".eco-terr").forEach((other) => other.classList.toggle("is-selected", other === button));
			host.querySelectorAll(".eco-partner").forEach((other) => other.classList.remove("is-selected"));
			renderPreview();
		});
	});
	host.querySelectorAll(".eco-partner").forEach((button) => {
		button.addEventListener("click", () => {
			selectedPartnerId = button.getAttribute("data-partner");
			selectedPartnerKind = "region";
			host.querySelectorAll(".eco-terr").forEach((other) => other.classList.remove("is-selected"));
			// ⚠️ Deliberately NOT renderDetail(): a full rebuild would throw away whatever is being
			// typed in the edit blocks above. Only the selected state moves.
			host.querySelectorAll(".eco-partner").forEach((other) => other.classList.toggle("is-selected", other === button));
			renderPreview();
		});
	});
}

// Auto-name: DERIVED from the name, never loaded -- "<Art>-<Zahl>" or it is not one. A stored column
// would be a second truth about the same thing (Verhaltensdoku §7d).
// ⚠️ The pattern is built from the Art's LABEL ("Wald-001"), not its key ("wald"). Delegated to the
// shared, unit-tested isEcosystemRegionAutoName rather than re-derived here -- a second regex for
// the same rule is how the two drift apart.
function isAutoName(row) {
	return row.regions.some((region) => isEcosystemRegionAutoName(region.name, artLabelOf(region)));
}

// ---- Column 3: intersection preview + Vorkommen ----------------------------------------------
// 🪤 The TEMPLATE is the territory preview (js/territory/territory-derived-geometry-editor.js:576),
// and it is a POLITICAL file: copied, never called (main plan, rule 1). Two differences on purpose:
// there it was always a UNION, here it is the INTERSECTION of the chosen pair; and the colours come
// from tokens instead of the hardcoded rgba() over there (AGENTS.md §12).
function geometryToSvg(geometry, width, height, padding) {
	// ⚠️ ecosystemGeometryBounds returns snake_case -- {min_x, min_y, max_x, max_y}, the same shape
	// the API's `bounds` field carries -- and null for an empty geometry. Reading it as {minX, …}
	// yields a path of NaN that still renders as an empty <svg>: silent, and invisible in a
	// screenshot.
	const bounds = ecosystemGeometryBounds(geometry);
	if (!bounds) { return ""; }
	const spanX = Math.max(0.000001, bounds.max_x - bounds.min_x);
	const spanY = Math.max(0.000001, bounds.max_y - bounds.min_y);
	const scale = Math.min((width - padding * 2) / spanX, (height - padding * 2) / spanY);
	// GeoJSON y points up, SVG y points down -- flipped here, consciously (AGENTS.md §5).
	const project = (position) => [
		padding + (Number(position[0]) - bounds.min_x) * scale,
		height - padding - (Number(position[1]) - bounds.min_y) * scale,
	];
	return ecosystemGeometryParts(geometry).map((part) => part.map((ring) =>
		"M" + ring.map((position) => project(position).map((n) => n.toFixed(2)).join(" ")).join("L") + "Z"
	).join(" ")).join(" ");
}

// 💣 row.regions holds ecosystem_region rows (from list_regions) -- they carry NO geometry and no
// bounds. The drawn areas live in the payload of api/app/ecosystem-areas.php, so both sides of the
// pair are looked up there by region_public_id.
function areasOfRegions(regionRows) {
	const ids = new Set(regionRows.map((region) => String(region.public_id)));
	return (allAreas || []).filter((area) => ids.has(String(area.region_public_id)));
}

// The partner is either another landscape region (its pieces live in allAreas) or a political
// territory (one geometry, in `territories`). Same intersection either way -- only the lookup
// differs, which is why the KIND has to travel with the id: a territory public_id would silently
// find nothing in allAreas and the preview would just stay empty.
function pairIntersection(regionRows, partnerId, partnerKind) {
	const ownAreas = areasOfRegions(regionRows);
	const partnerAreas = partnerKind === "territory"
		? (territories || []).filter((territory) => String(territory.publicId) === String(partnerId) && territory.geometry)
			.map((territory) => ({ geometry: territory.geometry, bounds: territory.bounds }))
		: (allAreas || []).filter((area) => String(area.region_public_id) === String(partnerId));
	const pieces = [];
	ownAreas.forEach((own) => partnerAreas.forEach((other) => {
		if (!boundsOverlap(own.bounds, other.bounds)) { return; }
		try { pieces.push(ecosystemBooleanGeometry("intersection", own.geometry, other.geometry)); } catch (error) { /* empty overlap */ }
	}));
	if (pieces.length === 0) { return null; }
	return pieces.reduce((merged, piece) => (merged === null ? piece : ecosystemBooleanGeometry("union", merged, piece)), null);
}

// The bridge Vorkommen <-> Region runs over political_territory_wiki.geographic
// (api/_internal/app/lore.php:599). 💣 The editor does NOT touch that table -- it calls the existing
// public read path. Parameter (verified): ?place=<wiki_key WITHOUT the "wiki:" prefix, lowercased>,
// exactly what avesmapsLoreNormalizeKey (map-features-lore.js:91) produces; &full=1 for whole lists.
function loreKeyOf(row) {
	const key = String(row.wikiKey || "").trim().toLowerCase().replace(/^wiki:/, "").replace(/^name:/, "");
	return /^[a-z0-9_-]{1,190}$/.test(key) ? key : "";
}

const LORE_ROWS = [
	{ kind: "ware", label: "Waren" },
	{ kind: "fauna", label: "Fauna" },
	{ kind: "flora", label: "Flora" },
];

async function loadLore(row) {
	const key = loreKeyOf(row);
	if (key === "") { return null; }
	const response = await fetch("/api/app/lore.php?place=" + encodeURIComponent(key), { credentials: "same-origin", headers: { Accept: "application/json" } });
	const data = await response.json();
	return (data && data.ok === true) ? data : null;
}

function renderLoreInto(host, row, data) {
	if (!data || !data.total) {
		host.innerHTML = '<div class="avm-empty">Keine Vorkommen zu „' + esc(row.name) + '“.</div>';
		return;
	}
	host.innerHTML = LORE_ROWS.map((entry) => {
		const list = (data.sections && data.sections[entry.kind]) || [];
		if (list.length === 0) { return ""; }
		const count = (data.counts && data.counts[entry.kind]) || list.length;
		return '<div class="dt-grp">' + entry.label + ' <span class="avm-pill">' + count + "</span></div>"
			+ '<div class="avm-row__l2" style="white-space:normal;">'
			+ list.map((item) => esc(String(item.name || item.titel || ""))).filter(Boolean).join(" · ") + "</div>";
	}).join("") || '<div class="avm-empty">Keine Vorkommen zu „' + esc(row.name) + '“.</div>';
}

function renderPreview() {
	const host = $("ecoPreview");
	const row = rowByKey(selectedKey);
	if (!row) {
		host.innerHTML = '<div class="avm-empty">' + esc(t("ecosystem.editor.pickRegion", "Links eine Region wählen.")) + "</div>";
		return;
	}
	const parts = [];
	parts.push('<div class="dt-grp">Schnittmenge</div>');
	if (!selectedPartnerId) {
		parts.push('<div class="avm-empty">In Spalte 2 eine gemeinsame Region wählen.</div>');
	} else {
		let geometry = null;
		try { geometry = pairIntersection(row.regions, selectedPartnerId, selectedPartnerKind); } catch (error) { geometry = null; }
		const partnerGeometryMissing = selectedPartnerKind === "territory"
			&& !(territories || []).some((territory) => String(territory.publicId) === String(selectedPartnerId) && territory.geometry);
		if (partnerGeometryMissing) {
			// The remembered answer carries names and shares, not outlines -- deliberately, so no
			// ageing copy of a boundary can sit here. Drawing this one needs the geometry fetched.
			parts.push('<div class="avm-empty">Für die Vorschau fehlt die Geometrie dieses Territoriums — „Zugehörigkeit rechnen" holt sie.</div>');
		} else if (!geometry) {
			parts.push('<div class="avm-empty">Keine Schnittfläche.</div>');
		} else {
			parts.push('<div class="eco-thumb"><svg viewBox="0 0 200 130" role="img" aria-label="Schnittmenge der beiden Regionen">'
				+ '<path d="' + geometryToSvg(geometry, 200, 130, 8) + '" /></svg></div>');
			parts.push('<div class="avm-row__l2">Fläche ' + Math.abs(ecosystemGeometryArea(geometry)).toFixed(2) + " Karteneinheiten²</div>");
		}
	}
	parts.push('<div class="dt-grp">Vorkommen</div><div id="ecoLore"><div class="avm-empty">Wird geladen…</div></div>');
	host.innerHTML = parts.join("");

	const loreHost = $("ecoLore");
	if (loreKeyOf(row) === "") {
		loreHost.innerHTML = '<div class="avm-empty">Ohne Wiki-Eintrag gibt es keinen Ortsschlüssel — und damit nichts nachzuschlagen.</div>';
		return;
	}
	const requestedFor = selectedKey;
	loadLore(row).then((data) => {
		if (selectedKey !== requestedFor) { return; }   // a later selection has overtaken this one
		renderLoreInto(loreHost, row, data);
	}).catch(() => {
		if (selectedKey !== requestedFor) { return; }
		loreHost.innerHTML = '<div class="avm-empty">Vorkommen konnten nicht geladen werden.</div>';
	});
}

// ---- Ribbon ----------------------------------------------------------------------------------
function wireRibbon() {
	// Syncen delegates to the SAME machinery the tab's (now-hidden) "🚨 Syncen" button drove --
	// window.parent.startWikiSyncKindSync("region") -- so there is exactly one sync_kind client loop
	// in the app and not a second copy here. It has to live in this ribbon at all because the
	// subject now shows the editor button INSTEAD of its sync button (wikiSyncSubjectButtonId returns
	// one button per subject); same move the settlement and powerline editors made.
	//
	// ⚠️ startWikiSyncKindSync returns NOTHING and swallows its own errors (review-wiki-sync.js:1602
	// catches and reports). So this line cannot tell success from failure and does not pretend to --
	// the real outcome message rides the parent's toast (setWikiSyncStatus -> showFeedbackToast),
	// which overlays instead of pushing. Identical handling to handleSeSyncenClick in
	// html/wiki-sync-settlement-editor.html:2195; do not "fix" it here alone.
	$("ecoSync").addEventListener("click", async () => {
		let parentWindow;
		try { parentWindow = window.parent; } catch (error) { parentWindow = null; }
		if (!parentWindow || parentWindow === window || typeof parentWindow.startWikiSyncKindSync !== "function") {
			flashStatus("Syncen ist nur im eingebetteten Editor verfügbar (nicht standalone geöffnet).", "bad");
			return;
		}
		$("ecoSync").disabled = true;
		try {
			setStatus("🚨 Syncen (region) läuft …");
			await parentWindow.startWikiSyncKindSync("region");
			flashStatus("Syncen (region) abgeschlossen.", "ok");
		} catch (error) {
			flashStatus("Syncen (region) fehlgeschlagen: " + (error && error.message ? error.message : String(error)), "bad");
		} finally {
			$("ecoSync").disabled = false;
		}
	});

	// „Zugehörigkeit rechnen" recomputes unconditionally. Opening the editor reuses a cached answer
	// for the SAME ecosystem_revision instead (runRaycast without force), so the common case costs no
	// clipping and no political-layer fan-out at all.
	$("ecoRaycast").addEventListener("click", () => { void runRaycast({ force: true }); });
	$("ecoHeightmap").addEventListener("click", () => { void runHeightmaps(); });

	// Der Totmannschalter. `set_enabled` existiert serverseitig seit V2.1 und hatte bis heute KEINEN
	// Aufrufer im Client (grep set_enabled js/ -> leer) -- diese Kachel ist seine erste Oberfläche.
	// Der Zustand steht IN der Kachel, nicht daneben.
	$("ecoEnabled").addEventListener("click", async () => {
		if (moduleEnabled === null) { return; }          // never toggle blind
		const next = !moduleEnabled;
		// Switching OFF empties the public read path for everyone -- that deserves a question, and
		// the question has to name what happens, not ask "sind Sie sicher?".
		if (!next && !window.confirm("Landschaftsmodul ausschalten?\n\nDer öffentliche Lesepfad liefert dann keine Flächen mehr — die Landschaften verschwinden für alle von der Karte. Gezeichnet bleibt alles; Einschalten holt es zurück.")) {
			return;
		}
		$("ecoEnabled").disabled = true;
		try {
			setStatus(next ? "Landschaftsmodul wird eingeschaltet …" : "Landschaftsmodul wird ausgeschaltet …");
			const result = await ecoPost("set_enabled", { enabled: next });
			moduleEnabled = result.ecosystem_enabled === true;
			renderEnabledTile();
			flashStatus(moduleEnabled ? "Landschaftsmodul ist an." : "Landschaftsmodul ist aus.", "ok");
		} catch (error) {
			flashStatus("Schalten fehlgeschlagen: " + (error && error.message ? error.message : String(error)), "bad");
		} finally {
			$("ecoEnabled").disabled = false;
			renderEnabledTile();
		}
	});
}

// force=true always recomputes (the ribbon tile). Without it a cached answer for the CURRENT
// ecosystem_revision is reused -- that is what makes the result stand there on open.
//
// 🔴 Cache, not stored truth. The plan's „gerechnet, nie gespeichert" survives: the key IS the
// revision, so any write to a landscape geometry expires the answer by itself and the next open
// recomputes. Nothing here is a second, ageing copy of a geometry -- only the pairs and their shares.
async function runRaycast(options) {
	const force = !!(options && options.force);
	$("ecoRaycast").disabled = true;
	try {
		setStatus(force ? "Zugehörigkeit wird gerechnet …" : "Zugehörigkeit wird geladen …");
		if (allAreas === null) { allAreas = await loadAreas(); }

		// The territories are a second, independent question („liegt in"), and the political layer is a
		// known hotspot -- a failure there must not throw away the landscape half that succeeded.
		try {
			// 💣 „schon geladen" reicht als Bedingung NICHT. Der Zwischenspeicher legt die Territorien
			// bewusst OHNE Geometrie ab (raycastCacheWrite: „Geometrie NICHT -- die waere eine alternde
			// Zweitkopie"), und raycastCacheApply setzt `territories` beim Öffnen genau auf diesen
			// Index. Ein erzwungener Lauf sah dann eine nicht-leere Liste, sprang das Nachladen über
			// und lief in `boundsOverlap(area.bounds, undefined)` -- „Cannot read properties of
			// undefined (reading 'min_x')". Gemeldet 2026-07-29; älter als V9, aber V9 ist der erste
			// Weg, der zuverlässig darüber stolpert.
			const ohneGeometrie = Array.isArray(territories) && territories.length > 0
				&& !territories.some((territory) => territory && territory.geometry);
			if (territories === null || ohneGeometrie) {
				setStatus("Territorien werden geladen (Zoom 0–6) …");
				territories = await loadTerritories();
			}
		} catch (error) {
			territories = territories || [];
			territoryNote = "Territorien nicht geladen: " + (error && error.message ? error.message : String(error));
		}

		const cached = force ? null : raycastCacheRead();
		if (cached) {
			raycastCacheApply(cached);
			flashStatus("Zugehörigkeit aus dem Zwischenspeicher (Stand " + ecosystemRevision + ").", "ok");
		} else {
			raycast = computeRaycast(allAreas);
			if ((territories || []).length > 0) { territoryHits = computeTerritoryHits(allAreas, territories); }
			raycastCacheWrite();

			// V9: das dritte Ergebnis desselben Knopfes.
			if (allPaths === null) {
				setStatus("Wege werden geladen …");
				allPaths = await loadPaths();
			}
			setStatus("Wege × Flächen wird gerechnet …");
			pathAssignments = await computePathAssignments(allAreas, allPaths, (done, total) => {
				setStatus("Wege × Flächen … " + done + "/" + total);
			});

			setStatus("Wird gespeichert …");
			shareClamped = 0;
			const saved = await saveAssignments(
				pathAssignments.rows, overlapRowsFromRaycast(), territoryRowsFromHits(),
				pathAssignments.stats.chordMs + pathAssignments.stats.curveMs,
				(done, total) => setStatus("Speichert … " + done + "/" + total)
			);
			assignmentStamp = saved.status;

			flashStatus("Gerechnet und gespeichert: " + raycastNote
				+ (territoryNote ? " · " + territoryNote : "")
				+ " · Wege: " + pathAssignments.stats.chordRows + " Sehne / " + pathAssignments.stats.curveRows + " Kurve"
				+ " (" + Math.round(pathAssignments.stats.chordMs) + " ms + " + Math.round(pathAssignments.stats.curveMs) + " ms)"
				+ (saved.skipped > 0 ? " · " + saved.skipped + " Zeilen verworfen (Ort oder Fläche gelöscht)" : "")
				+ (shareClamped > 0 ? " · " + shareClamped + " Anteile über 100 % auf 100 % begrenzt" : ""),
				(saved.skipped > 0 || shareClamped > 0) ? "warn" : "ok");
		}

		// V9: liegt ein Stempel vor, sagt die Kachel den gespeicherten Stand -- der ist die
		// belastbare Aussage. Ohne Stempel (Antwort kam aus dem Zwischenspeicher) bleibt der alte Text.
		if (assignmentStamp) { renderAssignmentTile(); }
		else { $("ecoRaycastInfo").textContent = t("ecosystem.editor.raycast.done", "{areas} Flächen · {terr} Territorien", { areas: allAreas.length, terr: (territories || []).length }); }
		renderDetail();
		renderPreview();
	} catch (error) {
		$("ecoRaycastInfo").textContent = t("ecosystem.editor.raycast.failed", "fehlgeschlagen");
		flashStatus("Zugehörigkeit fehlgeschlagen: " + (error && error.message ? error.message : String(error)), "bad");
	} finally {
		$("ecoRaycast").disabled = false;
	}
}

// The tile IS the state display (Owner: status belongs in the button). Three states, and "unknown"
// is one of them -- a switch that shows "aus" while it simply has not asked yet is a lie.
function renderEnabledTile() {
	const tile = $("ecoEnabled");
	if (moduleEnabled === null) {
		$("ecoEnabledT1").textContent = t("ecosystem.editor.ribbon.enabled", "Landschaftsmodul");
		$("ecoEnabledInfo").textContent = t("ecosystem.editor.enabled.unknown", "Zustand unbekannt");
		tile.disabled = true;
		tile.classList.remove("avm-tile--on");
		return;
	}
	$("ecoEnabledT1").textContent = moduleEnabled
		? t("ecosystem.editor.enabled.on", "Landschaftsmodul AN")
		: t("ecosystem.editor.enabled.off", "Landschaftsmodul AUS");
	$("ecoEnabledInfo").textContent = moduleEnabled
		? t("ecosystem.editor.enabled.clickOff", "Klick schaltet aus")
